# A separate disposable PostgreSQL server; never points at the app database.
# The owner label lets scripts/test-sweep.mjs remove this project after a
# killed run, but only once the owning `pnpm test` process is gone.
services:
  postgres:
    image: postgres:17-alpine
    # tmpfs data counts toward the limit. Override with STARTER_TEST_PG_MEM.
    mem_limit: ${STARTER_TEST_PG_MEM:-512m}
    memswap_limit: ${STARTER_TEST_PG_MEM:-512m}
    labels:
      legend.test.owner: ${STARTER_TEST_OWNER:-}
    environment:
      POSTGRES_USER: starter_test
      POSTGRES_PASSWORD: ${STARTER_TEST_PASSWORD:?Run pnpm test or pnpm test:e2e}
      POSTGRES_DB: starter_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter_test -d starter_test"]
      interval: 1s
      timeout: 5s
      retries: 30

networks:
  default:
    labels:
      legend.test.owner: ${STARTER_TEST_OWNER:-}
