# A separate disposable PostgreSQL server; never points at the app database.
# The owner label lets scripts/test-sweep.mjs remove this project after a
# killed run, but only once the owning `pnpm test` process is gone.
services:
  postgres:
    image: ${STARTER_TEST_POSTGRES_IMAGE:-postgres:17-alpine}
    # Two light test lanes share a roughly 3 GiB VM: cap their total at 2 GiB.
    # tmpfs data counts toward the limit, alongside buffers and connections.
    # Earlier full runs OOM-killed at 512m/768m. Larger suites can override
    # STARTER_TEST_PG_MEM when running alone with enough VM capacity.
    mem_limit: ${STARTER_TEST_PG_MEM:-1024m}
    memswap_limit: ${STARTER_TEST_PG_MEM:-1024m}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - max_connections=50
    labels:
      legend.test.owner: ${STARTER_TEST_OWNER:-}
    environment:
      POSTGRES_USER: starter_test
      POSTGRES_PASSWORD: ${STARTER_TEST_PASSWORD:?Run pnpm test or pnpm test:e2e}
      POSTGRES_DB: ${LEGEND_TEST_DB_NAME:-starter_test}
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U starter_test -d ${LEGEND_TEST_DB_NAME:-starter_test}",
        ]
      interval: 1s
      timeout: 5s
      retries: 30

networks:
  default:
    labels:
      legend.test.owner: ${STARTER_TEST_OWNER:-}
