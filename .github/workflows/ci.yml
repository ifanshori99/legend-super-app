name: Express + TanStack Start monorepo checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm run setup
      - name: CI quality checks
        run: |
          pnpm exec node --test scripts/ci/*.test.mjs
          pnpm exec node scripts/ci/tenant-hardcode.mjs
          pnpm exec node scripts/ci/color.mjs
          pnpm exec node scripts/ci/pending.mjs
      # Non-blocking while the acceptance suites are written. Switch to
      # `pnpm traceability --strict` once all 125 PRD criteria have a test
      # reference (legend-itfk).
      - name: Acceptance-criteria traceability report
        run: pnpm traceability
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-criteria-matrix
          path: docs/plan/criteria-matrix.md
          retention-days: 7
      - name: Block high dependency advisories
        run: pnpm audit --audit-level high
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Mock-mode FE specs: a Vite dev server with VITE_API_MOCK=true, no
      # database (bead legend-n2sp). Uses the browser installed above.
      - run: pnpm test:e2e:mock
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
