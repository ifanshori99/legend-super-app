# clamd settings for the single-VM stack (docs/deployment.md, ClamAV). Mounted
# read-only over /etc/clamav/clamd.conf by deploy/single-vm/compose.yaml.
Foreground yes
LogTime yes
LogFile /dev/stdout
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
ConcurrentDatabaseReload no
# Without AlertExceedsMax a file above the limits is answered "OK" unscanned.
AlertExceedsMax yes
MaxFileSize 100M
MaxScanSize 200M
StreamMaxLength 12M
