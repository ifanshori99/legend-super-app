<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Integrasi WhatsApp · Legend</title><style>
@font-face{font-family:Jakarta;src:url('../assets/plus-jakarta-sans-latin.woff2')}*{box-sizing:border-box}body{margin:0;background:#f7f6f4;color:#1c1b19;font:16px/1.5 Jakarta,sans-serif}button,input{font:inherit}button{cursor:pointer}h1,h2,h3,p{margin:0}h1{font-size:26px;line-height:1.25}h2{font-size:21px;line-height:1.3}h3{font-size:16px}.app{display:flex;min-height:100vh}.side{width:240px;flex:none;background:#fbfaf9;border-right:1px solid #e8e5e1;padding:24px 16px}.logo{font-size:22px;font-weight:700;margin:0 12px 36px}.group{font-size:12px;letter-spacing:.09em;font-weight:700;color:#5f5b55;margin:24px 12px 8px}.nav{padding:10px 12px;color:#5f5b55;border-radius:8px}.nav.active{background:#e6eff0;color:#0f5e68;font-weight:700;border-left:3px solid #0f5e68}.main{flex:1;min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid #e8e5e1;display:flex;align-items:center;justify-content:space-between;padding:0 32px;font-weight:700}.mobile-logo{display:none}.account{font-size:13px;color:#5f5b55;font-weight:400}.content{max-width:1050px;margin:auto;padding:30px 32px 50px}.back{font-size:14px;font-weight:700;color:#5f5b55}.head{margin:18px 0 24px}.muted,.desc{color:#5f5b55}.head p{margin-top:7px}.desc{font-size:14px;margin-top:7px}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.8fr);gap:20px;align-items:start}.shell{background:#fbfaf9;border:1px solid #e8e5e1;border-radius:18px;padding:8px}.card{background:#fff;border:1px solid #e8e5e1;border-radius:12px;padding:24px}.row{display:flex;justify-content:space-between;gap:12px;align-items:start}.pill{background:#e4f5eb;color:#126c39;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap}.field{margin-top:20px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{display:block;width:100%;min-height:44px;border:1px solid #8a857d;border-radius:8px;padding:10px 12px;color:#1c1b19;background:white}.field input[aria-invalid=true]{border:2px solid #a42127}.help{font-size:14px;color:#5f5b55;margin-top:6px}.error{color:#a42127;font-size:14px;font-weight:600;margin-top:6px}.btn{min-height:44px;padding:9px 16px;border:1px solid #8a857d;border-radius:9px;background:#fff;color:#1c1b19;font-weight:700}.primary{background:#0f5e68;color:white;border-color:#0f5e68}.actions{margin-top:24px}.notice{background:#fdebeb;border-left:4px solid #a42228;border-radius:8px;padding:14px 16px;margin-bottom:20px}.notice.ok{background:#e4f5eb;border-color:#147a41}.notice p{margin-top:4px}.steps{padding-left:20px;margin:14px 0 0}.steps li{margin:10px 0}.sample{font-size:12px;color:#5f5b55;margin-top:18px}.empty{text-align:center;padding:46px 20px}.empty p{max-width:400px;margin:10px auto 20px}.skeleton{height:16px;border-radius:4px;background:#e8e5e1;margin:16px 0}.skeleton.short{width:45%}.skeleton.long{width:85%}button:focus-visible,input:focus-visible{outline:3px solid #0f5e68;outline-offset:2px}@media(max-width:700px){.side{display:none}.top{height:64px;padding:0 16px}.top-title{display:none}.mobile-logo{display:block}.content{padding:24px 16px 32px}.grid{display:block}.grid>.shell+.shell{margin-top:14px}.card{padding:20px}h1{font-size:24px}.primary{width:100%}.account{font-size:12px}.row{align-items:start}}
</style></head><body><div class="app"><aside class="side"><div class="logo">Legend</div><div class="group">OPERASIONAL</div><div class="nav">Ringkasan</div><div class="nav">Penjualan</div><div class="group">PENGATURAN</div><div class="nav">Pengguna &amp; peran</div><div class="nav active">Integrasi</div><div class="nav">Log audit</div></aside><div class="main"><header class="top"><span class="top-title">Pengaturan integrasi</span><span class="mobile-logo">☰ &nbsp; Legend</span><span class="account">Tenant Legend · Admin</span></header><main class="content"><div class="back">‹ &nbsp; Pengaturan</div><div class="head"><h1>Integrasi WhatsApp</h1><p class="muted">Kelola nomor WhatsApp Business untuk tenant ini.</p></div><div id="view"></div></main></div></div><script>
const state=new URLSearchParams(location.search).get('state')||'normal';
const isConflict=state==='conflict',isInvalid=state==='validation';
const form=`<div class="grid"><div class="shell"><form class="card" id="integration" novalidate><div class="row"><div><h2>WhatsApp Business</h2><p class="desc">Nomor penerima dan ID nomor dari Meta Business.</p></div>${state==='success'?'<span class="pill">✓ Disimpan</span>':''}</div><div class="field"><label for="number">Nomor WhatsApp</label><input id="number" inputmode="numeric" autocomplete="off" value="${isInvalid?'0812abc':'6281234567890'}" aria-describedby="number-help number-error" ${isInvalid||isConflict?'aria-invalid="true"':''}><div class="help" id="number-help">Masukkan nomor dengan kode negara atau awalan 0. Nomor disimpan sebagai angka dengan kode negara.</div><div class="error" id="number-error">${isInvalid?'Masukkan nomor WhatsApp yang valid, misalnya 081234567890.':isConflict?'Nomor atau ID ini sudah digunakan oleh tenant lain.':''}</div></div><div class="field"><label for="phone-id">ID nomor telepon</label><input id="phone-id" inputmode="numeric" autocomplete="off" value="${isInvalid?'id-salah':'123456789012345'}" aria-describedby="id-help id-error" ${isInvalid||isConflict?'aria-invalid="true"':''}><div class="help" id="id-help">Temukan ID nomor telepon di pengaturan WhatsApp Business pada Meta.</div><div class="error" id="id-error">${isInvalid?'Periksa ID nomor telepon di Meta Business, lalu masukkan kembali.':''}</div></div><div class="actions"><button class="btn primary" type="submit">Simpan integrasi</button></div><p class="sample">Nomor dan ID di atas adalah contoh data untuk mockup.</p></form></div><div class="shell"><section class="card"><h2>Perlu bantuan?</h2><p class="desc">Nomor atau ID nomor telepon yang aktif hanya dapat digunakan oleh satu tenant.</p><ol class="steps"><li>Periksa kembali nomor dan ID di Meta Business.</li><li>Jika masih bentrok, minta bantuan admin platform untuk memeriksa penggunaan nomor.</li></ol></section></div></div>`;
const notices={conflict:'<div class="notice" role="alert"><strong>! Integrasi belum disimpan.</strong><p>Nomor WhatsApp atau ID nomor telepon ini sudah digunakan. Periksa kembali keduanya atau minta bantuan admin platform.</p></div>',validation:'<div class="notice" role="alert"><strong>! Periksa kembali isian.</strong><p>Nomor WhatsApp dan ID nomor telepon harus valid sebelum disimpan.</p></div>',success:'<div class="notice ok" role="status"><strong>✓ Integrasi berhasil disimpan.</strong><p>Pengaturan WhatsApp untuk tenant ini telah diperbarui.</p></div>'};
const empty=`<div class="shell"><section class="card empty"><h2>Belum ada integrasi WhatsApp</h2><p class="muted">Tambahkan nomor WhatsApp Business untuk tenant ini.</p><button class="btn primary" onclick="location.search='?state=normal'">Atur WhatsApp</button></section></div>`;
const loading='<div class="shell"><div class="card" aria-busy="true"><h2>Memuat integrasi</h2><p class="desc">Mengambil pengaturan WhatsApp…</p><div class="skeleton short"></div><div class="skeleton long"></div><div class="skeleton long"></div></div></div>';
const error=`<div class="shell"><section class="card empty"><h2>Integrasi belum bisa dimuat</h2><p class="muted">Periksa koneksi lalu coba lagi.</p><button class="btn" onclick="location.search='?state=normal'">Coba lagi</button></section></div>`;
document.getElementById('view').innerHTML=state==='empty'?empty:state==='loading'?loading:state==='error'?error:(notices[state]||'')+form;
const integration=document.getElementById('integration');if(integration)integration.addEventListener('submit',e=>{e.preventDefault();const n=document.getElementById('number').value.trim(),id=document.getElementById('phone-id').value.trim();location.search='?state='+(/^(?:0|\+?62)[0-9 -]{7,17}$/.test(n)&&id.length>0?'success':'validation')});
</script></body></html>
