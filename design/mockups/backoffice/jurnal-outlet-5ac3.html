<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jurnal dan outlet · Legend</title><style>
@font-face{font-family:PJS;src:url('../assets/plus-jakarta-sans-latin.woff2')}*{box-sizing:border-box}body{margin:0;background:#f7f6f4;color:#1c1b19;font:16px/1.5 PJS,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #0f5e68;outline-offset:2px}.app{display:flex;min-height:100vh}.side{width:240px;flex:none;background:#fbfaf9;border-right:1px solid #e8e5e1;padding:24px 16px}.logo{font-size:22px;font-weight:700;margin:0 12px 36px}.group{font-size:12px;letter-spacing:.09em;font-weight:700;color:#5f5b55;margin:24px 12px 8px}.nav{padding:10px 12px;color:#5f5b55;border-radius:8px}.nav.active{background:#e6eff0;color:#0f5e68;font-weight:700;border-left:3px solid #0f5e68}.main{flex:1;min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid #e8e5e1;display:flex;align-items:center;justify-content:space-between;padding:0 32px;font-weight:700}.mobile-logo{display:none}.account,.sub{font-size:14px;color:#5f5b55}.content{max-width:1100px;margin:auto;padding:30px 32px 56px}h1,h2,h3,p{margin:0}h1{font-size:26px;line-height:1.25}h2{font-size:21px}h3{font-size:17px}.hint{color:#5f5b55;margin-top:6px}.head{display:flex;justify-content:space-between;gap:24px;margin-bottom:22px}.btn{min-height:44px;padding:9px 16px;border:1px solid #8a857d;border-radius:9px;background:#fff;color:#1c1b19;font-weight:700}.primary{background:#0f5e68;color:#fff;border-color:#0f5e68}.shell{background:#fbfaf9;border:1px solid #e8e5e1;border-radius:18px;padding:8px;margin-bottom:16px}.card{background:white;border:1px solid #e8e5e1;border-radius:12px;padding:22px}.tabs{display:inline-flex;padding:4px;background:#f1efec;border:1px solid #e8e5e1;border-radius:10px;margin-bottom:20px}.tabs a{padding:8px 14px;border-radius:7px;color:#5f5b55;text-decoration:none;font-weight:700;font-size:14px}.tabs .active{background:#fff;color:#1c1b19;box-shadow:0 1px 2px #0002}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin-top:16px}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;min-height:44px;background:white;border:1px solid #8a857d;border-radius:8px;padding:9px 12px;color:#1c1b19}.line{border-top:1px solid #e8e5e1;margin-top:20px;padding-top:18px}.linehead{display:flex;justify-content:space-between;align-items:center}.linegrid{display:grid;grid-template-columns:2fr 1.4fr 1fr 1fr;gap:12px}.sub{margin-top:5px}.amount{font-variant-numeric:tabular-nums;text-align:right}.sum{display:flex;justify-content:space-between;gap:20px;background:#f7f6f4;border-radius:10px;padding:16px;margin-top:20px}.sum strong{font-variant-numeric:tabular-nums}.sum div:last-child{text-align:right}.balanced{font-size:14px;color:#147a41;font-weight:700}.bad{font-size:14px;color:#a42127;font-weight:700}.notice{border-left:4px solid #147a41;background:#e4f5eb;padding:16px;margin-bottom:16px}.errorbox{border-left:4px solid #c02c31;background:#fdebeb;padding:16px;margin:16px 0}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.empty{text-align:center;padding:48px 16px}.skeleton{height:14px;border-radius:6px;background:#e8e5e1;margin:20px 0}.example{font-size:12px;color:#5f5b55;margin-top:16px}.minor{border:0;background:transparent;color:#0f5e68;font-weight:700;min-height:44px;padding:8px 0}@media(max-width:700px){.side{display:none}.top{height:64px;padding:0 16px}.top-title{display:none}.mobile-logo{display:block}.account{font-size:12px}.content{padding:24px 16px}.head{display:block}.card{padding:16px}.grid,.linegrid{grid-template-columns:1fr}.linegrid{gap:0}.sum{flex-wrap:wrap}.actions{flex-direction:column-reverse}.actions button{width:100%}.tabs{width:100%}.tabs a{flex:1;text-align:center}}
</style></head><body><div class="app"><aside class="side"><div class="logo">Legend</div><div class="group">OPERASIONAL</div><div class="nav">Ringkasan</div><div class="nav">Penjualan</div><div class="nav">Persediaan</div><div class="group">KEUANGAN</div><div class="nav active">Jurnal</div><div class="nav">Laporan keuangan</div><div class="group">PENGATURAN</div><div class="nav">Pengguna &amp; peran</div></aside><div class="main"><header class="top"><span class="top-title">Keuangan</span><span class="mobile-logo">☰ &nbsp; Legend</span><span class="account">Tenant Legend · Admin</span></header><main class="content"><div class="head"><div><h1 id="title">Jurnal manual</h1><p class="hint">Catat jurnal per badan usaha dan kaitkan baris ke outlet bila diperlukan.</p></div></div><nav class="tabs" aria-label="Jenis jurnal"><a href="?state=normal" id="manual">Manual</a><a href="?state=recurring" id="recurring">Berulang</a></nav><div id="notice"></div><div id="body"></div></main></div></div><script>
const state=new URLSearchParams(location.search).get('state')||'normal';const isRecurring=state==='recurring';document.getElementById(isRecurring?'recurring':'manual').className='active';document.getElementById('title').textContent=isRecurring?'Jurnal berulang':'Jurnal manual';const body=document.getElementById('body');
const field=(label,value,type='text')=>`<div class="field"><label>${label}</label><input type="${type}" value="${value}"></div>`;
const line=(n,account,outlet,debit,credit)=>`<div class="line"><div class="linehead"><h3>Baris ${n}</h3><span class="sub">${n===1?'Debit':'Kredit'}</span></div><div class="linegrid"><div class="field"><label>Akun</label><select><option>${account}</option></select></div><div class="field"><label>Outlet <span class="sub">(opsional)</span></label><select><option>${outlet}</option><option>Entitas · tanpa outlet</option><option>Outlet Kemang</option><option>Outlet Senopati</option></select></div>${field('Debit (Rp)',debit)}${field('Kredit (Rp)',credit)}</div></div>`;
if(state==='loading')body.innerHTML='<section class="shell"><div class="card"><h2>Memuat jurnal</h2><div class="skeleton" style="width:45%"></div><div class="skeleton" style="width:90%"></div><div class="skeleton" style="width:75%"></div><p class="sub">Memuat akun dan outlet…</p></div></section>';
else if(state==='error')body.innerHTML='<section class="shell"><div class="card empty"><h2>Data jurnal belum bisa dimuat</h2><p class="sub">Periksa koneksi, lalu coba lagi untuk memuat akun dan outlet.</p><p><button class="btn" onclick="location.search=\'?state=normal\'">Coba lagi</button></p></div></section>';
else if(state==='empty')body.innerHTML='<section class="shell"><div class="card empty"><h2>Belum ada akun untuk jurnal</h2><p class="sub">Tambahkan akun untuk badan usaha ini sebelum membuat jurnal.</p><p><button class="btn" onclick="location.search=\'?state=normal\'">Lihat contoh jurnal</button></p></div></section>';
else {if(state==='success')document.getElementById('notice').innerHTML='<div class="notice" role="status">Jurnal berhasil diajukan untuk persetujuan.</div>';const invalid=state==='validation';body.innerHTML=`<section class="shell"><div class="card"><h2>Rincian jurnal</h2><p class="sub">Pilih badan usaha dan isi keterangan jurnal.</p><div class="grid"><div class="field"><label>Badan usaha</label><select><option>PT Legend Kuliner</option></select></div>${field(isRecurring?'Mulai tanggal':'Tanggal jurnal','2026-11-11','date')}${field('Keterangan',isRecurring?'Alokasi biaya sewa bulanan':'Alokasi biaya sewa November')}${isRecurring?'<div class="field"><label>Frekuensi</label><select><option>Setiap bulan</option></select></div>':''}</div></div></section><section class="shell"><div class="card"><h2>Baris jurnal</h2><p class="sub">Pilih outlet pada tiap baris untuk laporan per outlet. Tanpa outlet, baris dicatat pada tingkat badan usaha.</p>${line(1,'Beban sewa','Outlet Kemang','500.000','0')}${line(2,'Utang sewa','Entitas · tanpa outlet','0',invalid?'400.000':'500.000')}<button class="minor" onclick="location.search='?state=empty'">+ Tambah baris</button>${invalid?'<div class="errorbox" role="alert"><strong>Jurnal belum seimbang</strong><br>Debit lebih besar Rp 100.000. Sesuaikan jumlah debit atau kredit sebelum mengajukan.</div>':''}<div class="sum"><div><span class="sub">Total debit</span><br><strong>Rp 500.000</strong></div><div><span class="sub">Total kredit</span><br><strong>Rp ${invalid?'400.000':'500.000'}</strong></div><div><span class="sub">Selisih</span><br><strong>Rp ${invalid?'100.000':'0'}</strong><br><span class="${invalid?'bad':'balanced'}">${invalid?'Belum seimbang':'✓ Seimbang'}</span></div></div><p class="sub">Jurnal harus seimbang dan memerlukan persetujuan sebelum dibukukan.</p><div class="actions"><button class="btn" onclick="location.search='?state=normal'">Batal</button><button class="btn primary" onclick="location.search='?state=${invalid?'validation':'success'}'">Ajukan untuk persetujuan</button></div><p class="example">Data ilustrasi untuk peninjauan mockup.</p></div></section>`}
</script></body></html>
