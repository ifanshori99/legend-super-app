lumn-reverse;align-items:stretch}.foot .btn{width:100%}}
</style></head><body><div class="app"><aside class="side"><div class="logo">Legend</div><div class="group">OPERASIONAL</div><div class="nav">Ringkasan</div><div class="nav">Penjualan</div><div class="nav">Persediaan</div><div class="group">KEUANGAN</div><div class="nav active">Daftar akun</div><div class="nav">Jurnal</div><div class="nav">Laporan keuangan</div></aside><div class="main"><header class="top"><div><span class="mobile">☰ &nbsp; </span>Keuangan</div><span>Admin keuangan</span></header><main class="content"><div class="back">‹ &nbsp; Daftar akun</div><div class="head"><div><h1>Pemetaan akun jurnal otomatis</h1><p class="muted">Tentukan akun untuk setiap peran jurnal di badan usaha ini.</p></div><button class="btn">Lihat daftar akun</button></div><div id="page"></div></main></div></div><script>
let state=new URLSearchParams(location.search).get('state')||'normal';
const roles=[['Kas outlet','Aset','1101 · Kas Outlet'],['Kas kecil','Aset','1102 · Kas Kecil'],['Bank operasional','Aset','1103 · Bank Operasional'],['Kliring payment gateway','Aset','1202 · Kliring Payment Gateway'],['Kliring EDC','Aset','1203 · Kliring EDC'],['Piutang usaha','Aset','1201 · Piutang Usaha'],['Persediaan bahan baku','Aset','1301 · Persediaan Bahan Baku'],['Persediaan barang setengah jadi','Aset','1302 · Persediaan Barang Setengah Jadi'],['PPN masukan','Aset','1401 · PPN Masukan'],['Aset tetap','Aset','1501 · Peralatan Dapur dan Bar'],['Akumulasi penyusutan','Aset','1502 · Akumulasi Penyusutan Peralatan'],['Utang usaha','Liabilitas','2101 · Utang Usaha'],['Barang diterima belum ditagih','Liabilitas','2102 · Barang Diterima Belum Ditagih'],['Utang gaji','Liabilitas','2103 · Utang Gaji'],['Utang BPJS','Liabilitas','2104 · Utang BPJS'],['Liabilitas poin loyalty','Liabilitas','2105 · Liabilitas Poin Loyalty'],['Utang PBJT','Liabilitas','2201 · Utang PBJT'],['Utang PPh 21','Liabilitas','2202 · Utang PPh 21'],['Utang PPh 23','Liabilitas','2203 · Utang PPh 23'],['Utang PPh dividen','Liabilitas','2204 · Utang PPh Dividen'],['Laba ditahan','Ekuitas',''],['Ekuitas saldo awal','Ekuitas',''],['Pendapatan penjualan','Pendapatan',''],['Diskon penjualan','Pendapatan',''],['Pendapatan poin kedaluwarsa','Pendapatan',''],['Pembulatan','Pendapatan',''],['Hasil pelepasan aset','Pendapatan',''],['Surplus revaluasi','Ekuitas',''],['Kerugian revaluasi aset','Beban',''],['Harga pokok penjualan','Beban',''],['Beban waste','Beban',''],['Penyesuaian persediaan','Beban',''],['Beban gaji','Beban',''],['Beban BPJS','Beban',''],['Beban payment gateway','Beban',''],['Beban penyusutan','Beban',''],['Beban jasa','Beban',''],['Selisih kas','Beban',''],['Service charge','Semua jenis akun','2106 · Utang Service Charge']];
const choices={Aset:roles.filter(r=>r[1]==='Aset'&&r[2]).map(r=>r[2]),Liabilitas:roles.filter(r=>r[1]==='Liabilitas'&&r[2]).map(r=>r[2]),Ekuitas:['3101 · Modal Disetor','3102 · Laba Ditahan','3103 · Ekuitas Saldo Awal','3104 · Surplus Revaluasi Aset Tetap'],Pendapatan:['4101 · Penjualan Makanan dan Minuman','4102 · Pendapatan Fasilitas','4103 · Diskon Penjualan','4104 · Pendapatan Poin Kedaluwarsa','7101 · Pembulatan Kas','7102 · Laba (Rugi) Pelepasan Aset'],Beban:['5101 · HPP Makanan dan Minuman','5102 · Waste dan Spoilage','5103 · Selisih Stok Opname','6101 · Beban Gaji','6102 · Beban BPJS Perusahaan','6103 · Beban Payment Gateway','6104 · Beban Penyusutan','6107 · Beban Jasa Pihak Ketiga','6108 · Selisih Kas','8102 · Rugi Revaluasi Aset Tetap']};
choices['Semua jenis akun']=[...choices.Aset,...choices.Liabilitas,...choices.Ekuitas,...choices.Pendapatan,...choices.Beban,'2106 · Utang Service Charge'];
let saved=roles.map(r=>r[2]), draft=[...saved];
if(state==='validation')draft[0]='1100 · Kas dan Setara Kas';
const page=document.getElementById('page');
function render(){
 const count=draft.filter(Boolean).length, missing=roles.length-count;
 const scope=`<section class="outer"><div class="card"><div class="row"><div><label class="label" for="entity">Badan usaha</label><select class="select entity" id="entity"><option>PT Legend Indonesia</option></select><p class="caption">Pemetaan berlaku untuk badan usaha yang dipilih.</p></div><div><div class="label">Kelengkapan pemetaan</div><div class="summary">${count} dari ${roles.length} peran dipetakan</div><p class="caption">Contoh data</p></div></div></div></section>`;
 let out='';
 if(state==='loading')out=scope+`<section class="outer"><div class="card" aria-busy="true"><h2>Memuat pemetaan akun</h2><p class="caption">Mohon tunggu sebentar.</p><div class="skeleton short"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></section>`;
 else if(state==='error')out=scope+`<div class="banner error"><strong>⚠ Pemetaan belum dapat dimuat.</strong><br>Periksa koneksi dan coba lagi. Perubahan belum dilakukan.</div><section class="outer"><div class="card empty"><h2>Data tidak tersedia</h2><p>Daftar peran dan akun belum berhasil dimuat.</p><button class="btn" data-action="retry">Coba lagi</button></div></section>`;
 else if(state==='empty')out=`<section class="outer"><div class="card empty"><h2>Belum ada badan usaha</h2><p>Tambahkan badan usaha dan akun di daftar akun sebelum membuat pemetaan jurnal otomatis.</p><button class="btn primary" data-action="accounts">Buka daftar akun</button></div></section>`;
 else if(state==='accounts')out=`<section class="outer"><div class="card"><h2>Daftar akun</h2><p class="caption">Contoh akun untuk badan usaha ini. Kelola akun di layar daftar akun.</p><div class="item" style="padding:20px 0">1101 · Kas Outlet<br>1102 · Kas Kecil<br>1103 · Bank Operasional</div><button class="btn" data-action="back">Kembali ke pemetaan</button></div></section>`;
 else {
  const validation=state==='validation';
  const rows=roles.map(([name,type],i)=>{
   const invalid=draft[i]==='1100 · Kas dan Setara Kas';
   const options=['<option value="">Pilih akun aktif</option>',...(invalid?['<option selected value="1100 · Kas dan Setara Kas">1100 · Kas dan Setara Kas</option>']:[]),...choices[type].map(account=>`<option value="${account}" ${draft[i]===account?'selected':''}>${account}</option>`)].join('');
   return `<tr><td>${name}</td><td>${type}</td><td><select class="select ${invalid?'invalid':''}" data-role="${i}" aria-label="Akun untuk ${name}" ${invalid?'aria-invalid="true" aria-describedby="issue-0"':''}>${options}</select>${invalid?'<div class="issue" id="issue-0">⚠ Pilih akun aktif yang bukan akun induk.</div>':''}</td></tr>`;
  }).join('');
  let banner=validation?`<div class="banner error" role="alert"><strong>⚠ Pemetaan belum disimpan.</strong><br>Periksa akun yang ditandai, lalu simpan kembali.</div>`:state==='success'?`<div class="banner ok" role="status"><strong>✓ Pemetaan disimpan.</strong><br>Perubahan untuk badan usaha ini tersimpan dalam contoh ini.</div>`:missing?`<div class="banner"><strong>⚠ Pemetaan belum lengkap.</strong><br>Jurnal otomatis yang memerlukan peran tanpa akun tidak dapat diposting sampai perannya dipetakan.</div>`:'';
  out=scope+banner+`<section class="outer"><div class="card"><div class="sectionhead"><div><h2>Peran dan akun</h2><p class="caption">Pilih akun aktif paling akhir dalam hierarki dengan jenis yang sesuai.</p></div><span class="tag">${missing?`● ${missing} belum dipetakan`:'✓ Semua peran dipetakan'}</span></div><table class="table"><thead><tr><th>Peran jurnal</th><th>Jenis akun</th><th>Akun yang digunakan</th></tr></thead><tbody>${rows}</tbody></table><div class="foot"><button class="btn" data-action="cancel">Batalkan perubahan</button><button class="btn primary" data-action="save">Simpan pemetaan</button></div><p class="sample">Contoh data · Akun dan badan usaha ditampilkan untuk ilustrasi. Perubahan hanya berlaku di mockup ini.</p></div></section>`;
 }
 page.innerHTML=out;
}
page.addEventListener('change',event=>{if(event.target.matches('[data-role]')){draft[Number(event.target.dataset.role)]=event.target.value;const y=scrollY;state='normal';render();scrollTo(0,y);}});
document.addEventListener('click',event=>{
 let action=event.target.closest('[data-action]')?.dataset.action;
 if(!action&&event.target.matches('.head .btn'))action='accounts';
 if(!action)return;
 if(action==='accounts'){state='accounts';render();scrollTo(0,0);}
 if(action==='back'){state='normal';render();scrollTo(0,0);}
 if(action==='retry'){state='loading';render();setTimeout(()=>{state='normal';render();},500);}
 if(action==='cancel'){draft=[...saved];state='normal';render();scrollTo(0,0);}
 if(action==='save'){if(draft.includes('1100 · Kas dan Setara Kas')){state='validation';render();scrollTo(0,0);return;}saved=[...draft];state='success';render();scrollTo(0,0);}
});
render();
</script></body></html>
