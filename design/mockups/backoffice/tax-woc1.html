@font-face{font-family:'Plus Jakarta Sans';src:url('../assets/plus-jakarta-sans-latin.woff2') format('woff2');font-weight:400 700;font-display:swap}*{box-sizing:border-box}body{margin:0;font:16px/1.5 'Plus Jakarta Sans',Arial,sans-serif;color:#1c1b19;background:#f7f6f4}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #0f5e68;outline-offset:2px}.app{display:flex;min-height:100vh}.side{width:240px;flex:none;background:#fbfaf9;border-right:1px solid #e8e5e1;padding:24px 16px}.logo{font-size:22px;font-weight:700;margin:0 12px 36px}.group{font-size:12px;letter-spacing:.09em;font-weight:700;color:#5f5b55;margin:24px 12px 8px}.nav{padding:10px 12px;color:#5f5b55;border-radius:8px}.nav.active{background:#e6eff0;color:#0f5e68;font-weight:700;border-left:3px solid #0f5e68}.main{flex:1;min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid #e8e5e1;display:flex;align-items:center;justify-content:space-between;padding:0 32px;font-weight:700}.account{font-size:13px;color:#5f5b55;font-weight:400}.mobile-logo{display:none}.content{max-width:1100px;margin:auto;padding:30px 32px 50px}.heading{display:flex;justify-content:space-between;align-items:start;gap:24px;margin-bottom:22px}h1,h2,h3,p{margin:0}h1{font-size:26px;line-height:1.25}h2{font-size:21px}h3{font-size:17px}.hint{color:#5f5b55;margin-top:6px}.btn{min-height:44px;padding:9px 16px;border:1px solid #8a857d;border-radius:9px;background:#fff;color:#1c1b19;font-weight:700}.primary{background:#0f5e68;color:#fff;border-color:#0f5e68}.shell{background:#fbfaf9;border:1px solid #e8e5e1;border-radius:18px;padding:8px}.card{background:#fff;border:1px solid #e8e5e1;border-radius:12px;padding:22px}.sub{font-size:14px;color:#5f5b55;margin-top:4px}.table{width:100%;border-collapse:collapse;margin-top:20px}.table th{text-align:left;color:#5f5b55;font-size:13px;font-weight:600}.table th,.table td{border-bottom:1px solid #e8e5e1;padding:14px 8px}.table tr:last-child td{border:0}.table td:last-child{text-align:right}.name{font-weight:700}.tag{display:inline-block;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;background:#f1efec;color:#3d3a35}.muted{color:#5f5b55;font-size:13px}.textbtn{border:0;background:transparent;color:#0f5e68;font-weight:700;min-height:44px;padding:8px}.empty{text-align:center;padding:48px 16px}.empty .btn{margin-top:20px}.warn{border-left:4px solid #c02c31;background:#fdebeb;padding:16px;margin-bottom:16px}.skeleton{height:14px;border-radius:6px;background:#e8e5e1;margin:20px 0}.dialog{width:calc(100% - 32px);max-width:480px;background:white;border:0;border-radius:14px;padding:24px;box-shadow:0 16px 48px #0003}.dialog::backdrop{background:#1c1b1988}.dialog p{color:#5f5b55;margin:8px 0 20px}.field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;min-height:44px;border:1px solid #8a857d;border-radius:8px;padding:10px 12px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.error{color:#a42127;font-size:14px;margin-top:6px}.example{font-size:12px;color:#5f5b55;margin-top:16px}@media(max-width:700px){.side{display:none}.top{height:64px;padding:0 16px}.top-title{display:none}.mobile-logo{display:block}.account{font-size:12px}.content{padding:24px 16px}.heading{display:block}.heading .btn{width:100%;margin-top:16px}.card{padding:16px}.table,.table tbody,.table tr,.table td{display:block}.table thead{display:none}.table tr{position:relative;padding:16px 0;border-bottom:1px solid #e8e5e1}.table tr:last-child{border:0}.table td{padding:3px 0;border:0}.table td:last-child{text-align:left}.actions{flex-direction:column-reverse}.actions button{width:100%}.dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:16px 16px 0 0}}

select{font:inherit;width:100%;min-height:44px;border:1px solid #8a857d;border-radius:8px;padding:9px;background:#fff;color:#1c1b19}.wide{max-width:680px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.choice{display:flex;align-items:center;gap:10px;padding:8px 0}.choice input{width:20px;height:20px;min-height:0}.scope{padding:14px;background:#f7f6f4;border-radius:8px;margin-top:8px}.tabs{display:flex;gap:20px;border-bottom:1px solid #e8e5e1;margin-bottom:20px}.tabs a{padding:12px 0;color:#5f5b55;text-decoration:none}.tabs a.active{color:#0f5e68;border-bottom:3px solid #0f5e68;font-weight:700}.banner{border-left:4px solid #0f5e68;background:#e6eff0;padding:14px;margin:16px 0}.danger{color:#a42127}.outline{border-color:#a42127;color:#a42127}.dialog{max-height:90vh;overflow:auto}.small{font-size:14px}.tag.live{background:#e4f5eb;color:#17613a}.tag.draft{background:#fff2d8;color:#775000}.caption{margin-top:20px;color:#5f5b55;font-size:12px}@media(max-width:700px){.field-grid{grid-template-columns:1fr}.tabs{gap:14px;overflow:auto;white-space:nowrap}.dialog{max-height:90vh}.table td:before{content:attr(data-label);display:inline-block;color:#5f5b55;min-width:100px;font-size:13px}.table td:first-child:before,.table td:last-child:before{content:none}}
</style></head><body><div class="app"><aside class="side"><div class="logo">Legend</div><div class="group">OPERASIONAL</div><div class="nav">Ringkasan</div><div class="nav">Penjualan</div><div class="nav">Menu</div><div class="group">PENGATURAN</div><div class="nav active">Pajak & layanan</div><div class="nav">Pengguna & peran</div></aside><div class="main"><header class="top"><span class="top-title">Pajak & layanan</span><span class="mobile-logo">☰ &nbsp; Legend</span><span class="account">Tenant Legend · Admin</span></header><main class="content"><div class="heading"><div><h1>Pajak & layanan</h1><p class="hint">Kelola aturan pajak dan cara perhitungannya.</p></div><button class="btn primary" onclick="go('add')">+ Buat aturan</button></div><nav class="tabs"><a href="?state=normal" id="rules-tab">Aturan pajak</a><a href="?state=settings" id="settings-tab">Opsi perhitungan</a><a href="?state=normal">Service charge</a></nav><div id="notice"></div><section class="shell"><div class="card" id="content"></div></section><p class="caption">Data ilustrasi untuk peninjauan mockup.</p></main></div></div><dialog id="modal" class="dialog wide"></dialog><script>
const state=new URLSearchParams(location.search).get('state')||'normal', content=document.querySelector('#content'), modal=document.querySelector('#modal');function go(s){location.search='?state='+s}
let settings=['settings','settings-edit','settings-discard','settings-success'].includes(state);document.querySelector(settings?'#settings-tab':'#rules-tab').classList.add('active');
const rules=`<h2>Aturan pajak</h2><p class="sub">Versi yang diterbitkan berlaku sesuai tanggal efektif. Draf dapat diubah atau dibuang.</p><table class="table"><thead><tr><th>Aturan</th><th>Cakupan</th><th>Tarif</th><th>Berlaku mulai</th><th>Status & aksi</th></tr></thead><tbody><tr><td class="name">PBJT makanan & minuman<br><span class="muted">PBJT_FB · Versi 2</span></td><td data-label="Cakupan">Outlet Dago</td><td data-label="Tarif">10%</td><td data-label="Berlaku">1 Jan 2027</td><td><span class="tag draft">Draf</span><br><button class="textbtn" onclick="go('edit')">Ubah</button><button class="textbtn danger" onclick="go('discard')">Buang draf</button></td></tr><tr><td class="name">PBJT makanan & minuman<br><span class="muted">PBJT_FB · Versi 1</span></td><td data-label="Cakupan">Semua outlet</td><td data-label="Tarif">10%</td><td data-label="Berlaku">1 Jan 2026</td><td><span class="tag live">Diterbitkan</span></td></tr></tbody></table>`;
const options=`<h2>Opsi perhitungan</h2><p class="sub">Atur harga termasuk pajak, urutan perhitungan, dan pembulatan.</p><table class="table"><thead><tr><th>Versi</th><th>Berlaku mulai</th><th>Status & aksi</th></tr></thead><tbody><tr><td class="name">Opsi perhitungan · Versi 2</td><td data-label="Berlaku">1 Jan 2027</td><td><span class="tag draft">Draf</span><br><button class="textbtn" onclick="go('settings-edit')">Ubah</button><button class="textbtn danger" onclick="go('settings-discard')">Buang draf</button></td></tr><tr><td class="name">Opsi perhitungan · Versi 1</td><td data-label="Berlaku">1 Jan 2026</td><td><span class="tag live">Diterbitkan</span></td></tr></tbody></table>`;
content.innerHTML=settings?options:rules;
if(state==='empty')content.innerHTML=`<div class="empty"><h3>Belum ada aturan pajak</h3><p class="sub">Buat aturan untuk menentukan pajak yang berlaku pada item atau kategori.</p><button class="btn primary" onclick="go('add')">Buat aturan</button></div>`;
if(state==='error')content.innerHTML=`<div class="empty"><h3>Aturan pajak belum bisa dimuat</h3><p class="sub">Periksa koneksi, lalu coba lagi.</p><button class="btn" onclick="go('normal')">Coba lagi</button></div>`;
if(state==='loading')content.innerHTML='<h2>Aturan pajak</h2><p class="sub">Memuat aturan pajak…</p><div class="skeleton" style="width:80%"></div><div class="skeleton"></div><div class="skeleton" style="width:90%"></div>';
if(state==='success'||state==='settings-success'){content.querySelector('tbody tr').remove();document.querySelector('#notice').innerHTML='<div class="banner" role="status">Draf berhasil dibuang. Versi yang diterbitkan tetap berlaku.</div>';}
if(['add','edit','invalid'].includes(state)){modal.innerHTML=`<h2>${state==='add'?'Buat aturan pajak':'Ubah draf aturan pajak'}</h2><p>${state==='add'?'Aturan baru disimpan sebagai draf sebelum diterbitkan.':'PBJT_FB · Versi 2. Perubahan disimpan sebagai draf sebelum diterbitkan.'}</p><div class="field-grid"><div class="field"><label for="name">Nama aturan</label><input id="name" value="${state==='add'?'':'PBJT makanan & minuman'}"></div>${state==='add'?'<div class="field"><label for="code">Kode aturan</label><input id="code" value=""><div class="sub">Kode mengenali aturan di semua outlet.</div></div>':''}<div class="field"><label for="rate">Tarif (%)</label><input id="rate" value="${['invalid','add'].includes(state)?'':'10'}" inputmode="decimal">${state==='invalid'?'<div class="error">Masukkan tarif pajak.</div>':''}</div><div class="field"><label for="scope">Berlaku untuk outlet</label><select id="scope">${state==='add'?'<option>Semua outlet</option><option>Outlet Dago</option>':'<option>Outlet Dago</option><option>Semua outlet</option>'}</select><div class="sub">Versi outlet menggantikan aturan dengan kode yang sama untuk outlet ini.</div></div><div class="field"><label for="date">Berlaku mulai</label><input id="date" type="date" value="${state==='add'?'':'2027-01-01'}"></div></div><div class="field"><label>Jenis item</label><div class="choice"><input type="checkbox" checked id="food"><label for="food">Makanan & minuman</label></div></div><div class="field"><label for="category">Kategori menu</label><select id="category" multiple size="3"><option selected>Makanan</option><option selected>Minuman</option><option>Fasilitas</option></select><div class="sub">Pilih satu atau lebih kategori dari menu.</div></div><div class="field"><label for="items">Item menu</label><select id="items" multiple size="3"><option selected>Kopi susu</option><option selected>Nasi goreng</option><option>Shower</option></select><div class="sub">Pilih item tertentu dari menu.</div></div><div class="actions"><button class="btn" onclick="modal.close()">Batal</button><button class="btn primary" onclick="go('normal')">Simpan draf</button></div>`;content.innerHTML=modal.innerHTML;content.querySelector('button').onclick=()=>go('normal')}
if(['discard','settings-discard'].includes(state)){modal.innerHTML=`<h2>Buang draf ${settings?'opsi perhitungan':'aturan pajak'}?</h2><p>Draf versi 2 akan diarsipkan dan tidak dapat diterbitkan. Versi yang sudah diterbitkan tetap berlaku.</p><div class="scope"><strong>${settings?'Opsi perhitungan':'PBJT makanan & minuman'}</strong><div class="sub">Draf · Berlaku mulai 1 Jan 2027${settings?'':' · Outlet Dago'}</div></div><div class="actions"><button class="btn" onclick="modal.close()">Batal</button><button class="btn outline" onclick="go('${settings?'settings-success':'success'}')">Buang draf</button></div>`;modal.showModal()}
if(state==='settings-edit'){modal.innerHTML=`<h2>Ubah draf opsi perhitungan</h2><p>Perubahan disimpan sebagai draf sebelum diterbitkan.</p><div class="field"><label for="price">Harga menu</label><select id="price"><option>Belum termasuk pajak</option><option>Sudah termasuk pajak</option></select></div><div class="field"><label for="order">Urutan perhitungan</label><select id="order"><option>Diskon → service charge → pajak</option></select></div><div class="field"><label for="rounding">Pembulatan</label><select id="rounding"><option>Ke rupiah terdekat</option></select></div><div class="field"><label for="effective">Berlaku mulai</label><input id="effective" type="date" value="2027-01-01"></div><div class="actions"><button class="btn" onclick="modal.close()">Batal</button><button class="btn primary" onclick="go('settings')">Simpan draf</button></div>`;modal.showModal()}
</script></body></html>
