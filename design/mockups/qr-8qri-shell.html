<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perjalanan QR · Contoh tenant</title><link rel="stylesheet" href="final-a-mobile.css"><style>
.phone{--action:#a83a17;--canvas:#faf6f0;--paper:#fffcf7}.brand-mark{display:flex;align-items:center;gap:10px}.mark-circle{width:38px;height:38px;border:1px solid #796252;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800}.floating-header{padding:8px 12px}.shell-main{position:absolute;top:145px;left:20px;right:20px}.shell-main h1{margin-bottom:8px}.shell-main p{color:var(--muted)}.shell-main .card p{font-size:14px;line-height:20px}.shell-main .catalog{position:static;margin-top:18px}.shell-main .card h3{white-space:normal}.shell-main .card .photo{aspect-ratio:1}.intro{font-size:14px;line-height:20px}.table-context{display:flex;justify-content:space-between;align-items:center;background:white;border-radius:14px;padding:12px 14px;margin-top:16px}.table-context span{font-size:14px}.table-context b{display:block}.table-context button{text-decoration:underline;font-weight:700;font-size:14px}.shell-main .primary{margin-top:20px;width:100%}.state{top:178px}.state-icon{width:56px;height:56px;display:grid;place-items:center;background:#f1e7da;border-radius:50%;font-size:24px;margin-bottom:20px}.state h1{font-size:24px}.state p{margin-top:8px}.state .secondary{width:100%;height:48px;border:1px solid var(--edge);border-radius:14px;margin-top:12px;font-weight:700}.skeleton{background:#e9e0d5;border-radius:12px}.sk-line{height:16px;margin-top:12px}.sk-title{height:28px;width:65%}.sk-card{height:180px}.sk-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}.payment-main{top:120px}.expiry{margin-top:12px;font-size:14px;color:var(--muted)}.payment-main .qris-paper{margin-top:16px}.payment-main .qris-paper img{width:180px;height:180px}.payment-main .pay-instructions{margin-top:8px}.subdued{font-size:12px;line-height:18px}.sample-tenant{font-size:12px;color:var(--muted)}
</style></head><body><main id="root"></main><script>
const state=new URLSearchParams(location.search).get('layar')||'normal';
const header=`<div class="photo-band"></div><header class="glass glass-light floating-header"><div class="header-row"><div class="brand-mark"><span class="mark-circle">CL</span><div class="brand">Cafe Legend<span class="brand-context">Seminyak · Meja A01</span></div></div><span class="icon-button" aria-hidden="true">⌕</span></div></header>`;
const cards=`<div class="catalog"><article class="card"><div class="photo p0"><button class="add-round" aria-label="Tambah Espresso dingin">+</button></div><h3>Espresso dingin</h3><p>Espresso pekat, disajikan dingin.</p><div class="price">Rp 23.000</div></article><article class="card"><div class="photo p1"><button class="add-round" aria-label="Tambah Cappuccino">+</button></div><h3>Cappuccino</h3><p>Espresso dan susu, buihnya lembut.</p><div class="price">Rp 23.000</div></article></div>`;
const screens={normal:`<div class="shell-main"><p class="intro">Selamat datang di Cafe Legend</p><h1>Pesan dari meja Anda</h1><div class="table-context"><span>Meja A01<b>2 tamu · Sesi bersama</b></span><button>Ubah</button></div>${cards}</div><div class="glass glass-dark cart-bar" style="min-height:80px"><div class="cart-main"><span><small>Subtotal · 1 item</small><b class="amount">Rp 23.000</b></span><span class="cart-action">Lihat keranjang →</span></div></div>`,
pembayaran:`<header class="glass glass-light nav-glass"><button class="icon-button" aria-label="Kembali">‹</button><h1>Bayar dengan QRIS</h1><span class="end"></span></header><div class="payment-main"><p class="eyebrow">Total pembayaran</p><div class="pay-total">Rp 26.600</div><div class="timer">◷ &nbsp;Sisa waktu <b>04:58</b></div><p class="expiry">Berlaku sampai <b>14.30 WITA</b><br><span class="subdued">Waktu outlet · Seminyak</span></p><div class="qris-paper"><h2>Cafe Legend</h2><p class="meta">Meja A01 · Pesanan QR-0044</p><img src="assets/qris-contoh.svg" alt="QR contoh bukan untuk pembayaran"><p class="sample-qr">QR contoh · Tidak untuk pembayaran</p></div><p class="waiting-state"><span class="waiting-dot"></span>Menunggu pembayaran</p><p class="pay-instructions">Scan atau simpan QR, lalu bayar melalui aplikasi bank atau e-wallet Anda.</p></div><footer class="glass glass-light float-footer pay-footer"><button class="primary">Simpan QR</button><button class="text-link">Ganti metode bayar</button></footer>`,
kosong:`<div class="shell-main state"><div class="state-icon">⌕</div><h1>Menu belum tersedia</h1><p>Cafe Legend belum menyediakan menu untuk meja ini. Silakan minta bantuan staf outlet.</p><button class="primary">Panggil waiter</button></div>`,
error:`<div class="shell-main state"><div class="state-icon">!</div><h1>Menu belum dapat dimuat</h1><p>Periksa koneksi internet Anda, lalu coba lagi. Jika masih bermasalah, minta bantuan staf outlet.</p><button class="primary">Coba lagi</button><button class="secondary">Minta bantuan staf</button></div>`,
loading:`<div class="shell-main" aria-label="Memuat menu" role="status"><p class="intro">Menyiapkan menu Cafe Legend…</p><div class="skeleton sk-title" style="margin-top:20px"></div><div class="skeleton sk-line" style="width:45%"></div><div class="skeleton" style="height:68px;margin-top:24px"></div><div class="sk-grid"><div><div class="skeleton sk-card"></div><div class="skeleton sk-line"></div><div class="skeleton sk-line" style="width:70%"></div></div><div><div class="skeleton sk-card"></div><div class="skeleton sk-line"></div><div class="skeleton sk-line" style="width:70%"></div></div></div></div>`};
document.getElementById('root').innerHTML=`<div class="phone"><div class="status"><span>9.41</span><span>▮▮ ▰</span></div>${state==='pembayaran'?'<div class="photo-band"></div>':header}${screens[state]||screens.normal}</div>`;
</script></body></html>
