<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservasi dan daftar tunggu · Cafe Legend</title><link rel="stylesheet" href="final-a-mobile.css"><link rel="stylesheet" href="qr-d6d1-booking-mobile.css"><main class="phone"><div class="status"><span>9.41</span><span>▮▮▮  ▰</span></div><div class="photo-band"></div><header class="glass glass-light nav-glass"><button class="icon-button" aria-label="Kembali">‹</button><h1 id="nav"></h1><span class="end"></span></header><div id="content"></div></main><script>

'zona-kosong':`<h1>Belum ada zona tersedia</h1><p class="lead">Tidak ada zona yang bisa dipilih untuk waktu ini. Coba tanggal atau jam lain.</p>${summary}<div class="empty-icon">⌁</div>`,

dp:`<span class="badge">◷ Menunggu pembayaran DP</span><h1>Lanjutkan pembayaran</h1><p class="lead">Reservasi belum terkonfirmasi. Bayar DP melalui tautan pembayaran untuk melanjutkan.</p>${summary}<div class="paper"><span>DP reservasi</span><strong>Rp 100.000</strong><p>Anda akan diarahkan ke halaman pembayaran yang aman.</p></div><p class="hint">Periksa kebijakan pembatalan dan no-show sebelum membayar.</p>`,

'dp-loading':`<h1>Menyiapkan pembayaran</h1><p class="lead">Mohon tunggu, kami sedang menyiapkan tautan pembayaran DP Anda.</p>${summary}<div class="skeleton tall"></div><p class="hint">Jangan tutup halaman ini.</p>`,

'waitlist-error':`<span class="badge">◷ Dalam daftar tunggu</span><h1>Notifikasi belum aktif</h1><p class="lead">Izin notifikasi diblokir di browser ini. Anda tetap berada dalam daftar tunggu.</p><div class="paper queue"><span>Nomor antrean</span><strong>A-12</strong><div class="line"><span>Estimasi menunggu</span><b>20–30 menit</b></div></div><div class="message"><b>⚠ Aktifkan lewat pengaturan browser</b><p>Atau tetap buka halaman ini untuk memeriksa panggilan.</p></div>`,
'waitlist-kosong':`<h1>Belum ada antrean aktif</h1><p class="lead">Anda belum terdaftar dalam daftar tunggu di outlet ini.</p><div class="empty-icon">⌁</div><p class="hint">Daftar saat Anda sudah berada di outlet.</p>`,

const actions={zona:['Lanjutkan'], 'zona-kosong':['Ubah tanggal atau jam'], 'zona-error':['Coba lagi','Ubah tanggal atau jam'], 'zona-loading':['Memuat zona…'],dp:['Buka pembayaran','Lihat kebijakan'], 'dp-error':['Periksa status reservasi','Hubungi outlet'], 'dp-loading':['Menyiapkan tautan…'],waitlist:['Aktifkan notifikasi','Nanti saja'], 'waitlist-dipanggil':['Mengerti'], 'waitlist-error':['Periksa status antrean'], 'waitlist-kosong':['Daftar antrean'], 'waitlist-loading':['Memuat status…']};document.querySelector('#content').innerHTML=`<div class="booking-main">${shells[state]||shells.zona}</div>${footer(...(actions[state]||actions.zona))}`;
