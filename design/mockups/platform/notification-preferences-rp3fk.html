<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preferensi notifikasi — Legend</title><style>
@font-face{font-family:Jakarta;src:url('../assets/plus-jakarta-sans-latin.woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;background:#f7f6f4;color:#1c1b19;font:16px/1.5 Jakarta,sans-serif}button,input,select{font:inherit}button{cursor:pointer}h1,h2,p{margin:0}h1{font-size:26px;line-height:1.25}h2{font-size:20px}.app{display:flex;min-height:100vh}.side{width:240px;flex:none;background:#fbfaf9;border-right:1px solid #e8e5e1;padding:28px 18px}.logo{font-size:20px;font-weight:700;margin:0 8px 40px}.nav{padding:12px;color:#5f5b55;font-size:14px}.nav.active{background:#e6eff0;color:#0f5e68;border-left:3px solid #0f5e68;font-weight:700}.main{flex:1;min-width:0}.top{background:white;border-bottom:1px solid #e8e5e1;padding:18px 36px;display:flex;justify-content:space-between;font-weight:700}.content{max-width:1000px;margin:auto;padding:36px 32px}.back,.muted{color:#5f5b55}.back{font-size:14px;font-weight:700}.head{margin:18px 0 24px}.head p{margin-top:8px}.tabs{display:flex;gap:24px;border-bottom:1px solid #d9d5cf;margin-bottom:24px}.tabs span{padding:0 0 12px}.tabs .active{border-bottom:3px solid #0f5e68;color:#0f5e68;font-weight:700}.outer{border:1px solid #e8e5e1;border-radius:18px;padding:8px;background:#fbfaf9;margin-bottom:16px}.card{border:1px solid #e8e5e1;border-radius:12px;background:white;padding:24px}.desc{color:#5f5b55;font-size:14px;margin-top:7px}.notice{background:#fdebeb;border-left:4px solid #a42228;border-radius:8px;padding:14px 16px;margin-bottom:20px}.notice.ok{background:#e4f5eb;border-color:#147a41}.grid-head,.category{display:grid;grid-template-columns:minmax(180px,1fr) repeat(3,96px);align-items:center;gap:12px}.grid-head{color:#5f5b55;font-size:13px;font-weight:700;text-align:center;padding:16px 0 8px}.grid-head span:first-child{text-align:left}.category{border-top:1px solid #e8e5e1;padding:16px 0}.name{font-weight:700}.help{font-size:13px;color:#5f5b55;margin-top:3px}.control{text-align:center}.control label{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px}.control .channel{display:none}.switch{appearance:none;width:42px;height:24px;border:1px solid #8a857d;background:#aaa49b;border-radius:20px;margin:0;position:relative;cursor:pointer;flex:none}.switch:before{content:'';position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff}.switch:checked{background:#0f5e68;border-color:#0f5e68}.switch:checked:before{left:20px}.switch:disabled{opacity:.76;cursor:not-allowed}.locked{font-size:12px;color:#5f5b55;font-weight:700;display:block}.quiet{display:flex;gap:20px;align-items:end;flex-wrap:wrap;margin-top:18px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{border:1px solid #8a857d;border-radius:8px;background:white;padding:10px;min-height:44px;max-width:100%}.enable{display:flex;align-items:center;gap:10px;margin-top:16px}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}.btn{border:1px solid #8a857d;border-radius:9px;padding:10px 15px;background:white;color:#1c1b19;font-weight:700;min-height:44px}.primary{background:#0f5e68;color:white;border-color:#0f5e68}.error-text{color:#a42228;font-size:14px;font-weight:700;margin-top:8px}.empty{text-align:center;padding:46px 20px}.empty p{max-width:400px;margin:10px auto 20px}.skeleton{background:#e8e5e1;border-radius:4px;height:16px;margin:18px 0}.short{width:42%}.long{width:85%}.sample{font-size:12px;color:#5f5b55;margin-top:16px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #0f5e68;outline-offset:3px}@media(max-width:700px){.side{display:none}.top{padding:16px 20px;font-size:15px}.content{padding:24px 16px 32px}.card{padding:20px}h1{font-size:24px}.grid-head{display:none}.category{display:flex;flex-wrap:wrap;gap:8px 16px}.category .identity{width:100%;margin-bottom:4px}.control label{justify-content:flex-start}.control .channel{display:inline;font-size:13px;font-weight:700}.control .locked{display:inline}.actions{flex-direction:column-reverse}.actions button{width:100%}.quiet .field{flex:1;min-width:110px}.field input,.field select{width:100%}}
</style></head><body><div class="app"><aside class="side"><div class="logo">LEGEND</div><div class="nav">Ringkasan</div><div class="nav">Tim &amp; organisasi</div><div class="nav active">Pengaturan</div><div class="nav">Log audit</div></aside><main class="main"><div class="top"><span>Pengaturan organisasi</span><span>Owner &nbsp; ◉</span></div><div class="content"><div class="back">‹ &nbsp; Pengaturan</div><div class="head"><h1>Notifikasi</h1><p class="muted">Atur cara Anda menerima pemberitahuan.</p></div><div class="tabs"><span>Kotak masuk</span><span class="active">Preferensi</span></div><div id="state"></div><p class="sample">Mockup · Data dan status contoh untuk peninjauan desain.</p></div></main></div><script>
const state=new URLSearchParams(location.search).get('state')||'normal';
const categories=[['Keamanan',true,true,false,'Email wajib aktif untuk pemberitahuan keamanan.'],['Darurat',true,false,false,''],['Panggilan waiter',true,false,false,''],['Pesanan siap',true,false,false,''],['Stok kritis',true,false,false,''],['Permintaan approval',true,false,false,''],['Printer offline',true,false,false,''],['Selisih kas',true,false,false,''],['Perubahan jadwal',true,false,false,''],['Slip gaji',true,false,false,''],['Ringkasan harian',true,false,false,'']];
const channel=(cat,label,on,locked)=>`<div class="control"><label><span class="channel">${label}</span><input class="switch" type="checkbox" role="switch" aria-label="${label} ${cat}" ${on?'checked':''} ${locked?'disabled aria-describedby="security-note"':''}></label>${locked?'<span class="locked">🔒 Wajib</span>':''}</div>`;
const rows=categories.map(([name,push,email,wa,help])=>`<div class="category"><div class="identity"><div class="name">${name}</div>${help?`<div class="help" id="security-note">${help}</div>`:''}</div>${channel(name,'Web push',push,false)}${channel(name,'Email',email,name==='Keamanan')}${channel(name,'WhatsApp',wa,false)}</div>`).join('');
const form=`<form id="prefs"><div class="outer"><section class="card"><h2>Kategori &amp; kanal</h2><p class="desc">Pilih kanal per kategori. Notifikasi in-app selalu aktif sebagai catatan resmi.</p><p class="desc">WhatsApp hanya dikirim bila tenant mengizinkan kategori ini.</p><div class="grid-head"><span>Kategori</span><span>Web push</span><span>Email</span><span>WhatsApp</span></div>${rows}</section></div><div class="outer"><section class="card"><h2>Jam tenang</h2><p class="desc">Selama jam tenang, hanya pemberitahuan keamanan dan darurat yang dikirim.</p><label class="enable"><input id="quiet" class="switch" type="checkbox" role="switch" checked> Aktifkan jam tenang</label><div class="quiet"><div class="field"><label for="start">Mulai</label><input id="start" type="time" value="22:00" required></div><div class="field"><label for="end">Selesai</label><input id="end" type="time" value="07:00" required aria-describedby="time-error"></div><div class="field"><label for="zone">Zona waktu</label><select id="zone"><option>Asia/Jakarta</option><option>Asia/Makassar</option><option>Asia/Jayapura</option></select></div></div><p id="time-error" class="error-text" role="alert" hidden>Jam mulai dan selesai tidak boleh sama.</p></section></div><div class="actions"><button class="btn" type="reset">Batalkan perubahan</button><button class="btn primary" type="submit">Simpan preferensi</button></div></form>`;
const loading=`<div class="outer"><section class="card" aria-busy="true"><h2>Memuat preferensi…</h2><div class="skeleton short"></div><div class="skeleton long"></div><div class="skeleton long"></div><div class="skeleton long"></div></section></div>`;
const empty=`<div class="outer"><section class="card empty"><h2>Belum ada preferensi tersimpan</h2><p class="muted">Default tenant dipakai sampai Anda menyimpan pilihan sendiri.</p><button class="btn primary" onclick="location.href='?state=normal'">Atur preferensi</button></section></div>`;
const error=`<div class="outer"><section class="card empty"><h2>Preferensi tidak dapat dimuat</h2><p class="muted">Periksa koneksi, lalu coba lagi.</p><button class="btn primary" onclick="location.href='?state=normal'">Coba lagi</button></section></div>`;
document.querySelector('#state').innerHTML=state==='loading'?loading:state==='empty'?empty:state==='error'?error:(state==='success'?'<div class="notice ok" role="status"><strong>✓ Preferensi notifikasi tersimpan.</strong></div>':state==='save-error'?'<div class="notice" role="alert"><strong>Preferensi belum tersimpan.</strong> Periksa koneksi, lalu coba lagi.</div>':'')+form;
const prefs=document.querySelector('#prefs');if(prefs){const start=document.querySelector('#start'),end=document.querySelector('#end'),errorEl=document.querySelector('#time-error');if(state==='validation'){end.value=start.value;errorEl.hidden=false;end.setAttribute('aria-invalid','true')}prefs.addEventListener('submit',e=>{e.preventDefault();if(document.querySelector('#quiet').checked&&start.value===end.value){errorEl.hidden=false;end.setAttribute('aria-invalid','true');end.focus();return}location.href='?state=success'});prefs.addEventListener('reset',()=>{errorEl.hidden=true;end.removeAttribute('aria-invalid')})}
</script></body></html>
