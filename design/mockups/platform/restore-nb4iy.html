<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pemulihan tenant dan outlet</title><style>
@font-face{font-family:Jakarta;src:url('../assets/plus-jakarta-sans-latin.woff2')}*{box-sizing:border-box}body{margin:0;background:#f7f6f4;color:#1c1b19;font:16px/1.5 Jakarta,sans-serif}button,textarea{font:inherit}.shell{min-height:100vh;display:flex}.side{width:240px;flex-shrink:0;padding:28px 18px;background:#fbfaf9;border-right:1px solid #e8e5e1}.logo{font-weight:700;font-size:20px;letter-spacing:-.04em;margin:0 8px 40px}.nav{padding:12px;color:#5f5b55;font-size:14px}.nav.active{background:#e6eff0;color:#0f5e68;border-left:3px solid #0f5e68;font-weight:700;border-radius:8px}.main{flex:1;min-width:0}.top{background:white;border-bottom:1px solid #e8e5e1;padding:18px 36px;font-weight:700;display:flex;justify-content:space-between}.content{max-width:1000px;margin:auto;padding:32px}.back{font-size:14px;color:#5f5b55;font-weight:600}.head{margin:18px 0 24px}h1{font-size:26px;letter-spacing:-.025em;line-height:1.2;margin:0 0 8px}h2{font-size:20px;line-height:1.3;margin:0}p{margin:0}.muted{color:#5f5b55}.lead{font-size:15px}.outer{border:1px solid #e8e5e1;border-radius:18px;padding:8px;background:#fbfaf9}.card{background:#fff;border:1px solid #e8e5e1;border-radius:12px;padding:24px}.card+.card{margin-top:8px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab{border:1px solid #dedbd7;background:#fff;border-radius:8px;padding:10px 14px;color:#55514d}.tab.selected{border-color:#0f5e68;color:#0f5e68;font-weight:700}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.pill{display:inline-block;background:#fcf1dc;color:#684000;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap}.pill.neutral{background:#efeeec;color:#45423e}.details{margin:20px 0}.item{padding:14px 0;border-top:1px solid #e8e5e1}.label{font-size:13px;color:#5f5b55;font-weight:700;margin-bottom:4px}.value{font-size:15px;font-weight:600}.caption{font-size:13px;color:#5f5b55}.note{background:#f7f6f4;border-radius:10px;padding:14px;font-size:14px;margin:18px 0}.actions{display:flex;gap:10px;margin-top:20px}.btn{border:1px solid #8a857d;border-radius:9px;background:white;padding:10px 16px;min-height:44px;font-weight:700}.primary{background:#0f5e68;color:white;border-color:#0f5e68}.status{padding:15px 18px;border-left:4px solid #147a41;background:#e4f5eb;border-radius:8px;margin-bottom:20px;font-size:14px}.status.bad{border-color:#c02c31;background:#fdebeb}.status.warn{border-color:#8f5800;background:#fcf1dc}.empty{text-align:center;padding:60px 24px}.empty p{max-width:460px;margin:10px auto 0}.formlabel{font-weight:700;font-size:14px;display:block;margin:20px 0 6px}textarea{width:100%;min-height:100px;border:1px solid #8a857d;border-radius:9px;padding:12px;resize:vertical}.skeleton{height:16px;border-radius:5px;background:#e8e5e1;margin:14px 0}.sample{font-size:12px;color:#5f5b55;margin-bottom:16px}.alert{color:#a42228;font-size:13px;margin-top:5px}.focus{max-width:700px}.spacer{height:8px}@media(max-width:650px){.side{display:none}.top{padding:16px 20px;font-size:15px}.content{padding:24px 16px 32px}h1{font-size:24px}.card{padding:20px}.actions{flex-direction:column-reverse}.btn{width:100%}.row{align-items:flex-start}.tabs{display:grid;grid-template-columns:1fr 1fr}.tab{padding:10px 8px}.empty{padding:48px 8px}}
</style></head><body><div class="shell"><aside class="side"><div class="logo">LEGEND</div><div class="nav">Ringkasan</div><div class="nav active">Tenant &amp; outlet</div><div class="nav">Tim platform</div><div class="nav">Log audit</div><div class="nav">Pengaturan</div></aside><main class="main"><div class="top"><span>Panel platform</span><span>Admin platform &nbsp; ◉</span></div><div class="content"><div class="back">‹ &nbsp; Tenant &amp; outlet</div><div class="head"><h1>Pemulihan tenant dan outlet</h1><p class="muted lead">Tinjau status dan batas pemulihan sebelum melanjutkan.</p></div><div id="state"></div></div></main></div><script>
const q=new URLSearchParams(location.search), state=q.get('state')||'normal', kind=q.get('kind')||'tenant';const outlet=kind==='outlet', noun=outlet?'outlet':'tenant', name=outlet?'Outlet Pusat':'Kopi Nusantara', status=outlet?'Ditutup':'Diarsipkan', previous=outlet?'Aktif':'Aktif';const tabs=`<div class="tabs"><button class="tab ${!outlet?'selected':''}">Tenant terarsip</button><button class="tab ${outlet?'selected':''}">Outlet tertutup</button></div>`;const example='<div class="sample">Contoh data</div>';const summary=`<div class="row"><div><h2>${name}</h2><p class="caption">${outlet?'Kopi Nusantara · Outlet':'Tenant'}</p></div><span class="pill">◷ ${status}</span></div><div class="details"><div class="item"><div class="label">Status sebelumnya</div><div class="value">${previous}</div></div><div class="item"><div class="label">${outlet?'Ditutup':'Diarsipkan'} pada</div><div class="value">1 Nov 2026</div></div><div class="item"><div class="label">Batas pemulihan</div><div class="value">1 Des 2026</div><div class="caption">Maksimal 30 hari sejak perubahan status.</div></div></div>`;const wrap=s=>`<div class="outer"><div class="card">${s}</div></div>`;let html='';
if(state==='normal')html=tabs+example+wrap(summary+`<div class="note">Pemulihan mengembalikan ${noun} ke status sebelumnya. Pemeriksaan keamanan dilakukan sebelum pemulihan.</div><div class="actions"><button class="btn primary">Tinjau pemulihan</button></div>`);
if(state==='confirm')html=example+wrap(`<div class="focus"><h2>Pulihkan ${noun}?</h2><p class="muted" style="margin-top:8px">Periksa rincian sebelum mengembalikan status.</p><div class="spacer"></div>${summary}<div class="note">Status kembali menjadi <strong>${previous}</strong>. Pemulihan hanya dapat dilanjutkan bila pemeriksaan keamanan berhasil.</div><label class="formlabel" for="reason">Alasan pemulihan <span aria-hidden="true">*</span></label><textarea id="reason" minlength="10" maxlength="500" placeholder="Jelaskan alasan pemulihan" aria-describedby="reason-hint"></textarea><p class="caption" id="reason-hint">Alasan wajib 10–500 karakter dan dicatat dalam log audit.</p><p class="alert" id="reason-error" hidden>Isi alasan 10–500 karakter sebelum melanjutkan.</p><div class="actions"><button class="btn">Batal</button><button class="btn primary">Pulihkan ${noun}</button></div></div>`);
if(state==='validation')html=example+wrap(`<div class="focus"><h2>Pulihkan ${noun}?</h2><div class="spacer"></div>${summary}<label class="formlabel" for="reason">Alasan pemulihan *</label><textarea id="reason" minlength="10" maxlength="500" aria-invalid="true" aria-describedby="reason-error"></textarea><p class="alert" id="reason-error">Isi alasan 10–500 karakter sebelum melanjutkan.</p><div class="actions"><button class="btn">Batal</button><button class="btn primary">Pulihkan ${noun}</button></div></div>`);
if(state==='empty')html=tabs+wrap(`<div class="empty"><h2>Tidak ada ${outlet?'outlet tertutup':'tenant terarsip'}</h2><p class="muted">${outlet?'Outlet yang ditutup':'Tenant yang diarsipkan'} akan muncul di sini untuk ditinjau.</p></div>`);
if(state==='loading')html=tabs+wrap(`<div role="status" aria-label="Memuat daftar"><h2>Memuat ${noun}…</h2><div class="skeleton" style="width:55%"></div><div class="skeleton" style="width:85%"></div><div class="skeleton" style="width:65%"></div><p class="caption">Mohon tunggu sebentar.</p></div>`);
if(state==='error')html=tabs+`<div class="status bad"><strong>Daftar belum dapat dimuat.</strong> Periksa koneksi dan coba lagi.</div>`+wrap(`<div class="empty"><h2>Data belum tersedia</h2><p class="muted">Status terbaru belum dapat diperiksa. Pemulihan belum dapat dilakukan.</p><div class="actions" style="justify-content:center"><button class="btn">Coba lagi</button></div></div>`);
if(state==='blocked')html=example+`<div class="status bad"><strong>Pemulihan belum dapat dilakukan.</strong> Pemeriksaan keamanan belum berhasil. Status ${noun} tidak berubah.</div>`+wrap(summary+`<div class="note">Tinjau masalah yang dilaporkan, lalu coba lagi setelah masalah diselesaikan.</div><button class="btn">Kembali ke daftar</button>`);
if(state==='expired')html=example+`<div class="status warn"><strong>Batas pemulihan terlewati.</strong> Status ini final dan tidak dapat dipulihkan setelah 30 hari.</div>`+wrap(`<div class="row"><div><h2>${name}</h2><p class="caption">${outlet?'Kopi Nusantara · Outlet':'Tenant'}</p></div><span class="pill neutral">${status}</span></div><div class="details"><div class="item"><div class="label">${outlet?'Ditutup':'Diarsipkan'} pada</div><div class="value">1 Okt 2026</div></div><div class="item"><div class="label">Batas pemulihan</div><div class="value">31 Okt 2026</div></div></div><p class="muted">Status juga dianggap final bila waktu perubahan tidak tersedia untuk membuktikan batas 30 hari. Hubungi tim platform untuk meninjau langkah berikutnya.</p>`);
if(state==='success')html=example+`<div class="status"><strong>✓ ${outlet?'Outlet':'Tenant'} berhasil dipulihkan.</strong> Status kembali ke ${previous.toLowerCase()} dan tindakan tercatat dalam log audit.</div>`+wrap(`<div class="row"><div><h2>${name}</h2><p class="caption">${outlet?'Kopi Nusantara · Outlet':'Tenant'}</p></div><span class="pill neutral">✓ ${previous}</span></div><div class="actions"><button class="btn">Kembali ke daftar</button></div>`);document.getElementById('state').innerHTML=html;
const go=(next,nextKind=kind)=>{const target=new URL(location.href);target.searchParams.set('state',next);target.searchParams.set('kind',nextKind);location.href=target.href};
document.querySelectorAll('.tab').forEach((button,index)=>{button.setAttribute('aria-pressed',String((index===1)===outlet));button.addEventListener('click',()=>go('normal',index===0?'tenant':'outlet'))});
document.querySelectorAll('.actions .btn, .card > .btn').forEach(button=>button.addEventListener('click',()=>{const label=button.textContent.trim();if(label==='Tinjau pemulihan')return go('confirm');if(label==='Batal'||label==='Kembali ke daftar'||label==='Coba lagi')return go('normal');if(label===`Pulihkan ${noun}`){const field=document.getElementById('reason'),error=document.getElementById('reason-error');if(!field||field.value.trim().length<10||field.value.trim().length>500){if(error)error.hidden=false;if(field){field.setAttribute('aria-invalid','true');field.setAttribute('aria-describedby','reason-error');field.focus()}return}go('success')}}));
</script></body></html>
