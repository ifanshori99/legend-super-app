<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kode cadangan MFA — Legend</title><style>
@font-face{font-family:Jakarta;src:url('../assets/plus-jakarta-sans-latin.woff2')}*{box-sizing:border-box}body{margin:0;color:#1c1b19;background:#f7f6f4;font:16px/1.5 Jakarta,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #0f5e68;outline-offset:3px}.shell{display:flex;min-height:100vh}.side{width:240px;flex:none;background:#fbfaf9;border-right:1px solid #e8e5e1;padding:28px 18px}.logo{font-weight:700;font-size:20px;margin:0 8px 40px}.nav{padding:12px;color:#5f5b55;font-size:14px}.nav.active{background:#e6eff0;color:#0f5e68;border-left:3px solid #0f5e68;border-radius:8px;font-weight:700}.main{flex:1;min-width:0}.top{background:#fff;border-bottom:1px solid #e8e5e1;padding:18px 36px;font-weight:700;display:flex;justify-content:space-between}.content{max-width:900px;margin:auto;padding:36px 32px}.back,.muted{color:#5f5b55}.back{font-size:14px;font-weight:600}.head{margin:18px 0 24px}h1,h2,p{margin:0}h1{font-size:26px;line-height:1.25;letter-spacing:-.025em}h2{font-size:20px;line-height:1.3}.head p{margin-top:8px}.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(240px,.65fr);gap:20px}.outer{border:1px solid #e8e5e1;border-radius:18px;padding:8px;background:#fbfaf9}.card{background:white;border:1px solid #e8e5e1;border-radius:12px;padding:24px}.card p{margin-top:10px}.notice{background:#fcf1dc;border-left:4px solid #8f5800;border-radius:8px;padding:14px 16px;margin:20px 0;color:#513400}.codes{background:#f7f6f4;border:1px solid #e8e5e1;border-radius:10px;padding:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;font:600 15px/1.5 monospace;letter-spacing:.04em}.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.btn{border:1px solid #8a857d;border-radius:9px;padding:10px 16px;background:white;font-weight:700;min-height:44px;color:#1c1b19}.primary{background:#0f5e68;color:white;border-color:#0f5e68}.caption{font-size:13px;color:#5f5b55}.step{border-top:1px solid #e8e5e1;margin-top:18px;padding-top:16px}.step strong{display:block}.login{max-width:480px;margin:8vh auto;padding:0 16px}.login .logo{margin:0 0 28px;text-align:center}.login .card{padding:32px}.label{display:block;font-size:14px;font-weight:700;margin:22px 0 8px}input{width:100%;border:1px solid #8a857d;border-radius:9px;min-height:48px;padding:10px 12px}.wide{width:100%;margin-top:20px}.link{display:inline-block;color:#0f5e68;font-weight:700;margin-top:18px}.error{color:#a42228;font-size:14px;margin-top:8px}.banner{border-left:4px solid #a42228;background:#fdebeb;padding:14px;border-radius:8px;margin-bottom:20px}.skeleton{background:#e8e5e1;border-radius:6px;height:16px;margin-top:16px}.skeleton.short{width:56%}.skeleton.big{height:100px}.empty{text-align:center;padding:32px 4px}.empty p{max-width:420px;margin:10px auto}.sample{margin-top:14px;font-size:12px;color:#5f5b55}@media(max-width:650px){.side{display:none}.top{padding:16px 20px;font-size:15px}.content{padding:24px 16px 32px}.head{margin:16px 0 20px}h1{font-size:24px}.grid{display:block}.grid>.outer+.outer{margin-top:14px}.card{padding:20px}.actions .btn{flex:1}.login{margin:36px auto}.login .card{padding:24px}.login .actions .btn{width:100%}}
</style></head><body><div id="app"></div><script>
const state=new URLSearchParams(location.search).get('state')||'codes';const app=document.getElementById('app');
const shell=(body)=>`<div class="shell"><aside class="side"><div class="logo">LEGEND</div><div class="nav">Ringkasan</div><div class="nav">Tim &amp; organisasi</div><div class="nav active">Keamanan akun</div><div class="nav">Pengaturan</div></aside><main class="main"><header class="top"><span>Pengaturan akun</span><span>Keamanan</span></header><div class="content"><div class="back">‹ &nbsp; Keamanan akun</div><div class="head"><h1>Kode cadangan</h1><p class="muted">Simpan kode untuk masuk saat faktor kedua tidak tersedia.</p></div>${body}</div></main></div>`;
const login=(body)=>`<main class="login"><div class="logo">LEGEND</div><div class="outer"><div class="card">${body}</div></div></main>`;
const loginBody=(error=false)=>`<h1>Masukkan kode cadangan</h1><p class="muted">Gunakan salah satu kode yang disimpan saat menyiapkan verifikasi dua langkah.</p><label class="label" for="code">Kode cadangan</label><input id="code" autocomplete="one-time-code" ${error?'value="ABCDE-12345" aria-invalid="true" aria-describedby="error"':''}>${error?'<div class="error" id="error">Kode tidak valid atau sudah digunakan. Periksa kode atau gunakan kode lain.</div>':''}<button class="btn primary wide">Verifikasi kode</button><a class="link" href="?state=login">‹ Kembali ke verifikasi dua langkah</a>`;
if(state==='codes')app.innerHTML=shell(`<div class="grid"><section class="outer"><div class="card"><h2>Simpan kode cadangan Anda</h2><p class="muted">Verifikasi dua langkah sudah disiapkan. Gunakan kode ini jika Anda tidak dapat mengakses faktor kedua.</p><div class="notice"><strong>Ditampilkan sekali.</strong> Simpan kode ini di tempat yang aman sebelum meninggalkan halaman.</div><div class="codes"><span>ABCDE-FGHJK</span><span>MNPQR-STVWX</span><span>YZ234-56789</span><span>BCDFG-HJKMN</span><span>PQRST-VWXYZ</span><span>23456-789AB</span><span>CDFGH-JKMNP</span><span>QRSTV-WXYZ2</span><span>34567-89ABC</span><span>DFGHJ-KMNPQ</span></div><p class="sample">Contoh kode untuk mockup · Setiap kode hanya dapat digunakan sekali.</p><div class="actions"><button class="btn">Salin kode</button><button class="btn primary">Saya sudah menyimpan kode</button></div></div></section><aside class="outer"><div class="card"><h2>Cara menjaga kode</h2><div class="step"><strong>Simpan secara pribadi</strong><span class="muted">Jangan bagikan kode kepada orang lain.</span></div><div class="step"><strong>Gunakan saat diperlukan</strong><span class="muted">Pilih “Pakai kode cadangan” pada layar verifikasi dua langkah.</span></div></div></aside></div>`);
if(state==='login')app.innerHTML=login(`<h1>Verifikasi dua langkah</h1><p class="muted">Masukkan kode dari aplikasi autentikator untuk melanjutkan.</p><label class="label" for="totp">Kode verifikasi</label><input id="totp" inputmode="numeric" autocomplete="one-time-code"><button class="btn primary wide">Verifikasi</button><a class="link" href="?state=recovery">Pakai kode cadangan</a>`);
if(state==='recovery'||state==='invalid')app.innerHTML=login(loginBody(state==='invalid'));
if(state==='empty')app.innerHTML=shell(`<div class="outer"><div class="card empty"><h2>Kode cadangan belum tersedia</h2><p class="muted">Siapkan verifikasi dua langkah untuk mendapatkan kode cadangan.</p><button class="btn primary" style="margin-top:20px">Siapkan verifikasi dua langkah</button></div></div>`);
if(state==='error')app.innerHTML=shell(`<div class="banner"><strong>Kode cadangan belum dapat dimuat.</strong> Periksa koneksi dan coba lagi.</div><div class="outer"><div class="card empty"><h2>Ada masalah saat memuat</h2><p class="muted">Kembali ke pengaturan keamanan atau coba lagi.</p><button class="btn" style="margin-top:20px">Coba lagi</button></div></div>`);
if(state==='loading')app.innerHTML=shell(`<div class="outer"><div class="card" role="status" aria-label="Memuat kode cadangan"><h2>Memuat kode cadangan…</h2><div class="skeleton short"></div><div class="skeleton big"></div><div class="skeleton short"></div></div></div>`);
if(state==='success')app.innerHTML=login(`<h1>Verifikasi berhasil</h1><p class="muted">Kode cadangan diterima. Anda dapat melanjutkan masuk.</p><button class="btn primary wide">Lanjutkan</button>`);
if(state==='saved')app.innerHTML=shell(`<div class="outer"><div class="card empty"><h2>Kode cadangan disimpan</h2><p class="muted">Kode tidak ditampilkan kembali. Simpan di tempat yang aman untuk digunakan saat diperlukan.</p><a class="link" href="?state=login">Lihat contoh layar masuk</a></div></div>`);
if(state==='continued')app.innerHTML=login(`<h1>Anda telah masuk</h1><p class="muted">Contoh alur masuk selesai.</p><a class="link" href="?state=login">Kembali ke contoh verifikasi</a>`);
const go=(next)=>{location.search='?state='+next};
document.querySelectorAll('button').forEach(button=>button.addEventListener('click',async()=>{
 const label=button.textContent.trim();
 if(label==='Salin kode'){
  const value=Array.from(document.querySelectorAll('.codes span'),item=>item.textContent).join('\n');
  let copied=false;
  try{await navigator.clipboard.writeText(value);copied=true}catch{const field=document.createElement('textarea');field.value=value;field.style.position='fixed';field.style.left='-9999px';document.body.appendChild(field);field.select();copied=document.execCommand('copy');field.remove()}
  let status=document.getElementById('copy-status');if(!status){status=document.createElement('p');status.id='copy-status';status.className='caption';status.setAttribute('role','status');button.closest('.actions').after(status)}
  status.textContent=copied?'Kode contoh disalin. Simpan di tempat yang aman.':'Kode belum dapat disalin. Salin secara manual.';
 }
 if(label==='Saya sudah menyimpan kode')go('saved');
 if(label==='Siapkan verifikasi dua langkah'||label==='Coba lagi')go('codes');
 if(label==='Verifikasi kode'){
  const field=document.getElementById('code');
  if(field.value.replace(/[\s-]+/g,'').toUpperCase()==='ABCDEFGHJK')go('success');else go('invalid');
 }
 if(label==='Verifikasi'){
  const field=document.getElementById('totp');
  if(field.value.trim())go('success');else{field.setAttribute('aria-invalid','true');let message=document.getElementById('totp-error');if(!message){message=document.createElement('div');message.id='totp-error';message.className='error';message.textContent='Masukkan kode verifikasi.';field.after(message)}field.focus()}
 }
 if(label==='Lanjutkan')go('continued');
}));
</script></body></html>
