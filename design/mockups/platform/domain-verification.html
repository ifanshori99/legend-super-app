<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifikasi domain — Legend</title><style>
@font-face{font-family:Jakarta;src:url('../assets/plus-jakarta-sans-latin.woff2')}*{box-sizing:border-box}body{margin:0;background:#f7f6f4;color:#1c1b19;font:16px/1.5 Jakarta,sans-serif}button{font:inherit;cursor:pointer}h1,h2,h3,p{margin:0}h1{font-size:26px;line-height:1.25}h2{font-size:20px;line-height:1.3}h3{font-size:16px}.app{display:flex;min-height:100vh}.side{width:240px;flex:none;background:#fbfaf9;border-right:1px solid #e8e5e1;padding:28px 18px}.logo{font-size:20px;font-weight:700;margin:0 8px 40px}.nav{padding:12px;color:#5f5b55;font-size:14px}.nav.active{background:#e6eff0;color:#0f5e68;border-left:3px solid #0f5e68;font-weight:700}.main{flex:1;min-width:0}.top{background:white;border-bottom:1px solid #e8e5e1;padding:18px 36px;display:flex;justify-content:space-between;font-weight:700}.content{max-width:1000px;margin:auto;padding:36px 32px}.back,.muted{color:#5f5b55}.back{font-size:14px;font-weight:700}.head{margin:18px 0 24px}.head p{margin-top:8px}.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(250px,.8fr);gap:20px;align-items:start}.outer{border:1px solid #e8e5e1;border-radius:18px;padding:8px;background:#fbfaf9}.card{border:1px solid #e8e5e1;border-radius:12px;background:white;padding:24px}.row{display:flex;align-items:start;justify-content:space-between;gap:12px;min-width:0}.row>div{min-width:0;overflow-wrap:anywhere}.pill{background:#fcf1dc;color:#684000;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap}.pill.ok{background:#e4f5eb;color:#126c39}.desc{color:#5f5b55;font-size:14px;margin-top:7px}.item{border-top:1px solid #e8e5e1;padding:16px 0}.label{font-size:13px;color:#5f5b55;font-weight:700;margin-bottom:5px}.value{font-weight:700;overflow-wrap:anywhere}.record{background:#f7f6f4;border:1px solid #e8e5e1;border-radius:10px;padding:16px;margin:18px 0}.record .item:first-of-type{border:0;padding-top:0}.record .item:last-child{padding-bottom:0}.code{font-family:monospace;overflow-wrap:anywhere;word-break:break-word;min-width:0;font-size:14px}.btn{border:1px solid #8a857d;border-radius:9px;padding:10px 15px;background:white;color:#1c1b19;font-weight:700;min-height:44px}.primary{background:#0f5e68;color:white;border-color:#0f5e68}.copy{font-size:13px;white-space:nowrap;flex:none}.notice{background:#fdebeb;border-left:4px solid #a42228;border-radius:8px;padding:14px 16px;margin-bottom:20px}.notice.ok{background:#e4f5eb;border-color:#147a41}.steps{padding-left:20px;margin:14px 0 0}.steps li{margin:10px 0}.empty{text-align:center;padding:46px 20px}.empty p{max-width:400px;margin:10px auto 20px}.skeleton{background:#e8e5e1;border-radius:4px;height:16px;margin:14px 0}.skeleton.short{width:42%}.skeleton.long{width:85%}.sample{font-size:12px;color:#5f5b55;margin-top:16px}.btn:focus-visible{outline:2px solid #0f5e68;outline-offset:2px}@media(max-width:700px){.side{display:none}.top{padding:16px 20px;font-size:15px}.content{padding:24px 16px 32px}.grid{display:block}.grid>.outer+ .outer{margin-top:14px}.card{padding:20px}h1{font-size:24px}.primary{width:100%}.top span:last-child{font-size:13px}.row{align-items:start}}
</style></head><body><div class="app"><aside class="side"><div class="logo">LEGEND</div><div class="nav">Ringkasan</div><div class="nav">Tim &amp; organisasi</div><div class="nav active">Pengaturan</div><div class="nav">Log audit</div></aside><main class="main"><div class="top"><span>Pengaturan organisasi</span><span>Owner &nbsp; ◉</span></div><div class="content"><div class="back">‹ &nbsp; Pengaturan</div><div class="head"><h1>Domain kustom</h1><p class="muted">Hubungkan domain milik Anda dengan memverifikasi kepemilikannya.</p></div><div id="state"></div></div></main></div><script>
const state=new URLSearchParams(location.search).get('state')||'pending';
const verification=`<div class="grid"><div class="outer"><section class="card"><div class="row"><div><h2>pesan.kedainusantara.id</h2><p class="desc">Domain kustom · Contoh data</p></div><span class="pill">◷ Menunggu verifikasi</span></div><p class="desc" style="margin-top:20px">Tambahkan record TXT berikut pada pengelola DNS domain Anda.</p><div class="record"><div class="item"><div class="label">Jenis</div><div class="value">TXT</div></div><div class="item"><div class="label">Nama / host</div><div class="row"><span class="code">_legend-verification.pesan.kedainusantara.id</span><button class="btn copy" data-copy="name">Salin</button></div></div><div class="item"><div class="label">Nilai</div><div class="row"><span class="code">legend-verification=8d6b4c2a</span><button class="btn copy" data-copy="value">Salin</button></div></div></div><button class="btn primary" id="verify">Cek verifikasi</button><p class="desc">Perubahan DNS mungkin memerlukan waktu sebelum dapat ditemukan.</p><p class="sample" id="feedback" aria-live="polite">Nama dan nilai di atas adalah contoh untuk mockup.</p></section></div><div class="outer"><section class="card"><h2>Cara memverifikasi</h2><ol class="steps"><li>Buka pengaturan DNS pada penyedia domain Anda.</li><li>Tambahkan record TXT dengan nama dan nilai yang ditampilkan.</li><li>Simpan perubahan, lalu kembali ke sini dan pilih <strong>Cek verifikasi</strong>.</li></ol><p class="desc">Jika record belum ditemukan, periksa kembali nama dan nilainya lalu coba lagi.</p></section></div></div>`;
const success=`<div class="notice ok"><strong>✓ Domain terverifikasi.</strong> Kepemilikan domain berhasil dikonfirmasi.</div><div class="outer"><div class="card"><div class="row"><div><h2>pesan.kedainusantara.id</h2><p class="desc">Domain kustom · Contoh data</p></div><span class="pill ok">✓ Terverifikasi</span></div><div class="item" style="margin-top:20px"><div class="label">Verifikasi kepemilikan</div><div class="value">Record TXT ditemukan</div></div></div></div>`;
const empty=`<div class="outer"><section class="card empty"><h2>Belum ada domain kustom</h2><p class="muted">Tambahkan domain untuk memulai verifikasi kepemilikan.</p><button class="btn primary" onclick="location.href='?state=add'">Tambah domain</button></section></div>`;
const add=`<div class="outer"><form class="card" id="add-domain"><h2>Tambah domain kustom</h2><p class="desc">Masukkan domain yang ingin dihubungkan.</p><label for="domain" style="display:block;font-weight:700;margin-top:20px">Nama domain</label><input id="domain" type="text" required pattern="[A-Za-z0-9-]+([.][A-Za-z0-9-]+)+" placeholder="pesan.contoh.id" style="display:block;width:100%;margin:8px 0 18px;padding:12px;border:1px solid #8a857d;border-radius:9px;font:inherit"><button class="btn primary" type="submit">Lanjutkan</button><p class="desc">Simulasi mockup: record TXT yang ditampilkan adalah contoh.</p></form></div>`;
const loading=`<div class="outer"><div class="card" aria-busy="true"><h2>Memuat domain</h2><p class="desc">Mengambil status dan petunjuk verifikasi…</p><div class="skeleton short"></div><div class="skeleton long"></div><div class="skeleton long"></div></div></div>`;
const errors={error:'Record TXT belum ditemukan. Periksa nama dan nilai di pengelola DNS, lalu coba lagi.',reserved:'Domain ini dicadangkan dan tidak dapat digunakan. Pilih domain lain.',taken:'Domain ini sudah digunakan. Pilih domain lain.'};
document.getElementById('state').innerHTML=state==='empty'?empty:state==='add'?add:state==='loading'?loading:state==='success'?success:(errors[state]?`<div class="notice" role="alert"><strong>! ${state==='error'?'Verifikasi belum berhasil.':'Domain tidak dapat digunakan.'}</strong> ${errors[state]}</div>`:'')+verification;
const chosenDomain=sessionStorage.getItem('mockDomain');if(chosenDomain){const walker=document.createTreeWalker(document.getElementById('state'),NodeFilter.SHOW_TEXT);while(walker.nextNode()){walker.currentNode.nodeValue=walker.currentNode.nodeValue.replaceAll('pesan.kedainusantara.id',chosenDomain)}}
document.addEventListener('submit',e=>{if(e.target.id==='add-domain'){e.preventDefault();sessionStorage.setItem('mockDomain',document.getElementById('domain').value.toLowerCase());location.href='?state=pending';}});
document.addEventListener('click',async e=>{if(e.target.id==='verify'){e.target.disabled=true;e.target.textContent='Memeriksa…';setTimeout(()=>location.href='?state=success',600);}if(e.target.dataset.copy){const text=e.target.dataset.copy==='name'?'_legend-verification.'+(chosenDomain||'pesan.kedainusantara.id'):'legend-verification=8d6b4c2a';try{await navigator.clipboard.writeText(text);document.getElementById('feedback').textContent='Tersalin.'}catch{document.getElementById('feedback').textContent='Tidak dapat menyalin. Pilih dan salin teks secara manual.'}}});
</script></body></html>
