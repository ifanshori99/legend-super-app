<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Permintaan akses dukungan</title><style>
@font-face{font-family:Jakarta;src:url('../assets/plus-jakarta-sans-latin.woff2')}*{box-sizing:border-box}body{margin:0;color:#1c1b19;background:#f7f6f4;font:16px/1.5 Jakarta,sans-serif}button{font:inherit;cursor:default} .shell{display:flex;min-height:100vh}.side{width:240px;background:#fbfaf9;border-right:1px solid #e8e5e1;padding:28px 18px;flex-shrink:0}.logo{font-weight:700;font-size:20px;letter-spacing:-.04em;margin:0 8px 40px}.nav{padding:12px;border-radius:8px;color:#5f5b55;font-size:14px}.nav.active{background:#e6eff0;color:#0f5e68;border-left:3px solid #0f5e68;font-weight:700}.main{flex:1;min-width:0}.top{background:white;border-bottom:1px solid #e8e5e1;padding:18px 36px;display:flex;justify-content:space-between;font-weight:700}.content{max-width:1000px;margin:auto;padding:36px 32px}.back{color:#5f5b55;font-size:14px;font-weight:600}.head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:18px 0 24px}h1{font-size:26px;line-height:1.2;letter-spacing:-.025em;margin:0 0 8px}h2{font-size:20px;line-height:1.3;letter-spacing:-.02em;margin:0}p{margin:0}.muted{color:#5f5b55}.lead{font-size:15px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:20px}.outer{border:1px solid #e8e5e1;border-radius:18px;padding:8px;background:#fbfaf9}.card{border:1px solid #e8e5e1;background:white;border-radius:12px;padding:24px}.card+.card{margin-top:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{display:inline-block;background:#fcf1dc;color:#684000;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap}.pill.ok{background:#e4f5eb;color:#126c39}.pill.no{background:#fdebeb;color:#a42228}.meta{font-size:13px;color:#5f5b55;margin-top:7px}.details{margin:22px 0 0}.item{padding:15px 0;border-top:1px solid #e8e5e1}.label{color:#5f5b55;font-size:13px;font-weight:700;margin-bottom:4px}.value{font-size:15px;font-weight:600}.note{border-radius:10px;background:#f7f6f4;padding:14px;font-size:14px;margin-top:18px}.actions{display:flex;gap:10px;margin-top:20px}.btn{border:1px solid #8a857d;border-radius:9px;padding:11px 16px;background:white;font-weight:700;min-height:44px}.primary{background:#0f5e68;color:white;border-color:#0f5e68}.danger{color:#a42228}.status{padding:15px 18px;border-left:4px solid #147a41;background:#e4f5eb;border-radius:8px;margin-bottom:20px;font-size:14px}.status.bad{border-color:#c02c31;background:#fdebeb}.status.warn{border-color:#8f5800;background:#fcf1dc}.empty{text-align:center;padding:60px 24px}.empty .icon{border:1px solid #e8e5e1;border-radius:50%;width:54px;height:54px;margin:0 auto 16px;display:grid;place-items:center;font-size:24px}.empty p{margin:10px auto 0;max-width:420px}.history{margin-top:20px}.history .row{padding:14px 0;border-top:1px solid #e8e5e1}.caption{font-size:13px;color:#5f5b55}.mobilebar{display:none}@media(max-width:650px){.side{display:none}.top{padding:16px 20px;font-size:15px}.content{padding:24px 16px 32px}.head{display:block;margin:16px 0 20px}h1{font-size:24px}.grid{display:block}.grid>.outer+ .outer{margin-top:14px}.card{padding:20px}.actions .btn{flex:1}.empty{padding:48px 12px}.top span:last-child{font-size:13px}.mobilebar{display:block}}
</style></head><body><div class="shell"><aside class="side"><div class="logo">LEGEND</div><div class="nav">Ringkasan</div><div class="nav">Kotak persetujuan</div><div class="nav">Tim &amp; organisasi</div><div class="nav active">Akses dukungan</div><div class="nav">Pengaturan</div></aside><main class="main"><div class="top"><span>Pengaturan organisasi</span><span>Owner &nbsp; ◉</span></div><div class="content"><div class="back">‹ &nbsp; Pengaturan</div><div class="head"><div><h1>Akses dukungan</h1><p class="muted lead">Tinjau akses sementara ke data organisasi Anda.</p></div></div><div id="state"></div></div></main></div><script>
const params=new URLSearchParams(location.search), state=params.get('state')||'request';
const sample=`<div class="row"><div><h2>Permintaan akses dukungan</h2><div class="meta">Diterima 11 Nov 2026, 09.15</div></div><span class="pill">◷ Menunggu</span></div><div class="details"><div class="item"><div class="label">Diminta oleh</div><div class="value">Rina Putri · Tim dukungan</div></div><div class="item"><div class="label">Alasan</div><div class="value">Memperbaiki pengaturan integrasi yang gagal tersimpan.</div></div><div class="item"><div class="label">Cakupan akses</div><div class="value">Baca dan ubah data organisasi</div><div class="caption">Akses ini memungkinkan perubahan, bukan hanya melihat data.</div></div><div class="item"><div class="label">Durasi akses</div><div class="value">30 menit (diminta)</div></div><div class="item"><div class="label">Batas keputusan</div><div class="value">12 Nov 2026, 09.15</div><div class="caption">Permintaan kedaluwarsa setelah 24 jam.</div></div></div><div class="note">Persetujuan hanya untuk permintaan ini. Aktivitas dicatat dan akses dapat dicabut sebelum waktunya berakhir.</div><div class="actions"><button class="btn danger">Tolak</button><button class="btn primary">Setujui akses</button></div><p class="caption" style="margin-top:12px">Hanya owner yang dapat memutuskan, setelah verifikasi dua langkah dan tanpa sesi penyamaran.</p>`;
const guide=`<h2>Sebelum memutuskan</h2><p class="muted" style="margin-top:10px;font-size:14px">Pastikan Anda mengenali peminta dan alasan aksesnya. Tim dukungan dapat mengubah data selama akses aktif.</p><div class="item" style="margin-top:18px"><div class="label">Akses tercatat</div><div class="value">Aktivitas tersedia di log audit.</div></div><div class="item"><div class="label">Anda memegang kendali</div><div class="value">Cabut akses kapan saja.</div></div>`;
const detail=`<div class="grid"><div class="outer"><div class="card">${sample}</div></div><div class="outer"><div class="card">${guide}</div></div></div>`;
const active=`<div class="outer"><div class="card"><div class="row"><div><h2>Akses aktif</h2><p class="meta">Disetujui 11 Nov 2026, 09.20</p></div><span class="pill ok">● Aktif</span></div><div class="details"><div class="item"><div class="label">Pemegang akses</div><div class="value">Rina Putri · Tim dukungan</div></div><div class="item"><div class="label">Cakupan</div><div class="value">Baca dan ubah data organisasi</div></div><div class="item"><div class="label">Berakhir</div><div class="value">11 Nov 2026, 09.50</div></div></div><button class="btn danger" style="margin-top:12px">Cabut akses</button><p class="caption" style="margin-top:12px">Pencabutan menghentikan akses sebelum waktu berakhir.</p></div></div>`;
let out='';if(state==='request')out=detail;if(state==='empty')out=`<div class="outer"><div class="card empty"><div class="icon">✓</div><h2>Tidak ada permintaan menunggu</h2><p class="muted">Jika tim dukungan meminta akses untuk mengubah data, permintaannya akan muncul di sini.</p></div></div>`;if(state==='success')out=`<div class="status"><strong>✓ Akses disetujui.</strong> Tim dukungan dapat bekerja selama waktu yang ditentukan.</div>${active}`;if(state==='rejected')out=`<div class="status bad"><strong>✓ Permintaan ditolak.</strong> Tim dukungan tidak memperoleh akses dari permintaan ini.</div><div class="outer"><div class="card"><div class="row"><div><h2>Permintaan akses dukungan</h2><p class="meta">Rina Putri · 11 Nov 2026, 09.15</p></div><span class="pill no">Ditolak</span></div><div class="note">Keputusan tercatat di log audit.</div></div></div>`;if(state==='offline')out=`<div class="status warn"><strong>! Tidak ada koneksi.</strong> Hubungkan kembali untuk memuat status terbaru dan mengambil keputusan. Akses tidak dapat disetujui atau ditolak saat offline.</div><div class="outer"><div class="card empty"><div class="icon">!</div><h2>Permintaan belum dapat dimuat</h2><p class="muted">Periksa koneksi, lalu coba lagi.</p><button class="btn" style="margin-top:20px">Coba lagi</button></div></div>`;if(state==='expired')out=`<div class="status warn"><strong>◷ Permintaan kedaluwarsa.</strong> Batas 24 jam telah lewat; akses tidak diberikan.</div><div class="outer"><div class="card"><div class="row"><div><h2>Permintaan akses dukungan</h2><p class="meta">Rina Putri · 11 Nov 2026, 09.15</p></div><span class="pill">Kedaluwarsa</span></div><div class="note">Tim dukungan perlu mengirim permintaan baru jika akses masih diperlukan.</div></div></div>`;if(state==='revoke')out=`${active}<div class="outer history"><div class="card"><h2>Cabut akses dukungan?</h2><p class="muted" style="margin-top:10px">Akses Rina Putri untuk membaca dan mengubah data organisasi akan segera berakhir.</p><div class="actions"><button class="btn">Batal</button><button class="btn primary">Ya, cabut akses</button></div></div></div>`;document.getElementById('state').innerHTML=out;
</script></body></html>
