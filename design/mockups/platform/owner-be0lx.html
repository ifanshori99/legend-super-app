<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner tenant · Panel Platform</title><style>
@font-face{font-family:Jakarta;src:url('../assets/plus-jakarta-sans-latin.woff2')}*{box-sizing:border-box}body{margin:0;background:#f7f6f4;color:#1c1b19;font:16px/1.5 Jakarta,sans-serif}button,input,textarea{font:inherit}.shell{display:flex;min-height:100vh}.side{width:240px;flex-shrink:0;background:#fbfaf9;border-right:1px solid #e8e5e1;padding:28px 18px}.logo{font-weight:700;font-size:20px;margin:0 8px 40px}.nav{padding:12px;color:#5f5b55;font-size:14px}.active{background:#e6eff0;border-left:3px solid #0f5e68;color:#0f5e68;border-radius:8px;font-weight:700}.main{flex:1;min-width:0}.top{padding:18px 36px;background:white;border-bottom:1px solid #e8e5e1;display:flex;justify-content:space-between;font-weight:700}.content{max-width:1000px;margin:auto;padding:36px 32px}.back,.muted{color:#5f5b55}.back{font-size:14px}.head{margin:18px 0 24px}h1{font-size:26px;line-height:1.2;letter-spacing:-.025em;margin:0 0 8px}h2{font-size:20px;line-height:1.3;margin:0}p{margin:0}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.outer{border:1px solid #e8e5e1;border-radius:18px;padding:8px;background:#fbfaf9}.card{border:1px solid #e8e5e1;background:white;border-radius:12px;padding:24px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.meta{color:#5f5b55;font-size:14px;margin-top:6px}.item{border-top:1px solid #e8e5e1;margin-top:18px;padding-top:16px}.label,label{display:block;color:#5f5b55;font-size:14px;font-weight:700;margin-bottom:6px}.value{font-weight:700;overflow-wrap:anywhere}.pill{background:#e4f5eb;color:#126c39;padding:5px 10px;font-weight:700;font-size:12px;border-radius:99px;white-space:nowrap}.note{background:#f7f6f4;border-radius:10px;padding:14px;margin-top:18px;font-size:14px}.btn{border:1px solid #8a857d;border-radius:9px;min-height:44px;padding:10px 16px;background:white;color:#1c1b19;font-weight:700}.primary{background:#0f5e68;color:white;border-color:#0f5e68}.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.field{margin-top:18px}.field label{color:#1c1b19}input,textarea{display:block;width:100%;border:1px solid #8a857d;border-radius:8px;padding:10px 12px;background:white;color:#1c1b19;min-height:44px}textarea{resize:vertical}.error{color:#a42228;font-size:14px;margin-top:5px}.status{border-left:4px solid #c02c31;background:#fdebeb;padding:14px 18px;border-radius:8px;margin-bottom:20px}.status.ok{border-color:#147a41;background:#e4f5eb}.empty{text-align:center;padding:50px 24px}.empty p{max-width:410px;margin:10px auto}.skeleton{height:16px;background:#efedea;border-radius:5px;margin:14px 0;width:80%}.skeleton.short{width:45%}@media(max-width:650px){.side{display:none}.top{padding:16px 20px;font-size:15px}.content{padding:24px 16px 32px}.grid{display:block}.grid>.outer+.outer{margin-top:14px}.card{padding:20px}h1{font-size:24px}.actions .btn{flex:1}.empty{padding:40px 8px}}
</style></head><body><div class="shell"><aside class="side"><div class="logo">LEGEND</div><div class="nav">Ringkasan</div><div class="nav active">Tenant</div><div class="nav">Pengaturan platform</div></aside><main class="main"><div class="top"><span>Panel Platform</span><span>Super Admin</span></div><div class="content"><div class="back">‹ &nbsp; Tenant / Cafe Legend</div><div class="head"><h1>Owner tenant</h1><p class="muted">Kelola penetapan Owner untuk Cafe Legend.</p><p class="meta">Contoh data untuk mockup</p></div><div id="state"></div></div></main></div><script>
const state=new URLSearchParams(location.search).get('state')||'normal';
const wrap=s=>`<div class="outer"><div class="card">${s}</div></div>`;
const current=`<div class="row"><div><h2>Owner saat ini</h2><div class="meta">Cafe Legend</div></div><span class="pill">● Aktif</span></div><div class="item"><div class="label">Nama</div><div class="value">Dewi Pratama</div></div><div class="item"><div class="label">Akun</div><div class="value">dewi@example.com</div></div><div class="actions"><button class="btn primary">Ganti Owner</button></div>`;
const guide=`<h2>Perubahan akses</h2><p class="meta">Pastikan akun yang dipilih adalah penerima akses yang benar. Penetapan dan penggantian memerlukan alasan serta kode TOTP terbaru dari aplikasi autentikator.</p>`;
const form=(replace,invalid=false)=>`<h2>${replace?'Ganti Owner':'Tetapkan Owner'}</h2><p class="meta">${replace?'Owner saat ini: Dewi Pratama · dewi@example.com':'Pilih akun yang akan menjadi Owner tenant ini.'}</p><div class="field"><label for="account">Akun Owner ${replace?'baru':''}</label><input id="account" value="${replace?'Andi Saputra · andi@example.com':''}" placeholder="Cari akun berdasarkan nama atau email"><div class="meta">Pilih akun tenant yang sesuai.</div></div><div class="field"><label for="reason">Alasan perubahan</label><textarea id="reason" rows="3">${replace&&!invalid?'Perubahan penanggung jawab tenant.':''}</textarea>${invalid?'<div class="error">Masukkan alasan perubahan.</div>':''}</div><div class="field"><label for="code">Kode autentikator (TOTP)</label><input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="Masukkan kode terbaru">${invalid?'<div class="error">Kode tidak valid atau kedaluwarsa. Masukkan kode terbaru dari aplikasi autentikator.</div>':'<div class="meta">Gunakan kode terbaru dari aplikasi autentikator Anda.</div>'}</div><div class="note">Periksa akun dan alasan sebelum melanjutkan.</div><div class="actions"><button class="btn">Batal</button><button class="btn primary">${replace?'Ganti Owner':'Tetapkan Owner'}</button></div>`;
let out='';if(state==='normal')out=`<div class="grid">${wrap(current)}${wrap(guide)}</div>`;if(state==='empty')out=wrap(`<div class="empty"><h2>Belum ada Owner</h2><p class="muted">Tetapkan Owner untuk tenant Cafe Legend.</p><div class="actions" style="justify-content:center"><button class="btn primary">Tetapkan Owner</button></div></div>`);if(state==='assign'||state==='replace'||state==='validation')out=`<div class="grid">${wrap(form(state!=='assign',state==='validation'))}${wrap(guide)}</div>`;if(state==='error')out=`<div class="status"><strong>Perubahan belum tersimpan.</strong> Periksa koneksi dan coba lagi. Data yang Anda isi tetap tersedia.</div><div class="grid">${wrap(form(true))}${wrap(guide)}</div>`;if(state==='loading')out=wrap(`<h2>Memuat Owner tenant</h2><p class="meta">Mohon tunggu sebentar.</p><div class="skeleton short"></div><div class="skeleton"></div><div class="skeleton short"></div>`);if(state==='success'){const saved=JSON.parse(sessionStorage.getItem('owner-demo-result')||'null')||{action:'replace',account:'Andi Saputra · andi@example.com'};const account=String(saved.account).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const action=saved.action==='assign'?'ditetapkan':'diganti';out=`<div class="status ok"><strong>✓ Owner berhasil ${action}.</strong> Penetapan telah tersimpan.</div>${wrap(`<div class="row"><div><h2>Owner saat ini</h2><p class="meta">Cafe Legend</p></div><span class="pill">● Aktif</span></div><div class="item"><div class="label">Akun</div><div class="value">${account}</div></div><div class="actions"><button class="btn primary">Ganti Owner</button></div>`)}`;}document.getElementById('state').innerHTML=out;
const go=next=>{location.search='?state='+next};
document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{
 const label=button.textContent.trim();
 if(label==='Batal'){go(state==='assign'?'empty':'normal');return;}
 if(label==='Ganti Owner'&&state==='normal'){go('replace');return;}
 if(label==='Ganti Owner'&&state==='success'){go('replace');return;}
 if(label==='Tetapkan Owner'&&state==='empty'){go('assign');return;}
 if(label==='Ganti Owner'||label==='Tetapkan Owner'){
  const account=document.getElementById('account'),reason=document.getElementById('reason'),code=document.getElementById('code');
  document.querySelectorAll('.live-error').forEach(e=>e.remove());
  let valid=true;
  for(const [input,message] of [[account,'Pilih akun Owner.'],[reason,'Masukkan alasan perubahan.'],[code,'Masukkan kode terbaru dari aplikasi autentikator.']]){
   if(!input.value.trim()){const e=document.createElement('div');e.className='error live-error';e.textContent=message;input.after(e);valid=false;}
  }
  if(code.value.trim()&&!/^\d{6}$/.test(code.value.trim())){const e=document.createElement('div');e.className='error live-error';e.textContent='Masukkan 6 digit kode dari aplikasi autentikator.';code.after(e);valid=false;}
  if(valid){sessionStorage.setItem('owner-demo-result',JSON.stringify({action:state==='assign'?'assign':'replace',account:account.value.trim()}));go('success');}
 }
}));
</script></body></html>
