<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Legend · Klaim bagian split bill</title><link rel="stylesheet" href="final-a-mobile.css"><style>
.phone{height:844px}.split-main{position:absolute;top:110px;left:20px;right:20px}.split-main h1{font-size:26px}.intro{color:var(--muted);margin-top:6px}.summary{background:#fff;border-radius:18px;padding:16px;margin-top:18px}.summary-top,.part-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.summary-top span,.total-label{font-size:14px;color:var(--muted)}.summary-top strong{font-size:20px;white-space:nowrap}.summary-note{font-size:12px;color:var(--muted);line-height:18px;margin-top:5px}.part-head{margin:22px 0 8px;display:flex;justify-content:space-between;align-items:center}.part-head h2{font-size:17px;line-height:24px}.part-head span{font-size:12px;color:var(--muted)}.part{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:8px}.part.selected{border:1.5px solid var(--edge)}.part-row b{font-size:16px}.part-row strong{font-size:17px;white-space:nowrap}.part p{font-size:14px;line-height:20px;color:var(--muted);margin-top:4px}.part .indicator{display:flex;gap:8px;align-items:center}.unavailable{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;background:#e5d8ca;color:#67584e;font-size:14px;font-weight:700;flex-shrink:0}.radio{width:20px;height:20px}.sum{font-size:12px;line-height:18px;color:var(--muted);margin-top:10px}.notice{border-radius:12px;padding:12px;margin-top:14px;background:#f3e9dd;border-left:3px solid #8b7765}.notice.good{background:#e8f3eb;border-color:#246443}.notice.bad{background:#fff0f0;border-color:#a51d2d}.notice strong{font-size:14px;line-height:20px}.notice p{font-size:14px;line-height:20px;margin-top:4px}.split-footer .primary{width:100%}.split-footer .primary:disabled{background:#e5d8ca;color:#67584e}.split-footer .footnote{font-size:12px;line-height:18px;text-align:center;color:var(--glass-muted);margin:0 4px 8px}.spinner{width:16px;height:16px;border:2px solid #f3d9cb;border-top-color:#fff;border-radius:50%}.backlink{display:block;text-align:center;margin:6px auto 0}.caption{font-size:12px;line-height:18px;color:var(--muted);margin-top:10px}.status .ico{width:14px}
</style><div class="phone"><div class="status"><span>9.41</span><span>▰ ▰</span></div><div class="photo-band"></div><header class="glass glass-light nav-glass"><button class="icon-button" aria-label="Kembali">‹</button><h1>Bagi tagihan</h1><span class="end"></span></header><main class="split-main" id="main"></main><footer class="glass glass-light float-footer split-footer" id="footer"></footer></div><script>
const state=new URLSearchParams(location.search).get('state')||'belum-diklaim';
const cfg={
 'belum-diklaim':{help:'Pilih satu bagian untuk dibayar dari ponsel Anda.',note:'Klaim bagian dulu, lalu pilih cara bayar.',button:'Klaim bagian saya'},
 'sedang-klaim':{help:'Pilih satu bagian untuk dibayar dari ponsel Anda.',note:'Mohon tunggu, bagian sedang diklaim.',button:'Mengklaim bagian…',busy:true},
 'berhasil':{help:'Bagian Anda siap untuk dilanjutkan.',notice:'Bagian berhasil diklaim',detail:'Bagian 1 menjadi bagian Anda. Belum dibayar.',kind:'good',note:'Klaim belum berarti pembayaran.',button:'Lanjut bayar Rp 53.200'},
 'sudah-diklaim':{help:'Pilih satu bagian untuk dibayar dari ponsel Anda.',notice:'Bagian sudah diklaim',detail:'Tamu lain lebih dulu mengklaim Bagian 1. Pilih bagian lain.',kind:'bad',note:'Pilih bagian yang masih tersedia.',button:'Klaim bagian saya',disabled:true},
 'sesi-berakhir':{help:'Sesi meja sudah tidak aktif.',notice:'Sesi meja berakhir',detail:'Bagian ini tidak dapat diklaim. Minta bantuan staf untuk melanjutkan.',kind:'bad',note:'Klaim tidak tersedia pada sesi yang sudah berakhir.',button:'Klaim bagian saya',disabled:true},
 'error':{help:'Pilih satu bagian untuk dibayar dari ponsel Anda.',notice:'Status klaim belum diketahui',detail:'Kami belum dapat memastikan status bagian ini. Periksa kembali sebelum mencoba lagi.',kind:'bad',note:'Periksa status terbaru sebelum memilih bagian.',button:'Periksa status bagian'}
}[state];
const taken=state==='sudah-diklaim', success=state==='berhasil', ended=state==='sesi-berakhir', uncertain=state==='error';
document.getElementById('main').innerHTML=`<p class="table-note">Cafe Legend · Meja A01</p><h1>Bagian pembayaran</h1><p class="intro">${cfg.help}</p><section class="summary"><div class="summary-top"><span>Total tagihan</span><strong>Rp 106.400</strong></div><p class="summary-note">Bagi rata · 2 bagian · Termasuk pajak dan service</p></section>${cfg.notice?`<div class="notice ${cfg.kind}" role="status"><strong>${cfg.notice}</strong><p>${cfg.detail}</p></div>`:''}<div class="part-head"><h2>Pilih bagian</h2><span>2 bagian</span></div><div class="part ${!taken&&!ended&&!uncertain?'selected':''}"><div class="part-row"><div class="indicator">${taken||ended||uncertain?'<span class="unavailable" aria-label="Tidak tersedia">−</span>':'<span class="radio on"></span>'}<b>Bagian 1</b></div><strong>Rp 53.200</strong></div><p>${success?'Diklaim oleh Anda · Belum dibayar':taken?'Sudah diklaim tamu lain':ended?'Sesi berakhir':uncertain?'Status belum diketahui':'Tersedia · Belum dibayar'}</p></div><div class="part"><div class="part-row"><div class="indicator">${ended||uncertain?'<span class="unavailable" aria-label="Tidak tersedia">−</span>':'<span class="radio"></span>'}<b>Bagian 2</b></div><strong>Rp 53.200</strong></div><p>${ended?'Sesi berakhir':uncertain?'Periksa status terbaru':'Tersedia · Belum dibayar'}</p></div><p class="sum">Jumlah kedua bagian Rp 106.400, sama dengan total tagihan.</p>`;
document.getElementById('footer').innerHTML=`<p class="footnote">${cfg.note}</p><button class="primary" ${cfg.disabled||cfg.busy?'disabled':''}>${cfg.busy?'<span class="spinner"></span>':''}${cfg.button}</button>${taken?'<button class="text-link backlink">Perbarui bagian</button>':''}`;
</script></html>
