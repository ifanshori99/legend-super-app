<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legend · Koreksi absensi</title><style>
@font-face{font-family:Jakarta;src:url('../assets/plus-jakarta-sans-latin.woff2')}*{box-sizing:border-box}body{margin:0;background:#f7f6f4;color:#1c1b19;font:16px/1.5 Jakarta,sans-serif}h1,h2,p{margin:0}h1{font-size:23px;line-height:1.3}h2{font-size:19px;line-height:1.35}small,.muted{color:#5f5b55}small{font-size:13px}.top{height:64px;background:white;border-bottom:1px solid #e8e5e1;padding:0 20px;display:flex;align-items:center;justify-content:space-between;font-weight:700}.main{padding:24px 20px 36px;max-width:620px;margin:auto;min-height:calc(100vh - 120px)}.heading{margin-bottom:20px}.heading p{color:#5f5b55;margin-top:6px}.shell{padding:8px;background:#fbfaf9;border:1px solid #e8e5e1;border-radius:18px}.card{padding:18px;background:#fff;border:1px solid #e8e5e1;border-radius:12px;box-shadow:0 1px 1px #1c1b1908}.card+.card{margin-top:12px}.tag{display:inline-block;border-radius:999px;padding:4px 10px;background:#fdebeb;color:#a42127;font-size:13px;font-weight:700}.neutral{background:#f1efec;color:#3d3a35}.notice{padding:14px 16px;border-radius:10px;background:#fdebeb;color:#922128;border-left:4px solid #b22b31;margin-bottom:16px}.notice p{margin-top:4px}.space{margin-top:14px}.divider{height:1px;background:#e8e5e1;margin:16px 0}.detail{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail p{margin-top:2px}.reason{background:#f7f6f4;padding:12px;border-radius:9px}.reason p{margin-top:4px}button,a.button{display:flex;width:100%;justify-content:center;align-items:center;min-height:48px;border:1px solid #d7d3ce;background:white;border-radius:9px;padding:10px 16px;font:700 14px Jakarta;color:#1c1b19;text-decoration:none;cursor:pointer}.primary{background:#0f5e68!important;color:#fff!important;border-color:#0f5e68!important}.actions{display:grid;gap:8px;margin-top:18px}.textbtn{border:0;color:#922128}button:focus-visible,a:focus-visible{outline:2px solid #0f5e68;outline-offset:2px}.bottom{height:56px;background:white;border-top:1px solid #e8e5e1;display:flex;align-items:center;justify-content:space-around;font-size:12px;color:#5f5b55}.bottom strong{color:#0f5e68}.empty{text-align:center;padding:32px 18px}.empty p{margin-top:8px}.skeleton{height:18px;border-radius:6px;background:#e8e5e1;margin:12px 0}.skeleton.short{width:55%}.tabs{display:flex;gap:6px;background:#f1efec;padding:5px;border-radius:12px;margin:0 0 18px}.tabs a{padding:9px 12px;text-decoration:none;color:#1c1b19;font-size:14px;font-weight:700}.tabs .selected{background:white;border-radius:8px;box-shadow:0 1px 3px #0002}.hint{font-size:13px;color:#5f5b55;margin-top:8px}label{display:block;font-size:14px;font-weight:700;margin:16px 0 6px}input,textarea{width:100%;min-height:48px;border:1px solid #8a857d;border-radius:9px;padding:12px;background:#fff;color:#1c1b19;font:16px Jakarta,sans-serif}textarea{min-height:84px;resize:vertical}.confirm{margin-top:16px;border-top:1px solid #e8e5e1;padding-top:16px}
</style></head><body><div class="top"><span>‹ &nbsp; Kehadiran</span><span>☰</span></div><main class="main"><div class="heading"><h1>Koreksi absensi</h1><p>Pantau koreksi yang menunggu dikirim atau ditinjau.</p></div><div class="tabs"><a href="?screen=normal" class="selected">Antrean koreksi</a></div><div id="content"></div></main><nav class="bottom"><span>Beranda</span><strong>Kehadiran</strong><span>Pengajuan</span><span>Profil</span></nav><script>
const state=new URLSearchParams(location.search).get('screen')||'ditolak';const link=(label,to,cls='')=>`<a class="button ${cls}" href="?screen=${to}">${label}</a>`;const shell=x=>`<div class="shell"><div class="card">${x}</div></div>`;const item=`<span class="tag">✕ Ditolak</span><h2 class="space">Koreksi jam masuk</h2><p class="muted">18 November 2026</p><div class="divider"></div><div class="detail"><div><small>Jam tercatat</small><p>08.15</p></div><div><small>Jam diajukan</small><p>08.00</p></div></div><div class="divider"></div><div class="reason"><small>Alasan dari server</small><p>Data absensi telah berubah. Periksa kembali jam yang diajukan.</p></div><p class="hint">Koreksi tetap tersimpan di antrean dan belum diajukan untuk persetujuan.</p>`;let body='';
if(state==='ditolak'||state==='hapus')body=`<div class="notice"><strong>✕ Koreksi gagal dikirim</strong><p>Server menolak koreksi ini. Periksa alasannya sebelum mencoba lagi.</p></div>${shell(item+(state==='hapus'?`<div class="confirm"><h2>Buang koreksi ini?</h2><p class="muted space">Koreksi yang tersimpan di antrean akan dihapus.</p><div class="actions">${link('Batal','ditolak')}${link('Buang koreksi','kosong','textbtn')}</div></div>`:`<div class="actions">${link('Ubah koreksi','ubah','primary')}${link('Coba kirim lagi','memuat')}${link('Buang koreksi','hapus','textbtn')}</div>`))}`;
if(state==='normal')body=shell(`<span class="tag neutral">◷ Menunggu dikirim</span><h2 class="space">Koreksi jam masuk</h2><p class="muted">18 November 2026 · 08.15 → 08.00</p><p class="hint">Koreksi tersimpan dalam antrean.</p>${link('Lihat koreksi yang ditolak','ditolak')}`);
if(state==='kosong')body=shell(`<div class="empty"><h2>Belum ada koreksi dalam antrean</h2><p class="muted">Koreksi yang menunggu dikirim akan muncul di sini.</p></div>`);
if(state==='memuat')body=shell(`<h2>Mengirim koreksi…</h2><p class="muted space">Koreksi tetap tersimpan selama proses pengiriman.</p><div class="skeleton"></div><div class="skeleton short"></div>`);
if(state==='error')body=`<div class="notice"><strong>⚠ Antrean belum dapat dimuat</strong><p>Periksa koneksi, lalu coba lagi.</p></div>${shell(`<h2>Koreksi tetap tersimpan</h2><p class="muted space">Kami belum dapat menampilkan antrean saat ini.</p><div class="actions">${link('Coba lagi','normal','primary')}</div>`)}`;
if(state==='ubah')body=shell(`<span class="tag">✕ Ditolak</span><h2 class="space">Ubah koreksi</h2><p class="muted">18 November 2026</p><div class="divider"></div><p>Jam tercatat<br><strong>08.15</strong></p><label for="jam">Jam diajukan</label><input id="jam" type="time" value="08:00"><p class="hint">Periksa jam yang diajukan sesuai alasan dari server.</p><label for="alasan">Alasan koreksi</label><textarea id="alasan">Jam masuk tercatat tidak sesuai.</textarea><div class="actions">${link('Simpan perubahan','normal','primary')}${link('Batal','ditolak')}</div>`);
document.querySelector('#content').innerHTML=body;
</script></body></html>
