<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Legend · Pengajuan karyawan</title><style>
@font-face{font-family:Jakarta;src:url('../assets/plus-jakarta-sans-latin.woff2')}*{box-sizing:border-box}body{margin:0;background:#f7f6f4;color:#1c1b19;font:16px/1.5 Jakarta,sans-serif}h1,h2,h3,p{margin:0}h1{font-size:25px;line-height:1.25}h2{font-size:20px;line-height:1.35}h3{font-size:16px}small,.muted{color:#5f5b55}small{font-size:13px}.top{height:64px;background:#fff;border-bottom:1px solid #e8e5e1;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-weight:700}.layout{display:flex}.side{width:256px;flex:none;background:#fbfaf9;min-height:calc(100vh - 64px);padding:24px;color:#5f5b55;border-right:1px solid #e8e5e1}.side p{padding:11px 0}.side .on{color:#0f5e68;font-weight:700}.main{padding:28px 24px;max-width:1100px;width:100%;margin:auto}.heading{margin-bottom:24px}.heading p{color:#5f5b55;margin-top:6px}.shell{background:#fbfaf9;border:1px solid #e8e5e1;border-radius:18px;padding:8px}.card{background:#fff;border:1px solid #e8e5e1;border-radius:12px;padding:20px;box-shadow:0 1px 1px #1c1b1908}.card+.card{margin-top:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.stack{display:grid;gap:16px}.muted{color:#5f5b55}.tag{display:inline-block;border-radius:999px;padding:3px 10px;background:#e9f0fd;color:#1749b2;font-size:13px;font-weight:700}.tag.warn{background:#fcf1dc;color:#805000}.tag.green{background:#e4f5eb;color:#12653a}.tag.red{background:#fdebeb;color:#a42127}.notice{padding:14px 16px;border-radius:10px;background:#fcf1dc;color:#704600;border-left:4px solid #a36300;margin-bottom:16px}.notice.good{background:#e4f5eb;color:#125d37;border-color:#147a41}.notice.bad{background:#fdebeb;color:#922128;border-color:#b22b31}.tabs{display:flex;gap:6px;background:#f1efec;padding:5px;border-radius:12px;overflow:auto;margin:18px 0}.tabs span{white-space:nowrap;padding:9px 12px;border-radius:8px;font-size:14px;font-weight:700}.tabs .selected{background:#fff;box-shadow:0 1px 3px #0002}label{display:block;font-size:14px;font-weight:700;margin:16px 0 6px}.field{background:#fff;border:1px solid #8a857d;border-radius:9px;padding:12px;min-height:48px}.hint{font-size:13px;color:#5f5b55;margin-top:6px}button,.button{display:inline-flex;justify-content:center;align-items:center;min-height:44px;border:1px solid #d7d3ce;background:white;border-radius:9px;padding:10px 16px;font:700 14px Jakarta;color:#1c1b19}.primary{background:#0f5e68;color:#fff;border-color:#0f5e68}.wide{width:100%;margin-top:20px}.divider{height:1px;background:#e8e5e1;margin:16px 0}.balance{background:#f7f6f4;border-radius:10px;padding:14px}.balance strong{font-size:21px}.tablehead,.item{display:grid;grid-template-columns:1.15fr 1fr 1.5fr 1fr 80px;gap:12px;align-items:center}.tablehead{padding:12px 16px;color:#5f5b55;font-size:13px;border-bottom:1px solid #e8e5e1}.item{padding:16px;border-bottom:1px solid #e8e5e1}.item:last-child{border:0}.item p{font-size:14px}.actions{display:flex;gap:8px}.actions button{flex:1}.back{color:#5f5b55;font-size:14px;margin-bottom:20px}.bottom{background:white;border-top:1px solid #e8e5e1;display:flex;justify-content:space-around;padding:12px 8px;font-size:12px;color:#5f5b55}.bottom strong{color:#0f5e68}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px}.details p{font-size:14px}.list{padding:0;overflow:hidden}.list-head{padding:18px 16px}.form{max-width:620px;margin:auto}.sample{font-size:12px;color:#5f5b55}.empty{text-align:center;padding:32px 12px}.empty .symbol{font-size:28px;color:#5f5b55}.empty p{margin-top:8px}.foot{font-size:13px;color:#5f5b55;padding:14px 16px}.mobileonly{display:none}@media(max-width:600px){.side{display:none}.top{padding:0 20px}.main{padding:24px 20px}.heading{margin-bottom:20px}.heading h1{font-size:23px}.card{padding:18px}.list{padding:0}.list-head{display:block}.list-head span{display:block;margin-top:12px}.tablehead{display:none}.item{display:block;padding:18px 16px}.item>*{margin-bottom:8px}.item button{width:100%}.mobileonly{display:block}.desktoponly{display:none}.tabs span{padding:9px}.details{gap:8px}}
</style></head><body><div id="app"></div><script>
const state=new URLSearchParams(location.search).get('screen')||'cuti';const employee=['cuti','tukar','ganti','lembur','sukses','ditolak','offline','kosong'].includes(state);const button=(text,cls='')=>`<button class="${cls}">${text}</button>`;const topbar=employee?`<div class="top"><span>‹ &nbsp; Pengajuan saya</span><span>☰</span></div>`:`<div class="top"><span>☰ &nbsp; Persetujuan tim</span><span>♧ &nbsp; ◉</span></div>`;const nav=employee?`<div class="bottom"><span>Beranda</span><span>Jadwal</span><strong>Pengajuan</strong><span>Profil</span></div>`:'';const side=`<aside class="side"><strong>Cafe Legend</strong><p>▦ &nbsp; Kelola</p><p class="on">▣ &nbsp; Kotak Approval</p><p>◷ &nbsp; Jadwal tim</p><p>♙ &nbsp; Karyawan</p><p>▤ &nbsp; Kehadiran</p><p>⚙ &nbsp; Pengaturan</p></aside>`;let content='';
const tabs=(active)=>`<div class="tabs"><span class="${['tukar','ganti'].includes(active)?'selected':''}">Tukar / ganti shift</span><span class="${active==='cuti'?'selected':''}">Cuti / izin</span><span class="${active==='lembur'?'selected':''}">Lembur</span></div>`;const field=(label,value,hint='')=>`<label>${label}</label><div class="field">${value}</div>${hint?`<p class="hint">${hint}</p>`:''}`;
if(['cuti','tukar','ganti','lembur'].includes(state)){let form='';if(state==='cuti')form=`<div class="balance"><small>Saldo cuti tahunan</small><br><strong>8 hari</strong> <small>tersedia</small></div>${field('Jenis cuti / izin','Cuti tahunan &nbsp;⌄')}${field('Tanggal mulai','18 November 2026 &nbsp; ▦')}${field('Tanggal selesai','19 November 2026 &nbsp; ▦')}${field('Alasan','Keperluan keluarga')}${field('Lampiran (opsional)','＋ &nbsp; Tambah lampiran')}`;if(state==='tukar')form=`${field('Jenis pengajuan','Tukar shift &nbsp;⌄')}${field('Shift saya','18 November 2026 · Pagi, 08.00–16.00 &nbsp;⌄')}${field('Rekan yang memenuhi syarat','Pilih rekan &nbsp;⌄','Rekan perlu menerima sebelum supervisor meninjau.')}${field('Shift rekan','Pilih shift &nbsp;⌄')}${field('Alasan','Ada keperluan keluarga')}`;if(state==='ganti')form=`${field('Jenis pengajuan','Ganti shift &nbsp;⌄')}${field('Shift saya','18 November 2026 · Pagi, 08.00–16.00 &nbsp;⌄')}${field('Rekan yang memenuhi syarat','Pilih rekan &nbsp;⌄','Rekan perlu menerima sebelum supervisor meninjau.')}${field('Alasan','Ada keperluan keluarga')}`;if(state==='lembur')form=`${field('Tanggal','18 November 2026 &nbsp; ▦')}${field('Mulai','16.00 &nbsp;◷')}${field('Selesai','18.00 &nbsp;◷')}${field('Alasan','Persiapan acara outlet')}${field('Lampiran (opsional)','＋ &nbsp; Tambah lampiran')}`;content=`<div class="form"><div class="back">‹ &nbsp; Pengajuan saya</div><div class="heading"><h1>Ajukan ${['tukar','ganti'].includes(state)?'tukar / ganti shift':state==='cuti'?'cuti atau izin':'lembur'}</h1><p>Lengkapi rincian untuk ditinjau supervisor.</p></div>${tabs(state)}<div class="shell"><div class="card">${form}${button('Kirim pengajuan','primary wide')}<p class="hint">Pengajuan akan mengikuti alur persetujuan yang berlaku.</p></div></div></div>`}
else if(employee){let body='';if(state==='sukses')body=`<div class="notice good"><strong>✓ Pengajuan terkirim</strong><br>Pengajuan cuti Anda menunggu persetujuan.</div><div class="card"><span class="tag warn">◷ Menunggu persetujuan</span><h2 style="margin-top:12px">Cuti tahunan</h2><p>18–19 November 2026</p><p class="muted">Keperluan keluarga</p><div class="divider"></div><p class="muted">Anda dapat memantau perkembangan di sini.</p></div>`;if(state==='ditolak')body=`<div class="notice bad"><strong>Pengajuan ditolak</strong><br>Supervisor telah memberikan alasan.</div><div class="card"><span class="tag red">✕ Ditolak</span><h2 style="margin-top:12px">Cuti tahunan</h2><p>18–19 November 2026</p><div class="divider"></div><small>Alasan penolakan</small><p>Jadwal tim pada tanggal tersebut belum mencukupi.</p></div>`;if(state==='offline')body=`<div class="notice"><strong>⚠ Tidak ada koneksi</strong><br>Pengajuan belum dapat dikirim. Periksa koneksi lalu coba lagi.</div><div class="card"><h2>Pengajuan tersimpan di layar ini</h2><p class="muted" style="margin-top:8px">Jangan tutup halaman sebelum pengajuan berhasil dikirim.</p>${button('Coba lagi','wide')}</div>`;if(state==='kosong')body=`<div class="card empty"><div class="symbol">▤</div><h2>Belum ada pengajuan</h2><p class="muted">Pengajuan cuti, tukar shift, dan lembur Anda akan muncul di sini.</p>${button('Buat pengajuan','primary wide')}</div>`;content=`<div class="form"><div class="heading"><h1>Pengajuan saya</h1><p>Pantau pengajuan dan keputusan supervisor.</p></div>${body}</div>`}
else{const rows=[['Tukar shift','Ayu Wulandari','18 Nov · Pagi → Dimas Pratama','Menunggu tinjauan'],['Cuti tahunan','Maya Anggraini','20–21 Nov 2026 · 2 hari','Menunggu tinjauan'],['Lembur','Dewi Lestari','18 Nov 2026 · 16.00–18.00','Menunggu tinjauan']];let body='';if(state==='queue')body=`<div class="shell"><div class="card list"><div class="row list-head"><h2>Perlu ditinjau</h2><span class="muted">Cari nama karyawan… &nbsp;⌕</span></div><div class="tablehead"><span>Jenis</span><span>Karyawan</span><span>Rincian</span><span>Status</span><span>Aksi</span></div>${rows.map(r=>`<div class="item"><span class="tag">${r[0]}</span><strong>${r[1]}</strong><p>${r[2]}</p><span class="muted">◷ ${r[3]}</span>${button('Tinjau')}</div>`).join('')}<div class="foot">3 pengajuan</div></div></div>`;if(state==='detail')body=`<div class="shell"><div class="card"><div class="row"><span class="tag">Tukar shift</span><span class="tag warn">◷ Menunggu tinjauan</span></div><h2 style="margin-top:16px">Ayu Wulandari</h2><p class="muted">Mengajukan tukar shift</p><div class="divider"></div><div class="details"><div><small>Shift semula</small><p>18 Nov 2026<br>08.00–16.00</p></div><div><small>Rekan</small><p>Dimas Pratama<br>Sudah menerima</p></div><div><small>Alasan</small><p>Keperluan keluarga</p></div></div><div class="notice" style="margin-top:20px"><strong>⚠ Periksa aturan jam kerja</strong><br>Persetujuan eksplisit diperlukan jika perubahan melanggar aturan.</div><div class="actions">${button('Tolak')}${button('Setujui','primary')}</div><p class="hint">Penolakan meminta alasan sebelum dikirim.</p></div></div>`;if(state==='queue-empty')body=`<div class="card empty"><div class="symbol">✓</div><h2>Tidak ada pengajuan untuk ditinjau</h2><p class="muted">Pengajuan baru dari tim akan muncul di sini.</p></div>`;if(state==='queue-success')body=`<div class="notice good"><strong>✓ Keputusan tersimpan</strong><br>Pengajuan telah disetujui.</div><div class="card"><h2>Tukar shift · Ayu Wulandari</h2><p class="muted">18 November 2026 · Dimas Pratama</p><p style="margin-top:12px"><span class="tag green">✓ Disetujui</span></p></div>`;if(state==='queue-reject')body=`<div class="card"><h2>Tolak pengajuan</h2><p class="muted">Cuti tahunan · Maya Anggraini</p>${field('Alasan penolakan','Jadwal tim pada tanggal tersebut belum mencukupi.','Alasan akan terlihat oleh karyawan.')}<div class="actions" style="margin-top:20px">${button('Batal')}${button('Kirim penolakan','primary')}</div></div>`;if(state==='queue-offline')body=`<div class="notice"><strong>⚠ Tidak ada koneksi</strong><br>Keputusan belum tersimpan. Periksa koneksi lalu coba lagi.</div><div class="card"><h2>Pengajuan belum diproses</h2><p class="muted">Tidak ada keputusan yang dikirim saat offline.</p>${button('Coba lagi','wide')}</div>`;content=`<div class="heading"><h1>Persetujuan tim</h1><p>Tinjau pengajuan shift, cuti, dan lembur karyawan.</p></div>${body}`}
document.querySelector('#app').innerHTML=topbar+`<div class="layout">${employee?'':side}<main class="main">${content}</main></div>`+nav;
</script></body></html>
