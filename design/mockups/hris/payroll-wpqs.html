if(s==='sukses'||s==='thr-sukses')body=`<div class="notice good"><strong>✓ ${thr?'Jadwal THR':'Kebijakan payroll'} tersimpan</strong><br>Rincian dapat ditinjau pada daftar di bawah.</div><div class="shell"><section class="card"><div class="row"><h2>${title}</h2>${link(thr?'thr-baru':'kebijakan',thr?'Buat jadwal THR':'Buat kebijakan','primary')}</div><div class="table"><strong>${thr?'THR Idul Fitri 2027':'Karyawan bulanan'}</strong><p class="muted">PT Legend Nusantara · ${thr?'Pembayaran 3 Maret 2027':'Bulanan · Gajian tanggal 28'}</p></div></section></div>`;
document.querySelector('#app').innerHTML=`<div class="heading"><h1>Pengaturan payroll</h1><p>Kelola kebijakan gaji dan jadwal THR per badan usaha.</p></div>${nav}${body}<p class="sample">Data dan tanggal pada layar ini adalah contoh untuk mockup.</p><nav class="states" aria-label="Kondisi mockup"><strong>Kondisi mockup</strong><br><a href="?screen=kosong">Kebijakan kosong</a><a href="?screen=kebijakan">Kebijakan pertama</a><a href="?screen=validasi">Validasi</a><a href="?screen=memuat">Memuat</a><a href="?screen=entitas-kosong">Badan usaha kosong</a><a href="?screen=entitas-gagal">Gagal memuat</a><a href="?screen=simpan-gagal">Gagal menyimpan</a><a href="?screen=sukses">Berhasil</a><a href="?screen=thr-kosong">THR kosong</a><a href="?screen=thr-baru">Jadwal pertama</a><a href="?screen=thr-validasi">Validasi THR</a><a href="?screen=thr-simpan-gagal">Gagal simpan THR</a><a href="?screen=thr-sukses">THR tersimpan</a></nav>`;
