const items=[['Espresso dingin','Espresso pekat dengan es.'],['Cappuccino','Espresso, susu, dan buih lembut.'],['Roti ayam panggang','Ayam, selada, dan tomat segar.'],['Croissant mentega','Renyah di luar, lembut di dalam.']];
function card(i){const x=items[i];return `<article class="card"><div class="photo p${i}" role="img" aria-label="Foto ilustratif ${x[0]}">${i===0?'<span class="in-cart">1 di keranjang</span>':''}</div><div class="card-body"><h3>${x[0]}</h3>${isB?`<p class="description">${x[1]}</p>`:''}${isB?'':'<div class="price">Rp 23.000</div>'}<div class="card-tools">${isB?'<span class="price">Rp 23.000</span>':''}${i===0?stepper():`<button class="add">${icon('plus')} Tambah</button>`}</div></div></article>`}
function header(){return `<div class="top"><div class="wordmark">Cafe Legend</div><div class="desktop-only desktop-nav"><b>Menu</b><span>Pesanan meja</span><span>Tagihan</span><span class="row">${icon('help')} Panggil waiter</span></div><button class="iconbtn" aria-label="Panggil waiter">${icon('help')}</button></div>`}
function context(){return `<div class="context"><span class="pill">${icon('people')} Meja A01 · 2 tamu</span><button class="textlink">Ubah</button></div>`}
function search(){return `<div class="search">${icon('search')}<span>Cari di semua menu</span></div>`}
function categories(){return `<nav class="categories"><button class="tab active">Semua</button><button class="tab">Kopi</button><button class="tab">Makanan</button><button class="tab filter" aria-label="Filter menu">${icon('filter')}</button></nav>`}
function line(){return `<div class="line-item">${photo(0)}<div class="line-info"><div class="row between"><h3>Espresso dingin</h3><b class="small">Rp 23.000</b></div><p>Gula normal · Ditambahkan Anda</p><div class="line-bottom"><button class="textlink">Ubah pilihan</button>${stepper()}</div></div></div>`}
function aside(){return `<aside class="desktop-only cart-aside"><h2>Keranjang meja</h2><p>Meja A01 · Dilihat semua tamu</p>${line()}<button class="textlink">Tambah menu lain</button><div class="aside-sub"><div class="row between"><span>Subtotal · 1 item</span><b>Rp 23.000</b></div><p>Belum termasuk pajak dan service.</p><button class="primary">Lihat keranjang ${icon('chevron')}</button></div><p class="aside-foot">Bayar di muka. Pesanan masuk dapur setelah pembayaran diterima.</p></aside>`}
function menu(){return `${header()}<div class="desktop-shell">${isB?'<aside class="desktop-only menu-index"><h3>Jelajahi menu</h3><button class="active">Semua '+icon('chevron')+'</button><button>Kopi</button><button>Makanan</button><button>Minuman lainnya</button><button>'+icon('filter')+' Filter menu</button><p>Cari selalu menjangkau seluruh menu cafe.</p></aside>':''}<main>${context()}<div class="desktop-only desktop-heading"><div><h1>${isB?'Mau pesan apa?':'Menu untuk meja Anda'}</h1><p>${isB?'Pilih menu, atur selera, lalu bayar.':'Kopi dan makanan, langsung dari meja.'}</p></div>${search()}</div>${isB?'<div class="mobile-only menu-heading"><h1>Mau pesan apa?</h1><span class="small muted">Menu</span></div>':''}<div class="mobile-only">${search()}</div>${categories()}<p class="tax-note">Harga belum termasuk pajak dan service.</p><div class="menu-content"><div class="grid">${items.map((_,i)=>card(i)).join('')}</div><div class="footline"><span>Bayar di muka</span><button class="textlink">Pesanan meja</button></div></div></main>${aside()}</div><button class="floating"><span><small>1 item · Subtotal</small><div class="cartprice">Rp 23.000</div></span><strong class="row">Lihat keranjang ${icon('chevron')}</strong></button>`}
function backbar(title,back='back'){return `<div class="backbar"><button class="iconbtn" aria-label="Kembali ke menu">${icon(back)}</button><strong>${title}</strong><span style="width:44px"></span></div>`}
function detail(){let intro=`<div class="detail-copy"><div class="row between"><h1>Espresso dingin</h1>${isB?'':'<div class="price">Rp 23.000</div>'}</div>${isB?'<div class="price">Rp 23.000</div>':''}<p>Espresso pekat dengan es. Atur manisnya sesuai selera Anda.</p></div>`;return `${backbar('Pilihan menu','close')}${isB?`<div class="detail-intro">${photo(0,'detail-photo')}${intro}</div>`:`${photo(0,'detail-photo')}${intro}`}<div class="option-area"><div class="option-group"><div class="row between"><h3>Suhu</h3><span class="rule">Wajib · Pilih 1</span></div><div class="choices"><button class="choice selected"><span class="radio on"></span>Dingin</button><button class="choice"><span class="radio"></span>Panas</button></div></div><div class="error-group"><div class="row between"><h3>Tingkat gula</h3><span class="small muted">Wajib · Pilih 1</span></div><div class="choices"><button class="choice"><span class="radio"></span>Normal</button><button class="choice"><span class="radio"></span>Tanpa gula</button></div><p class="error-copy">${icon('alert')} Pilih tingkat gula sebelum menambahkan.</p></div><div class="option-group"><div class="row between"><h3>Tambahan</h3><span class="rule">Opsional</span></div><div class="option-row"><span class="row"><span class="radio check"></span>Ekstra espresso</span><span class="small muted">+ Rp 5.000</span></div></div><div class="option-group" style="border:0;margin-top:12px;padding:0"><h3>Catatan dapur <span class="small muted" style="font-weight:400">(opsional)</span></h3><div class="note-field">Contoh: es sedikit</div></div></div><footer class="fixed-bottom"><div class="detail-bottom">${stepper()}<button class="primary">Tambah · Rp 23.000</button></div></footer>`}
function bill(){return `<div class="bill"><div class="row between"><span>Subtotal menu</span><span>Rp 23.000</span></div><div class="row between"><span>Service 5%</span><span>Rp 1.150</span></div><div class="row between"><span>PBJT 10%</span><span>Rp 2.415</span></div><div class="row between"><span>Pembulatan</span><span>Rp 35</span></div></div>`}
function methods(){return `<h2 class="pay-title">Metode bayar</h2>${[['qr','QRIS','Scan dari aplikasi bank / e-wallet'],['wallet','E-wallet','Pilih aplikasi saat melanjutkan'],['store','Bayar di kasir','Tunjukkan kode ke kasir']].map((x,i)=>`<div class="payment-method ${i===0?'selected':''}"><span class="method-mark">${icon(x[0])}</span><div class="method-label">${x[1]}<small>${x[2]}</small></div><span class="radio ${i===0?'on':''}"></span></div>`).join('')}`}
function checkout(){return `${backbar('Keranjang & bayar')}<div class="checkout-title"><div><h1>Pesanan meja</h1><p>Meja A01 · Keranjang bersama</p></div>${isB?'<span class="pill">1 item</span>':''}</div><main class="checkout-content"><div class="eta">${icon('clock')}<span>Estimasi siap <b>10–16 menit</b></span></div>${line()}<div class="subtle-row"><button class="textlink">Tambah menu</button><button class="textlink">Kode promo / voucher</button><button class="textlink">Bagi tagihan</button></div>${bill()}${methods()}<p class="pay-note">Pesanan masuk dapur setelah pembayaran diterima.</p></main><footer class="fixed-bottom"><div class="total-line"><span>Total pembayaran</span><b>Rp 26.600</b></div><button class="primary full">Bayar Rp 26.600 dengan QRIS ${icon('chevron')}</button></footer>`}
function receipt(){return `<div class="receipt"><div class="row between" style="margin-top:0"><span class="label">Total dibayar</span><span class="pill">QRIS</span></div><div class="bigprice">Rp 26.600</div><div class="divider"></div><div class="row between"><span class="muted">Pesanan</span><span>QR-0044</span></div><div class="row between"><span class="muted">Meja</span><span>A01 · 2 tamu</span></div><div class="row between"><span>1× Espresso dingin</span><span>Rp 23.000</span></div><p class="label" style="margin-top:6px">Gula normal · Total termasuk pajak dan service.</p></div>`}
function success(){return `${backbar('Cafe Legend')}<main class="success-body"><div class="success-icon">${icon('check')}</div><h1>Pembayaran berhasil</h1><p>Terima kasih. Pesanan Anda sudah diterima dapur.</p>${receipt()}<div class="success-eta">${icon('clock')}<div><b>Estimasi siap 10–16 menit</b><p>Ikuti perkembangannya di status pesanan.</p></div></div><button class="primary">Lihat status pesanan ${icon('chevron')}</button><button class="textlink">Lihat struk</button><div class="member" style="margin-top:20px"><b>Pesan sebagai tamu? Tetap dapat poin.</b><p class="muted" style="margin-top:4px">Masuk untuk klaim poin dari pesanan ini.</p><button>Masuk dan klaim poin</button></div></main>`}
function cashier(){return `${backbar('Bayar di kasir')}<main class="success-body"><span class="waiting">${icon('clock')} Menunggu pembayaran</span><h1 style="margin-top:16px">Tunjukkan kode ini ke kasir</h1><p>Pesanan tersimpan. Pembayaran Anda belum diterima.</p><div class="receipt"><div class="row between" style="margin-top:0"><b>Cafe Legend</b><span class="small muted">Meja A01</span></div><div class="cashier-code">LG–0044</div><div class="row between" style="border-top:1px dashed #8a857d;padding-top:12px"><span>Total pembayaran</span><b style="font-size:21px">Rp 26.600</b></div><p class="label" style="margin-top:8px">1× Espresso dingin · Termasuk pajak dan service</p></div><div class="cashier-steps"><div class="cashier-step"><span class="step-num">1</span><div><b>Datangi kasir dan tunjukkan kode</b><p>Kasir akan membuka rincian pesanan meja Anda.</p></div></div><div class="cashier-step"><span class="step-num">2</span><div><b>Bayar sesuai total</b><p>Pesanan masuk dapur setelah kasir menerima uang.</p></div></div><div class="cashier-step"><span class="step-num">3</span><div><b>Status akan diperbarui otomatis</b><p>Tetap buka halaman ini sampai pembayaran diterima.</p></div></div></div><button class="primary">Periksa pembayaran ${icon('chevron')}</button><button class="textlink">Panggil waiter</button></main>`}
document.getElementById('root').innerHTML=`<div class="app ${dir} ${screen}"><div class="status"><span>9.41</span><span class="row" style="gap:6px">${icon('signal')}${icon('battery')}</span></div>${({menu,detail,checkout,success,cashier}[screen]||menu)()}</div>`;
</script></html>
