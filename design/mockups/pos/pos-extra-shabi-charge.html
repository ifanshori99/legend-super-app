<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS · Tagih selisih penggantian</title><link rel="stylesheet" href="common.css"><script defer src="common.js"></script><style>
.charge-layout{display:grid;grid-template-columns:1fr 410px;gap:24px}.charge-layout .panel{min-height:500px}.line{display:flex;justify-content:space-between;gap:16px;margin:16px 0}.line>b,.line>strong:last-child{white-space:nowrap;flex-shrink:0}.price{font-size:32px;font-weight:700}.box{background:var(--soft);border-radius:8px;padding:20px;margin-top:24px}.box .line{margin:8px 0}.panel .notice{margin-top:24px}.controls{margin-top:24px;display:flex;gap:12px}.controls button{flex:1}.summary{display:flex;flex-direction:column}.summary .controls{margin-top:auto;padding-top:24px}.flow-label{margin-top:14px}.panel>p{margin-top:8px}.loading-dot{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;vertical-align:middle;margin-right:8px}
@media(max-width:600px){body{width:auto;height:auto;min-height:100vh;overflow:auto}.topbar{height:auto;min-height:64px;padding:12px 16px}.topbar .brand{display:block}.topbar .brand span{display:block;font-size:14px}.topbar .meta{gap:8px}.topbar .meta>span:not(.pill),.topbar .meta strong{display:none}.screen{height:auto;padding:16px}.page-heading{height:auto;margin-bottom:20px;display:block}.page-heading button{margin-top:12px;min-height:48px}.charge-layout{display:flex;flex-direction:column;gap:16px}.charge-layout .panel{min-height:0;padding:20px}.controls{flex-direction:column}.summary .controls{padding-top:0}.price{font-size:28px}}
</style></head><body><main id="screens"></main><script>
const detail=(status)=>`<div class="row"><h2>Penggantian menu</h2><span class="pill ${status==='success'?'success':'warning'}">${status==='success'?'✓ Lunas':'◷ Belum lunas'}</span></div><p class="muted small">Pesanan POS–0048 · Meja A12</p><div class="divider"></div><div class="line"><span>Menu tidak tersedia<br><small class="muted">Nasi ayam · 1 porsi</small></span><b>Rp 35.000</b></div><div class="line"><span>Menu pengganti<br><small class="muted">Nasi sapi · 1 porsi</small></span><b>Rp 45.000</b></div><div class="box"><div class="line"><strong>Selisih yang harus dibayar</strong><strong>Rp 10.000</strong></div></div><p class="small muted flow-label">Pelanggan memilih menu pengganti yang lebih mahal. Total pesanan awal tetap tercatat.</p>`;
const page=(id,status,body)=>`<section class="screen" data-screen="${id}"><div class="page-heading"><div><h1>Tagih selisih</h1><p>Periksa penggantian menu sebelum melanjutkan pembayaran.</p></div><button>← Kembali ke pesanan</button></div><div class="charge-layout"><div class="panel">${detail(status)}</div><aside class="panel summary"><div class="row"><h2>Penagihan selisih</h2><span class="pill ${status==='success'?'success':status==='error'?'danger':'warning'}">${status==='success'?'✓ Lunas':status==='error'?'× Belum berhasil':'◷ Belum lunas'}</span></div>${body}</aside></div></section>`;
const normal=`<p class="muted small">Penagihan ini dicatat sebagai pembayaran tunai, terpisah dari pesanan awal.</p><div class="box"><span>Selisih</span><div class="price">Rp 10.000</div></div><div class="notice"><strong>Terima tunai Rp 10.000</strong><p>Pastikan uang sudah diterima sebelum mencatat penagihan.</p></div><div class="controls"><button class="primary">Tagih selisih · Tunai Rp 10.000 →</button></div>`;
const loading=`<div class="box"><span>Selisih</span><div class="price">Rp 10.000</div></div><div class="notice info"><strong><span class="loading-dot"></span>Mencatat penagihan…</strong><p>Jangan ulangi tindakan sampai status diperbarui.</p></div><div class="controls"><button disabled>Memproses…</button></div>`;
const error=`<div class="box"><span>Selisih</span><div class="price">Rp 10.000</div></div><div class="notice danger"><strong>Status penagihan belum dapat dipastikan</strong><p>Periksa status terbaru sebelum mencoba lagi agar pembayaran tidak tercatat dua kali.</p></div><div class="controls"><button class="primary">Periksa status</button></div>`;
const success=`<div class="box"><span>Selisih dibayar</span><div class="price">Rp 10.000</div></div><div class="notice success"><strong>✓ Penagihan tercatat</strong><p>Tunai Rp 10.000 tercatat di shift aktif. Selisih penggantian menu sudah lunas.</p></div><div class="controls"><button class="primary">Kembali ke pesanan</button></div>`;
document.querySelector('#screens').innerHTML=[page('normal','normal',normal),page('loading','loading',loading),page('error','error',error),page('success','success',success)].join('');
</script></body></html>
