<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Legend POS — Koreksi dan struk</title><link rel="stylesheet" href="common.css"><script defer src="common.js"></script><style>
body{width:auto;height:auto;min-height:100vh;overflow:auto}.screen{height:auto;min-height:calc(100vh - 72px)}.layout{display:grid;grid-template-columns:350px minmax(0,1fr);gap:24px}.panel{min-width:0}.stacklines>*+*{margin-top:14px}.panel h2{margin-bottom:16px}.sub{font-size:16px;color:var(--hint);margin-top:6px}.field{margin-top:16px}select,textarea{width:100%}textarea{border:2px solid var(--edge);border-radius:8px;padding:12px}.footer-actions{flex-wrap:wrap}.receipt{max-width:470px;margin:auto;border:2px dashed var(--line);padding:20px;background:white}.receipt h2,.receipt .center{text-align:center}.receipt .row{margin:10px 0}.receipt .divider{margin:14px 0}.links{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:24px;font-size:15px}.links a{color:var(--primary)}.load{height:18px;background:var(--soft);border-radius:5px;margin:18px 0}.load.short{width:55%}.amount-medium{font-variant-numeric:tabular-nums}.notice{margin-top:16px}.screen.active{display:block}@media(max-width:700px){.topbar{height:auto;min-height:64px;padding:12px 16px}.topbar .brand span,.topbar .meta{display:none}.screen{padding:16px}.page-heading{height:auto;display:block;margin-bottom:20px}.page-heading .pill{margin-top:12px}.layout{display:flex;flex-direction:column;gap:16px}.panel{padding:20px}.footer-actions{display:flex;flex-direction:column-reverse;align-items:stretch}.footer-actions button{width:100%}.row{align-items:flex-start}.receipt{padding:16px}}
</style></head><body><div id="screens"></div><script>
const nav=`<nav class="links" aria-label="Kondisi mockup"><a href="?screen=diskon">Diskon</a><a href="?screen=void-sebelum">Void sebelum dapur</a><a href="?screen=void-sesudah">Void setelah dapur</a><a href="?screen=refund">Refund</a><a href="?screen=override">Persetujuan</a><a href="?screen=struk">Pratinjau struk</a><a href="?screen=kosong">Kosong</a><a href="?screen=error">Gagal</a><a href="?screen=loading">Memuat</a></nav>`;
const page=(id,title,sub,badge,left,right)=>`<section class="screen" data-screen="${id}" data-role="${id==='refund'?'Supervisor 01':'Kasir 01'}"><div class="page-heading"><div><h1>${title}</h1><p>${sub}</p></div>${badge?`<span class="pill warning">${badge}</span>`:''}</div><div class="layout"><aside class="panel">${left}</aside><main class="panel">${right}${nav}</main></div></section>`;
const summary=`<h2>Pesanan #POS-0249</h2><div class="stacklines"><div class="row"><span>Subtotal</span><strong>Rp200.000</strong></div><div class="row"><span>Diskon usulan</span><strong>−Rp20.000</strong></div><div class="row"><span>Pajak</span><strong>Rp18.000</strong></div><div class="divider"></div><div class="row"><strong>Total setelah diskon</strong><strong>Rp198.000</strong></div></div><p class="sub">Contoh perhitungan; belum diterapkan.</p>`;
const actions=`<div class="footer-actions"><button>Kembali</button><button class="primary">Minta persetujuan</button></div>`;
const diskon=`<h2>Diskon manual</h2><p class="sub">Diskon di atas ambang memerlukan persetujuan supervisor.</p><div class="field"><label for="amount">Nominal diskon</label><input id="amount" value="Rp20.000" readonly></div><div class="field"><label for="reason">Alasan</label><select id="reason"><option>Penyesuaian layanan</option></select></div><div class="notice"><strong>Menunggu persetujuan</strong><p>Tagihan belum berubah sebelum persetujuan sah.</p></div>${actions}`;
const voidLeft=`<h2>Pesanan #POS-0149</h2><div class="stacklines"><div class="row"><span>Subtotal sebelum void</span><strong>Rp150.000</strong></div><div class="row"><span>Item diajukan</span><strong>−Rp50.000</strong></div><div class="divider"></div><div class="row"><strong>Subtotal setelah void</strong><strong>Rp100.000</strong></div></div><p class="sub">Belum termasuk pajak atau biaya lain; item tetap pada tagihan sampai void disetujui.</p>`;
const voidRight=(after)=>`<h2>Void item</h2><div class="row"><div><strong>1 × Nasi ayam</strong><p class="sub">${after?'Sudah dikirim ke dapur':'Belum dikirim ke dapur'}</p></div><strong>Rp50.000</strong></div><div class="field"><label for="void-${after}">Alasan void</label><select id="void-${after}"><option>${after?'Item tidak tersedia':'Pelanggan mengubah pesanan'}</option></select></div><div class="notice"><strong>${after?'Item sudah masuk dapur':'Item belum masuk dapur'}</strong><p>${after?'Periksa status dapur sebelum persetujuan.':'Void memerlukan alasan dan persetujuan supervisor.'} Tagihan belum berubah.</p></div>${actions}`;
const refundLeft=`<h2>Transaksi asal</h2><div class="stacklines"><div class="row"><span>Struk</span><strong>POS01–000049</strong></div><div class="row"><span>Sudah dibayar · QRIS</span><strong>Rp198.000</strong></div><div class="row"><span>Refund sebelumnya</span><strong>Rp0</strong></div><div class="divider"></div><div class="row"><strong>Nominal tersedia</strong><strong>Rp198.000</strong></div></div>`;
const refundRight=`<h2>Ajukan refund manual</h2><div class="notice"><strong>Item gagal setelah dibayar</strong><p>Pelanggan menolak ganti menu dan kredit voucher. Refund manual dibuka supervisor dengan approval dan alasan tertulis.</p></div><div class="field"><label for="refund">Nominal refund</label><input id="refund" value="Rp50.000" readonly></div><div class="field"><label for="refund-reason">Alasan tertulis</label><textarea id="refund-reason" rows="2" readonly>Item tidak tersedia; pelanggan menolak penggantian dan voucher.</textarea></div><p class="sub">Dana belum dikembalikan. Nilai refund tidak melebihi pembayaran tersedia.</p>${actions}`;
const override=`<h2>Persetujuan supervisor</h2><div class="notice"><strong>Diskon Rp20.000 · Pesanan #POS-0249</strong><p>Pemohon: Kasir 01 · Alasan: Penyesuaian layanan</p></div><div class="field"><label for="supervisor">Supervisor penyetuju</label><select id="supervisor"><option>Supervisor 01</option></select><p class="sub">Penyetuju harus berbeda dari pemohon.</p></div><div class="field"><label for="pin">PIN supervisor</label><input id="pin" type="password" value="123456" readonly></div><p class="sub">Atau minta persetujuan dari ponsel supervisor. Pemohon, penyetuju, alasan, dan nilai dicatat.</p><div class="footer-actions"><button>Batal</button><button class="primary">Setujui diskon</button></div>`;
const receipt=`<h2>Pratinjau cetak</h2><div class="receipt"><div class="center"><strong>Cafe Legend</strong><p class="sub">Jl. Contoh No. 12, Jakarta · Data contoh</p><p class="sub">POS01–000049 · 11 Nov 2026, 14.32</p></div><div class="divider"></div><div class="row"><span>2 × Kopi susu</span><strong>Rp60.000</strong></div><div class="row"><span>2 × Nasi ayam</span><strong>Rp140.000</strong></div><div class="divider"></div><div class="row"><span>Subtotal</span><strong>Rp200.000</strong></div><div class="row"><span>Diskon</span><strong>−Rp20.000</strong></div><div class="row"><span>Pajak</span><strong>Rp18.000</strong></div><div class="row"><strong>Total</strong><strong>Rp198.000</strong></div><div class="divider"></div><div class="row"><span>QRIS</span><strong>Rp198.000</strong></div><p class="sub center">Struk lunas · Nomor tetap tercatat jika di-void</p></div><div class="footer-actions"><button>Kembali</button><button class="primary">Cetak struk</button></div>`;
const state=(title,desc,button)=>`<h2>${title}</h2><p class="sub">${desc}</p>${button?`<div class="footer-actions"><button class="primary">${button}</button></div>`:''}`;
document.querySelector('#screens').innerHTML=[page('diskon','Diskon pesanan','Pesanan #POS-0249 · Dine-in','! Perlu persetujuan',summary,diskon),page('void-sebelum','Void item','Pesanan #POS-0149 · Dine-in','! Perlu persetujuan',voidLeft,voidRight(false)),page('void-sesudah','Void item','Pesanan #POS-0149 · Dine-in','! Sudah ke dapur',voidLeft,voidRight(true)),page('refund','Refund manual','Struk POS01–000049','! Perlu persetujuan',refundLeft,refundRight),page('override','Persetujuan diskon','Pesanan #POS-0249','! Akses supervisor',summary,override),page('struk','Struk pesanan','Pesanan #POS-0249 · Lunas','',`<h2>Dokumen transaksi</h2><p>Periksa rincian sebelum mencetak.</p><div class="notice"><strong>Struk tersimpan</strong><p>Nomor struk tetap tercatat meskipun transaksi di-void.</p></div>`,receipt),page('kosong','Koreksi pesanan','Pilih transaksi untuk melanjutkan','',`<h2>Pesanan</h2><p class="sub">Belum ada pesanan dipilih.</p>`,state('Pilih pesanan terlebih dahulu','Cari pesanan untuk mengajukan diskon, void, atau refund.','Cari pesanan')),page('error','Koreksi pesanan','Data transaksi belum tersedia','',`<h2>Pesanan</h2><p class="sub">Status belum dapat dipastikan.</p>`,state('Data tidak dapat dimuat','Periksa koneksi lalu coba lagi. Tidak ada koreksi yang diterapkan.','Coba lagi')),page('loading','Koreksi pesanan','Memuat data transaksi…','',`<h2>Pesanan</h2><div class="load"></div><div class="load short"></div>`,`<div aria-busy="true"><h2>Memuat rincian…</h2><div class="load"></div><div class="load"></div><div class="load short"></div><p class="sub">Mohon tunggu.</p></div>`)].join('');
</script></body></html>
