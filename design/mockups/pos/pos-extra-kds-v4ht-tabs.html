<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KDS · Stasiun dapur</title><link rel="stylesheet" href="common.css"><style>
:root{--ink:#f3f1ee;--hint:#c1bbb2;--line:#615c55;--edge:#8b857c;--canvas:#0f0e0d;--shell:#181715;--card:#1b1a18;--soft:#2a2825;--primary:#5ec2cc}body{color:var(--ink);background:var(--canvas)}.topbar{border-color:var(--line)}.topbar .brand strong{font-size:21px}.mock{color:var(--hint);font-size:14px}.screen{padding:24px;height:728px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.head p{color:var(--hint);font-size:16px;margin-top:4px}.live{background:#193c2a;color:#b8e9cb}.tabs{display:flex;gap:4px;background:#161513;border:2px solid var(--line);border-radius:10px;padding:4px;width:max-content;max-width:100%}.tab{display:flex;align-items:center;gap:10px;min-height:60px;border:2px solid transparent;background:transparent;color:var(--ink);padding:10px 19px}.tab[aria-checked=true]{background:#393632;border-color:#aaa49a}.count{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:999px;background:#4b4741;color:#fff;font-size:16px;padding:0 7px;font-variant-numeric:tabular-nums}.tab[aria-checked=true] .count{background:#e6e3df;color:#181715}.board-head{display:flex;justify-content:space-between;align-items:end;margin:24px 0 16px}.board-head p{color:var(--hint);font-size:16px;margin-top:4px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.ticket{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}.ticket-head{display:flex;justify-content:space-between;align-items:center;padding:16px;background:#253e2e;border-bottom:2px solid var(--line)}.ticket-head.late{background:#a12b30;color:#fff}.ticket-head strong{font-size:21px}.timer{font-size:25px;font-weight:700}.ticket-body{padding:18px}.ticket-body p{margin:12px 0}.qty{display:inline-grid;place-items:center;background:#38342f;border-radius:6px;width:36px;height:36px;font-weight:700;margin-right:8px}.note{color:#f6d795;font-weight:700;font-size:16px;margin:4px 0 18px}.finish{width:100%;background:var(--soft);color:var(--ink);border-color:var(--edge)}.state{min-height:330px;display:flex;align-items:center;justify-content:center;text-align:center;border:2px solid var(--line);border-radius:12px;background:var(--card)}.state p{color:var(--hint);max-width:550px;margin:10px auto 18px}.retry{background:var(--soft);color:var(--ink);border-color:var(--edge)}.skeleton{height:18px;background:#514c45;border-radius:4px;margin:18px 0}.skeleton.short{width:60%}.loading-card{height:280px;padding:18px;border:2px solid var(--line);border-radius:12px;background:var(--card)}.caption{font-size:16px;color:var(--hint);margin-top:16px}button:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
</style></head><body><header class="topbar"><div class="brand"><strong>Legend / KDS</strong><span> Cafe Legend · Dapur</span></div><div class="meta"><span class="pill live">✓ Terhubung ke outlet</span><strong>14.32</strong><span class="mock">Contoh data · Mockup</span></div></header><main id="root"></main><script>
const state=new URLSearchParams(location.search).get('screen')||'normal';
const entries=[['Kopi',3],['Nonkopi',2],['Dapur panas',1],['Dapur dingin',0],['Pastry',0]];
const selected=state==='empty'?'Pastry':'Kopi';
const tabs=entries.map(([name,count])=>`<button class="tab" role="radio" aria-checked="${name===selected}" tabindex="${name===selected?0:-1}">${name}<span class="count" aria-label="${state==='loading'?'Jumlah sedang dimuat':state==='error'?'Jumlah tidak tersedia':count+' tiket'}">${state==='loading'||state==='error'?'–':count}</span></button>`).join('');
const ticket=(table,time,lines,note,late=false)=>`<article class="ticket"><div class="ticket-head ${late?'late':''}"><div><strong>${table}</strong><div class="small">${late?'Terlambat':'Dalam target'}</div></div><span class="timer">${time}</span></div><div class="ticket-body">${lines.map(x=>`<p><span class="qty">${x[0]}</span><strong>${x[1]}</strong></p>`).join('')}<div class="note">${note}</div><button class="finish">Selesai</button></div></article>`;
const content={normal:`<div class="cards">${ticket('Meja A12','04:18',[[2,'Es Kopi Susu'],[1,'Cappuccino']],'Catatan: gula sedikit')}${ticket('Meja B04','08:32',[[1,'Americano'],[1,'Latte']],'Catatan: tanpa es',true)}${ticket('Bawa pulang · 048','02:14',[[2,'Kopi Susu Panas']],'Catatan: susu oat')}</div>`,empty:`<div class="state"><div><h2>Belum ada tiket di Pastry</h2><p>Tiket untuk stasiun ini akan muncul di sini saat pesanan diteruskan.</p></div></div>`,error:`<div class="state"><div><h2>Tiket stasiun belum dapat dimuat</h2><p>Periksa koneksi ke jaringan outlet, lalu coba lagi. Jumlah tiket belum dapat dipastikan.</p><button class="retry" onclick="location.reload()">Coba lagi</button></div></div>`,loading:`<div class="cards" aria-label="Memuat tiket stasiun">${[1,2,3].map(()=>'<div class="loading-card"><div class="skeleton short"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton short"></div></div>').join('')}</div><p class="caption">Memuat tiket stasiun…</p>`};
document.querySelector('#root').innerHTML=`<section class="screen active"><div class="head"><div><h1>Stasiun dapur</h1><p>Pilih stasiun untuk melihat tiket yang perlu disiapkan.</p></div></div><div class="tabs" role="radiogroup" aria-label="Stasiun dapur">${tabs}</div><div class="board-head"><div><h2>${selected}</h2><p>${state==='error'?'Jumlah tiket tidak tersedia':state==='loading'?'Memuat jumlah tiket':state==='empty'?'Tidak ada tiket aktif':'3 tiket aktif'}</p></div></div>${content[state]||content.normal}</section>`;
</script></body></html>
