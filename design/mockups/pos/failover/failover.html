<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legend · Mode cloud saat server kasir mati (mockup F6a)</title>
<style>
@font-face{font-family:Jakarta;src:url('../../assets/plus-jakarta-sans-latin.woff2');font-weight:200 800;font-display:swap}
*{box-sizing:border-box}
/* Nilai token: tokens.css, light + data-density="kontras". */
:root{--background:#fff;--foreground:#000;--card:#fff;--shell:#fbfaf9;--surface-2:#f7f6f4;--surface-3:#f1efec;--muted-foreground:#3d3a35;--border:#8a857d;--input:#3d3a35;--primary:#0f5e68;--success:#147a41;--success-subtle:#e4f5eb;--warning:#8f5800;--warning-subtle:#fcf1dc;--danger:#c02c31;--danger-subtle:#fdebeb;--info:#245bd1;--info-subtle:#e9f0fd;--scrim:rgb(28 27 25/.48)}
body{margin:0;background:var(--background);color:var(--foreground);font:18px/1.5 Jakarta,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3,p,ul,ol,dl,dd{margin:0;padding:0}ul,ol{list-style:none}
h1{font-size:26px;line-height:32px;letter-spacing:-.02em}
h2{font-size:21px;line-height:28px;letter-spacing:-.015em}
h3{font-size:18px;line-height:26px}
svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted-foreground)}.base{font-size:16px;line-height:24px}.strong{font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
header.ops{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;padding:8px 16px;background:var(--shell);border-bottom:2px solid var(--border)}
header.ops strong{display:block;font-size:21px;line-height:28px}
header.ops small{font-size:14px;line-height:20px;color:var(--muted-foreground)}
header.ops>div:first-child{min-width:0}header.ops small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.ops .right{display:flex;align-items:center;gap:12px;flex:none}
header.ops time{font-size:20px;font-weight:700}
main{padding:16px;display:grid;gap:16px;min-width:0;max-width:1280px;margin:0 auto}
.heading{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:60px;padding:8px 24px;border:2px solid var(--border);border-radius:8px;background:var(--card);color:var(--foreground);font:600 18px/24px Jakarta,sans-serif;text-decoration:none;text-align:center;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{min-height:64px;background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:#0b4b53}
.btn.danger{border-color:var(--danger);background:var(--danger);color:#fff}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.btn[aria-disabled=true]{background:var(--surface-3);color:var(--muted-foreground);border-color:var(--border);pointer-events:none}
.full{width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;width:fit-content;padding:4px 12px;border-radius:999px;background:var(--surface-3);color:var(--muted-foreground);font-size:16px;line-height:24px;font-weight:600;white-space:nowrap}
.pill svg{width:18px;height:18px}
.pill.success{background:var(--success-subtle);color:var(--success)}
.pill.warning{background:var(--warning-subtle);color:var(--warning)}
.pill.danger{background:var(--danger-subtle);color:var(--danger)}
.pill.info{background:var(--info-subtle);color:var(--info)}
.notice{border:2px solid;border-radius:8px;padding:12px 16px}
.notice b{display:flex;align-items:center;gap:8px;font-weight:600;line-height:24px}
.notice b svg{width:20px;height:20px}
.notice div{margin-top:4px;color:var(--foreground);font-size:16px;line-height:24px}
.notice .btn{margin-top:12px}
.notice.warning{color:var(--warning);background:var(--warning-subtle)}
.notice.info{color:var(--info);background:var(--info-subtle)}
.notice.success{color:var(--success);background:var(--success-subtle)}
.notice.danger{color:var(--danger);background:var(--danger-subtle)}
.notice.alert-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.notice.alert-row .btn{margin-top:0}
.panel{display:flex;flex-direction:column;gap:16px;padding:20px;border:2px solid var(--border);border-radius:12px;background:var(--card);min-width:0}
.panel>header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:16px;align-items:start}
.steps{display:grid;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:32px;height:32px;border:2px solid var(--border);border-radius:999px;background:var(--shell);font-size:16px;font-weight:700}
.lines{border-top:1px solid var(--border)}
.lines li{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.lines li>div{display:grid;gap:2px;min-width:0}.lines .amt{font-weight:600;white-space:nowrap}
.bill div{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.bill dd{font-weight:600;white-space:nowrap}
.bill .total{margin-top:8px;padding-top:12px;border-top:2px solid var(--border);font-size:20px;font-weight:600}
.actions{display:grid;gap:12px}
.field{display:grid;gap:8px}
.field label{font-weight:600}
.hint{font-size:14px;line-height:20px;color:var(--muted-foreground)}
.field .hint{font-size:14px;line-height:20px;color:var(--muted-foreground)}
.field .err{display:flex;align-items:center;gap:6px;font-size:16px;line-height:24px;color:var(--danger);font-weight:600}
.field .err svg{width:18px;height:18px}
input,select,textarea{width:100%;min-height:60px;padding:12px 16px;border:2px solid var(--input);border-radius:8px;background:var(--card);color:var(--foreground);font:600 18px/24px Jakarta,sans-serif;font-variant-numeric:tabular-nums}
textarea{min-height:88px;resize:none;font-weight:500}
input[aria-invalid=true]{border-color:var(--danger);background:var(--danger-subtle)}
dialog{width:calc(100% - 32px);max-width:512px;max-height:90dvh;padding:20px;border:1px solid var(--border);border-radius:18px;background:var(--card);color:inherit;box-shadow:0 16px 48px rgb(28 27 25/.22);overflow:auto}
dialog::backdrop{background:var(--scrim)}
dialog:focus{outline:none}
dialog .in{display:grid;gap:16px}
dialog .foot{display:flex;justify-content:flex-end;gap:12px}
.count{display:grid;gap:8px}
.count .r{display:grid;grid-template-columns:minmax(0,1fr) 112px 128px;gap:12px;align-items:center}
.count .r label{font-weight:600;white-space:nowrap}
.count .r .sub{text-align:right;font-weight:600;white-space:nowrap}
.count .r input{text-align:right}
.count .head{font-size:14px;line-height:20px;color:var(--muted-foreground);font-weight:600}
.count .head span:not(:first-child){text-align:right}
.count .sum{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;padding-top:16px;border-top:2px solid var(--border);font-size:20px;font-weight:600}
.count .sum b{font-size:30px;line-height:36px;letter-spacing:-.02em}
.chk{display:grid;gap:12px}
.chk li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:16px;border:2px solid var(--border);border-radius:12px}
.chk li>svg{width:28px;height:28px}
.chk li.ok>svg{color:var(--success)}.chk li.wait>svg{color:var(--danger)}.chk li.run>svg{color:var(--info)}
.chk h3{font-weight:700}
.nodes{display:grid;gap:12px}
.node{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 20px;border:2px solid var(--border);border-radius:12px}
.node .pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.qr{display:grid;justify-items:center;gap:12px;padding:16px;border:2px solid var(--border);border-radius:12px;background:#fff}
.qr svg{width:200px;height:200px;stroke:none;fill:#000}
.qr .no{font-size:20px;font-weight:700}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px}
.meta div{display:grid;gap:2px}.meta dt{font-size:14px;line-height:20px;color:var(--muted-foreground)}.meta dd{font-weight:600}
.foot-note{font-size:14px;line-height:20px;color:var(--muted-foreground);padding:0 16px 16px;max-width:1280px;margin:0 auto}
.foot-note a{color:var(--primary)}.foot-note a[aria-current]{font-weight:700;color:var(--foreground)}
.bar{display:none}
.dim{opacity:.55;pointer-events:none}
@media(max-width:767px){
 header.ops{min-height:56px;padding:4px 16px}header.ops time,header.ops .who{display:none}
 .two{grid-template-columns:minmax(0,1fr)}
 .heading .btn{width:100%}.heading>div:last-child:not(:first-child){width:100%}
 .notice.alert-row .btn{width:100%}
 .node{grid-template-columns:minmax(0,1fr)}.node .pills{justify-content:flex-start}.node .btn{width:100%}
 .meta{grid-template-columns:minmax(0,1fr)}
 .count .r{grid-template-columns:minmax(0,1fr) 96px 104px;gap:8px}
 .chk li{grid-template-columns:28px minmax(0,1fr)}.chk li .pill{grid-column:2}
 .bar{display:grid;position:sticky;bottom:0;margin:0 -16px -16px;padding:12px 16px;gap:12px;background:var(--card);border-top:2px solid var(--border)}
 .inline-act{display:none}
 dialog{position:fixed;inset:auto 0 0 0;width:100%;max-width:none;margin:0;border-radius:24px 24px 0 0}
 dialog .foot{flex-direction:column-reverse}
}
@media(prefers-contrast:more){.notice,.panel,.node,.chk li{border-color:#000}}
</style>
</head>
<!-- Catatan F6b (audit no. 7): tombol mati wajib punya alasan tertulis di dekatnya (sudah ditiru di mockup ini); layar Tutup hari perlu dialog konfirmasi sebelum menutup (belum digambar di F6a). -->
<body>
<div id="app"></div>
<p class="foot-note" id="note"></p>
<script>
// Mockup statis kartu F6a. Keadaan dipilih lewat ?screen=. Semua angka dan nama adalah contoh.
const screen = new URLSearchParams(location.search).get('screen') || 'banner';
const P = {
  cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9Z"/>',
  wifioff: '<path d="M12 20h.01M8.5 16.4a5 5 0 0 1 7 0M2 8.8a15 15 0 0 1 4.2-2.7M22 8.8a15 15 0 0 0-8-3.7M5 12.9a10 10 0 0 1 5-2.6M19 12.9a10 10 0 0 0-2-1.4M2 2l20 20"/>',
  wifi: '<path d="M12 20h.01M2 8.8a15 15 0 0 1 20 0M5 12.9a10 10 0 0 1 14 0M8.5 16.4a5 5 0 0 1 7 0"/>',
  warn: '<path d="m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3M12 9v4M12 17h.01"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  ok: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  x: '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>',
  back: '<path d="m12 19-7-7 7-7M19 12H5"/>',
  arrow: '<path d="M5 12h14M12 5l7 7-7 7"/>',
  print: '<path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  server: '<rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><path d="M6 7h.01M6 17h.01"/>',
  plus: '<path d="M5 12h14M12 5v14"/>',
};
const ic = (n) => `<svg viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const rp = (n) => 'Rp ' + n.toLocaleString('id-ID');
const pill = (tone, icon, text) => `<span class="pill ${tone}">${ic(icon)}${text}</span>`;
const notice = (tone, icon, title, body = '') => `<div class="notice ${tone}" role="${tone === 'danger' || tone === 'warning' ? 'alert' : 'status'}"><b>${ic(icon)}${title}</b>${body ? `<div>${body}</div>` : ''}</div>`;
const link = (to, text, cls = '') => `<a class="btn ${cls}" href="${to ? '?screen=' + to : '#'}">${text}</a>`;
const off = (text, cls = '') => `<a class="btn ${cls}" aria-disabled="true" role="link">${text}</a>`;

const terminalHeader = (status) => `<header class="ops"><div><strong>Kasir</strong><small>Cafe Legend Bandung · Contoh data</small></div><div class="right">${status}<time>14.32</time></div></header>`;
const officeHeader = () => `<header class="ops"><div><strong>Back office</strong><small>Cafe Legend Bandung · Contoh data</small></div><div class="right"><span class="who base muted">Rina · Manajer</span></div></header>`;
const sPill = {
  down: pill('danger', 'wifioff', 'Server kasir mati'),
  cloud: pill('info', 'cloud', 'Mode cloud'),
  ok: pill('success', 'wifi', 'Server kasir hidup'),
};

// ---------- Terminal ----------
function bannerView() {
  return `
  <div class="notice danger alert-row" role="alert"><div style="margin:0"><b>${ic('wifioff')}Server kasir di outlet mati sejak 14.31</b><div>Kasir belum bisa menjual. Penjualan sebelumnya tersimpan di server kasir.</div></div>
   ${link('pin', ic('cloud') + 'Pindah ke mode cloud', 'primary')}</div>
  <div class="heading"><div><h1>Penjualan dihentikan sementara</h1><p class="muted">Menunggu server kasir menyala lagi atau manajer memindahkan outlet ke mode cloud</p></div></div>
  <div class="two">
   <section class="panel"><header><h2>Bila pindah ke mode cloud</h2></header>
    <ol class="steps">
     <li><div><p class="strong">Manajer atau supervisor memasukkan PIN</p><p class="base muted">Hanya satu kali untuk seluruh outlet.</p></div></li>
     <li><div><p class="strong">Setiap kasir menghitung uang di laci</p><p class="base muted">Hasil hitungan jadi modal awal shift mode cloud.</p></div></li>
     <li><div><p class="strong">Penjualan jalan lewat internet</p><p class="base muted">Nomor struk berawalan F, misalnya F1-000001.</p></div></li>
    </ol></section>
   <section class="panel"><header><h2>Sambil menunggu</h2></header>
    <p class="base">Cek listrik dan kabel server kasir. Bila server kasir menyala lagi, kasir bisa menjual seperti biasa dan tidak perlu pindah.</p>
    <p class="base muted">Bila internet outlet juga mati, catat penjualan di buku dan masukkan nanti.</p></section>
  </div>`;
}
const reasons = ['Server kasir mati listrik', 'Server kasir rusak atau tidak bisa dibuka', 'Jaringan outlet bermasalah', 'Lainnya'];
// st: kosong (belum diisi), isi (siap), lainnya (Lainnya tanpa catatan), salah (PIN salah). office: tanpa PIN (sudah login).
function reasonFields(st, office) {
  const pinHtml = office ? '' : `<div class="field"><label for="pin">PIN manajer atau supervisor</label>
   <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" ${st === 'kosong' ? '' : 'value="••••"'} ${st === 'salah' ? 'aria-invalid="true" aria-describedby="pin-e"' : ''}>
   ${st === 'salah' ? `<p class="err" id="pin-e" role="alert">${ic('warn')}PIN salah. Sisa 2 percobaan sebelum terkunci 5 menit.</p>` : ''}</div>`;
  const pick = st === 'kosong' ? -1 : st === 'lainnya' ? 3 : 0;
  const bad = st === 'lainnya';
  return `${pinHtml}
  <div class="field"><label for="why">Alasan pindah (wajib)</label><select id="why" required><option value="" disabled ${pick < 0 ? 'selected' : ''}>Pilih alasan</option>${reasons.map((r, i) => `<option ${i === pick ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
  <div class="field"><label for="memo">Catatan${bad ? ' (wajib)' : ' (wajib bila alasan Lainnya)'}</label><textarea id="memo" ${bad ? 'aria-invalid="true" aria-describedby="memo-e"' : ''} placeholder="Contoh: listrik padam sejak 14.30"></textarea>
   ${bad ? `<p class="err" id="memo-e" role="alert">${ic('warn')}Tulis catatan singkat bila alasannya Lainnya.</p>` : '<p class="hint">Alasan dan nama penanggung jawab tercatat di riwayat outlet.</p>'}</div>`;
}
function pinDialog(st, office) {
  const ready = st === 'isi' || st === 'salah';
  const cancel = link(office ? 'bo-edge' : 'banner', 'Batal');
  const go = ready ? link(office ? 'bo-aktif' : 'hitung-laci', ic('cloud') + 'Pindah ke mode cloud', 'primary') : off(ic('cloud') + 'Pindah ke mode cloud');
  const hint = ready ? '' : `<p class="hint" id="why-h">${st === 'lainnya' ? 'Tulis catatan dulu.' : office ? 'Pilih alasan dulu.' : 'Isi PIN dan pilih alasan dulu.'}</p>`;
  return `<dialog id="dlg" aria-labelledby="dt" aria-describedby="dd"><div class="in">
   <div><h2 id="dt">Pindah ke mode cloud?</h2><p id="dd" class="base muted">Server kasir di outlet baru mati sekitar 1 menit. Pindah sekarang hanya bila Anda yakin server itu tidak bisa dipakai. Selama mode cloud, server kasir tidak menerima penjualan.${office ? ' Semua kasir di outlet akan diminta menghitung laci.' : ''}</p></div>
   ${reasonFields(st, office)}
   ${hint}
   <div class="foot">${cancel}${go}</div></div></dialog>`;
}
function noNetDialog() {
  return `<dialog id="dlg" aria-labelledby="dt" aria-describedby="dd"><div class="in">
   ${notice('danger', 'wifioff', 'Mode cloud belum bisa dibuka')}
   <div><h2 id="dt">Internet outlet juga tidak tersambung</h2><p id="dd" class="base muted">Cloud tidak terjangkau dari kasir ini, jadi penjualan belum bisa pindah. Penjualan belum diubah.</p></div>
   <ol class="steps"><li><p class="base">Catat penjualan di buku, lengkap dengan jam dan cara bayar.</p></li><li><p class="base">Cek router atau paket data, lalu coba lagi.</p></li></ol>
   <div class="foot">${link('banner', 'Tutup')}${link('pin', ic('arrow') + 'Coba lagi', 'primary')}</div></div></dialog>`;
}

const denoms = [[100000, 5], [50000, 8], [20000, 10], [10000, 12], [5000, 10], [2000, 15], [1000, 20]];
const coins = 25000;
// st: kosong (isian kosong, tombol mati), isi (siap diperiksa), konfirmasi (dialog "sudah benar?").
function countView(st) {
  const filled = st !== 'kosong';
  const total = filled ? denoms.reduce((a, [d, n]) => a + d * n, 0) + coins : 0;
  const rows = denoms.map(([d, n]) => `<div class="r"><label for="d${d}">${rp(d)}</label><input id="d${d}" inputmode="numeric" autocomplete="off" placeholder="0" value="${filled ? n : ''}" aria-describedby="u"><span class="sub">${rp(filled ? d * n : 0)}</span></div>`).join('');
  const btn = filled ? link('hitung-laci-konfirmasi', ic('cloud') + 'Periksa total', 'primary full') : off(ic('cloud') + 'Periksa total', 'full');
  const hint = filled ? '' : '<p class="base muted">Isi jumlah lembar minimal satu pecahan dulu.</p>';
  return `<div class="notice info" role="status"><b>${ic('cloud')}Mode cloud aktif sejak 14.35</b><div>Dibuka oleh Rina (Manajer). Alasan: Server kasir mati listrik.</div></div>
  <div class="heading"><div><h1>Hitung uang di laci</h1><p class="muted">Kasir 1 · Dewi · Kasir utama</p></div></div>
  <div class="two">
   <section class="panel"><header><h2>Jumlah lembar</h2>${pill('warning', 'lock', 'Hitung tanpa melihat saldo')}</header>
    <p class="base muted" id="u">Isi jumlah lembar tiap pecahan. Sistem tidak menampilkan saldo yang seharusnya, supaya hitungan jujur.</p>
    <div class="count"><div class="r head"><span>Pecahan</span><span>Lembar</span><span>Jumlah</span></div>${rows}
     <div class="r"><label for="coin">Koin (Rp)</label><input id="coin" inputmode="numeric" autocomplete="off" placeholder="0" value="${filled ? coins.toLocaleString('id-ID') : ''}"><span class="sub">${rp(filled ? coins : 0)}</span></div>
     <div class="sum"><span>Total laci</span><b>${rp(total)}</b></div></div></section>
   <section class="panel"><header><h2>Setelah ini</h2></header>
    <p class="base">${filled ? `Total ${rp(total)} akan jadi modal awal shift mode cloud Dewi. Anda diminta memeriksanya dulu.` : 'Total laci akan jadi modal awal shift mode cloud Dewi. Anda diminta memeriksanya dulu sebelum shift dibuka.'} Shift lama yang terputus ditutup dengan hitungan yang sama.</p>
    <p class="base muted">Satu kasir, satu laci, satu hitungan. Kasir lain menghitung laci masing-masing di terminalnya.</p>
    <div class="actions inline-act">${btn}${hint}</div></section>
  </div>
  <div class="bar">${btn}${hint}</div>`;
}
function countConfirm() {
  const total = denoms.reduce((a, [d, n]) => a + d * n, 0) + coins;
  return `<dialog id="dlg" aria-labelledby="dt" aria-describedby="dd"><div class="in">
   <div><h2 id="dt">Total ${rp(total)} sudah benar?</h2><p id="dd" class="base muted">Angka ini jadi modal awal shift mode cloud Dewi. Bila ragu, hitung ulang sekarang.</p></div>
   <div class="foot">${link('hitung-laci-isi', 'Hitung ulang')}${link('kasir-cloud', ic('cloud') + 'Ya, buka shift', 'primary')}</div></div></dialog>`;
}

function qrSvg() {
  const n = 25, cells = [];
  let seed = 20261126;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const finder = (x, y) => {
    if (x < 8 && y < 8 || x > n - 9 && y < 8 || x < 8 && y > n - 9) {
      const lx = x > n - 9 ? x - (n - 7) : x, ly = y > n - 9 ? y - (n - 7) : y;
      if (lx < 0 || ly < 0 || lx > 6 || ly > 6) return 0;
      return (lx === 0 || lx === 6 || ly === 0 || ly === 6 || (lx > 1 && lx < 5 && ly > 1 && ly < 5)) ? 1 : 0;
    }
    return null;
  };
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const f = finder(x, y);
    if ((f === null ? rnd() > 0.5 : f)) cells.push(`<rect x="${x + 1}" y="${y + 1}" width="1" height="1"/>`);
  }
  return `<svg viewBox="0 0 ${n + 2} ${n + 2}" role="img" aria-label="Kode QR struk F1-000001 (contoh)" shape-rendering="crispEdges">${cells.join('')}</svg>`;
}
