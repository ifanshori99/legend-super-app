<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Legend POS — Layar pelanggan</title><link rel="stylesheet" href="common.css"><style>
body{width:auto;height:auto;min-height:100vh;overflow:auto}.customer-bar{min-height:72px;background:var(--shell);border-bottom:2px solid var(--line);padding:18px 32px;display:flex;justify-content:space-between;gap:12px;align-items:center}.customer-bar strong{font-size:21px}.screen{height:auto;max-width:1200px;margin:auto;padding:24px 32px}.customer-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.customer-grid>.panel{min-height:550px}.bill-row{display:flex;justify-content:space-between;gap:20px;margin:16px 0}.bill-row strong{white-space:nowrap}.balance{padding:20px;background:var(--soft);border-radius:8px;margin-top:20px}.payment{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}.payment p{max-width:420px}.qr-placeholder{height:220px;width:220px;border:2px dashed var(--edge);background:var(--soft);display:grid;place-items:center;padding:24px;color:var(--hint);font-size:16px;font-weight:700}.payment .notice{text-align:left;width:100%;max-width:430px}.placeholder{background:var(--soft);height:22px;border-radius:4px;margin:16px 0}.placeholder.short{width:60%}.screen h1{margin-bottom:8px}.lead{margin-bottom:20px}.screen .muted{font-size:16px}.sample{font-size:14px;color:var(--hint)}@media(max-width:700px){.customer-bar{padding:16px;min-height:64px}.customer-bar strong{font-size:18px}.screen{padding:20px 16px}.customer-grid{grid-template-columns:1fr;gap:16px}.customer-grid>.panel{min-height:0;padding:20px}.payment{padding:24px 20px!important}.amount{font-size:34px}.qr-placeholder{width:200px;height:200px}}
</style></head><body><header class="customer-bar"><strong>Legend · Cafe Legend</strong><span class="sample">Contoh data · Mockup</span></header><main id="screens"></main><script>
const summary=(paid=false,unknown=false)=>`<div class="panel"><h2>Ringkasan pesanan</h2><p class="muted">Meja A12 · Pesanan POS–0048</p><div class="divider"></div><div class="bill-row"><span>Subtotal · 6 item</span><strong>Rp 220.000</strong></div><div class="bill-row"><span>Service</span><strong>Rp 8.000</strong></div><div class="bill-row"><span>Pajak</span><strong>Rp 20.000</strong></div><div class="bill-row"><strong>Total tagihan</strong><strong>Rp 248.000</strong></div><div class="bill-row"><span>DP reservasi terpakai</span><strong>−Rp 100.000</strong></div>${paid?'<div class="bill-row"><span>QRIS terkonfirmasi</span><strong>−Rp 148.000</strong></div>':''}<div class="balance"><span>${paid?'Sisa bayar':unknown?'Jumlah sebelum pemeriksaan':'Sisa yang harus dibayar'}</span><div class="amount">Rp ${paid?'0':'148.000'}</div></div></div>`;
const active=`<div class="panel payment"><span class="pill warning">◷ Menunggu pembayaran</span><h2>Bayar dengan QRIS</h2><p>Pindai kode di layar dengan aplikasi bank atau dompet digital Anda.</p><div class="qr-placeholder" role="img" aria-label="Tempat kode QRIS. Ilustrasi mockup, bukan kode pembayaran.">Area QRIS<br>Ilustrasi mockup<br>Bukan kode pembayaran</div><strong>Rp 148.000</strong><span class="pill">◷ Berlaku 08:42 lagi</span><p class="muted">Tunggu hingga pembayaran terkonfirmasi.</p></div>`;
const loading=`<div class="panel payment"><span class="pill">◷ Memuat QRIS</span><h2>Menyiapkan kode pembayaran</h2><p>Mohon tunggu. Kode akan muncul di layar ini.</p><div class="qr-placeholder" aria-label="Kode QRIS sedang dimuat">Memuat kode…</div><strong>Rp 148.000</strong></div>`;
const error=`<div class="panel payment"><span class="pill danger">× Kode tidak tersedia</span><h2>QRIS belum dapat ditampilkan</h2><p>Mohon beri tahu kasir untuk memeriksa status pembayaran dan membantu Anda melanjutkan.</p><div class="notice"><strong>Status pembayaran belum dapat dipastikan</strong><p>Jangan pindai kode sebelumnya. Kasir akan memeriksa statusnya.</p></div><strong>Rp 148.000</strong></div>`;
const expired=`<div class="panel payment"><span class="pill warning">◷ Kedaluwarsa</span><h2>Kode QRIS kedaluwarsa</h2><p>Jangan gunakan kode sebelumnya. Mohon tunggu kasir memeriksa status sebelum menyiapkan kode baru.</p><div class="notice"><strong>Status pembayaran belum dapat dipastikan</strong><p>Status pembayaran sebelumnya sedang diperiksa.</p></div><strong>Rp 148.000</strong></div>`;
const success=`<div class="panel payment"><span class="pill success">✓ Pembayaran terkonfirmasi</span><h2>Terima kasih</h2><p>Pembayaran QRIS telah diterima. Pesanan Anda sudah lunas.</p><div class="amount">Rp 148.000</div><p class="muted">DP Rp 100.000 + QRIS Rp 148.000 = total Rp 248.000.</p></div>`;
const empty=`<div class="panel payment"><h2>Selamat datang</h2><p>Rincian pesanan dan pembayaran Anda akan muncul di sini.</p></div>`;
const page=(id,title,body,showBill=true)=>`<section class="screen" data-screen="${id}"><h1>${title}</h1><p class="muted lead">Layar pelanggan · Cafe Legend</p><div class="customer-grid">${showBill?summary(id==='success',id==='error'||id==='expired'):'<div class="panel"><h2>Ringkasan pesanan</h2><div class="divider"></div><p class="muted">Belum ada pesanan untuk ditampilkan.</p></div>'}${body}</div></section>`;
document.querySelector('#screens').innerHTML=[page('normal','Pembayaran pesanan',active),page('loading','Pembayaran pesanan',loading),page('error','Pembayaran pesanan',error),page('expired','Pembayaran pesanan',expired),page('success','Pembayaran pesanan',success),page('empty','Selamat datang',empty,false)].join('');
const requested=new URLSearchParams(location.search).get('screen');(document.querySelector(`[data-screen="${requested}"]`)||document.querySelector('.screen')).classList.add('active');
</script></body></html>
