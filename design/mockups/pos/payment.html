<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>POS · Pembayaran kasir</title><link rel="stylesheet" href="common.css"><script src="common.js" defer></script><style>
.payment-layout{height:616px}.payment-layout>.panel{height:616px}.bill-paid .bill-line{margin:4px 0}.bill-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.bill-line{display:flex;justify-content:space-between;gap:16px;margin:6px 0}.bill-items{font-size:16px;line-height:1.3}.bill-items .bill-line{margin:8px 0}.payment-layout>aside .divider{margin:14px 0}.payment-layout>aside .bill-remaining{margin-top:14px;padding:16px}.payment-layout>aside .bill-top{margin-bottom:8px}.bill-remaining{margin-top:20px;padding:20px;background:var(--soft);border-radius:8px}.method-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.method{min-height:100px;display:flex;align-items:center;justify-content:flex-start;gap:16px;text-align:left;padding:14px 18px}.method b{display:block}.method small{display:block;font-size:15px;font-weight:400;color:var(--hint);margin-top:4px}.method .glyph{font-size:25px;font-weight:400;width:32px;text-align:center}.payment-panel{display:flex;flex-direction:column}.payment-panel .footer-actions{margin-top:auto;padding-top:16px}.tender-card{border:2px solid var(--line);border-radius:8px;padding:16px}.tender-card .row+.row{margin-top:8px}.cash-input{font-size:30px;height:68px}.keypad{margin-top:12px;gap:8px}.keypad button{height:56px;min-height:56px;padding:4px}.quick{display:flex;gap:8px;margin-top:12px}.quick button{min-height:56px;padding:8px 12px;font-size:16px;flex:1}.state-center{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:0 20px;min-height:0}.state-mark{width:64px;height:64px;flex-shrink:0;border:3px solid var(--line);display:grid;place-items:center;border-radius:50%;font-size:36px;font-weight:700;margin-bottom:12px}.state-mark.fail{color:var(--danger);border-color:var(--danger);background:var(--danger-bg)}.state-mark.ok{color:var(--success);border-color:var(--success);background:var(--success-bg)}.state-center h2{font-size:26px;line-height:1.3;margin-bottom:8px}.state-center p{max-width:640px;color:var(--hint);margin-bottom:12px}.state-center .amount{font-size:36px;margin-bottom:16px}.state-center .notice{width:100%;text-align:left}.state-center .notice p{margin-bottom:0}.qr-expired{width:126px;height:126px;border:2px dashed var(--line);background:var(--soft);display:grid;place-items:center;position:relative;margin:0 auto 16px;color:var(--hint);font-size:16px;font-weight:700;line-height:1.5}.qr-expired:before{content:'';position:absolute;width:150px;height:3px;background:var(--line);transform:rotate(-45deg)}.progress-label{font-weight:700;display:flex;align-items:center;gap:12px;justify-content:center;margin-top:16px}.progress-label span{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%}.balance-table{width:100%;margin:20px 0}.balance-table .bill-line{margin:14px 0}.success-breakdown{width:100%;background:var(--soft);border-radius:8px;padding:16px 20px}.success-breakdown .bill-line{margin:8px 0}
</style></head><body><main id="screens"></main><script>
const bill=(split=false,paid=false)=>`<aside class="panel ${paid?'bill-paid':''}"><div class="bill-top"><h2>Meja A12</h2><span class="pill ${paid?'success':'warning'}">${paid?'✓ Lunas':'◷ Belum lunas'}</span></div><p class="muted small">Pesanan POS–0048 · 6 item · 2 tamu</p><div class="divider"></div><div class="bill-line small"><span>Subtotal</span><span>Rp 220.000</span></div><div class="bill-line small"><span>Service</span><span>Rp 8.000</span></div><div class="bill-line small"><span>Pajak</span><span>Rp 20.000</span></div><div class="bill-line"><strong>Total tagihan</strong><strong>Rp 248.000</strong></div><div class="bill-line"><span>DP reservasi terpakai</span><b>−Rp 100.000</b></div><p class="small muted">✓ DP lunas · RSV–0018</p>${split||paid?'<div class="bill-line"><span>QRIS terkonfirmasi</span><b>−Rp 100.000</b></div>':''}${paid?'<div class="bill-line"><span>Tunai tercatat</span><b>−Rp 48.000</b></div>':''}<div class="bill-remaining"><p class="small muted">${paid?'Sisa bayar':'Sisa yang harus dibayar'}</p><div class="amount-medium">Rp ${paid?'0':split?'48.000':'148.000'}</div></div></aside>`;
const page=(id,title,desc,content,{split=false,paid=false}={})=>`<section class="screen" data-screen="${id}"><div class="page-heading"><div><h1>${title}</h1><p>${desc}</p></div><button>← Kembali ke pesanan</button></div><div class="cols payment-layout">${bill(split,paid)}<div class="panel payment-panel">${content}</div></div></section>`;
const methods=`<div class="row"><h2>Pilih metode pembayaran</h2><span class="pill">1 pembayaran</span></div><p class="muted small" style="margin-top:8px">Semua metode dapat dipakai untuk pembayaran gabungan.</p><div class="method-grid"><button class="method"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="6" height="6"/><rect x="15" y="3" width="6" height="6"/><rect x="3" y="15" width="6" height="6"/><path d="M15 15h3v3h3v3h-6v-3"/></svg><span><b>QRIS</b><small>QR di customer display</small></span></button><button class="method"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-6 9 6M3 21h18M5 10v7m7-7v7m7-7v7"/></svg><span><b>Virtual Account</b><small>Pilih bank yang tersedia</small></span></button><button class="method"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 8V5H5a2 2 0 0 0 0 4h15v11H5a2 2 0 0 1-2-2V7"/><path d="M20 12h-5v4h5M17 14h.01"/></svg><span><b>E-wallet</b><small>Pilih dompet digital</small></span></button><button class="method"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 10h20M6 15h3"/></svg><span><b>Kartu kredit/debit</b><small>Pembayaran online</small></span></button><button class="method selected"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/></svg><span><b>Tunai <span aria-hidden="true">✓</span></b><small>Hitung uang dan kembalian</small></span></button><button class="method"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M9 6h6v4H9zM9 14h.01M12 14h.01M15 14h.01M9 18h.01M12 18h.01M15 18h.01"/></svg><span><b>EDC</b><small>Kartu atau QRIS di mesin</small></span></button></div><div class="footer-actions"><button>Bayar sebagian</button><button class="primary">Lanjutkan dengan Tunai →</button></div>`;
const split=`<div class="row"><h2>Pembayaran gabungan</h2><span class="pill">2 metode</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px"><div class="stack"><div class="tender-card"><div class="row"><strong>DP reservasi</strong><span class="pill success">✓ Terpakai</span></div><div class="row"><span>RSV–0018</span><b>Rp 100.000</b></div></div><div class="tender-card"><div class="row"><strong>QRIS</strong><span class="pill success">✓ Lunas</span></div><div class="row"><span>Pembayaran 01</span><b>Rp 100.000</b></div><p class="small muted" style="margin-top:8px">Dikonfirmasi pukul 14.31</p></div><div class="notice"><strong>Masih kurang Rp 48.000</strong><p>Pesanan lunas setelah seluruh sisa pembayaran diterima.</p></div></div><div><label for="cash-split">Pembayaran 02 · Tunai</label><input id="cash-split" class="cash-input" value="Rp 48.000" inputmode="numeric"><div class="keypad">${['1','2','3','4','5','6','7','8','9','000','0','⌫'].map(x=>`<button>${x}</button>`).join('')}</div><p class="small muted" style="margin-top:12px">Nominal yang dialokasikan ke tagihan.</p></div></div><div class="footer-actions"><button>Ganti metode</button><button class="primary">Terima tunai Rp 48.000 →</button></div>`;
const cash=`<div class="row"><h2>Terima pembayaran tunai</h2><span class="pill">Pembayaran 02</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px"><div><label for="cash-in">Uang diterima</label><input id="cash-in" class="cash-input" value="Rp 50.000" inputmode="numeric"><div class="quick"><button>Uang pas</button><button>Rp 50.000</button></div><div class="keypad">${['1','2','3','4','5','6','7','8','9','000','0','⌫'].map(x=>`<button>${x}</button>`).join('')}</div></div><div class="stack"><div class="tender-card"><p class="muted">Sisa tagihan</p><div class="amount-medium">Rp 48.000</div></div><div class="tender-card" style="background:var(--soft)"><p>Kembalian pelanggan</p><div class="amount">Rp 2.000</div></div><p class="small muted">Tunai Rp 48.000 dicatat ke shift aktif. Serahkan kembalian sebelum menyelesaikan transaksi.</p></div></div><div class="footer-actions"><button>Ubah nominal pembayaran</button><button class="primary">Konfirmasi terima tunai →</button></div>`;
const expired=`<div class="row"><h2>QRIS · Customer display</h2><span class="pill warning">◷ Kedaluwarsa</span></div><div class="state-center"><h2>QRIS kedaluwarsa</h2><p>Pelanggan belum menyelesaikan pembayaran.<br>Jangan gunakan kode QR sebelumnya.</p><div class="amount">Rp 148.000</div><div class="notice"><strong>Tagihan belum lunas</strong><p>QRIS baru akan muncul setelah status pembayaran lama diperiksa.</p></div><div class="progress-label"><span></span>Memeriksa status dan memperbarui QRIS…</div></div><div class="footer-actions"><button class="primary">Pilih metode lain</button></div>`;
const failed=`<div class="row"><h2>QRIS · Pembayaran 01</h2><span class="pill danger">× Gagal</span></div><div class="state-center"><div class="state-mark fail">×</div><h2>Pembayaran gagal</h2><p>Penyedia pembayaran mengonfirmasi pembayaran gagal. Tagihan belum lunas dan pesanan tetap tersimpan.</p><div class="amount">Rp 148.000</div><div class="notice danger"><strong>QRIS ini belum menerima pembayaran</strong><p>DP Rp 100.000 tetap terpakai. Lanjutkan dengan metode lain atau buat QRIS baru.</p></div></div><div class="footer-actions"><button>Coba QRIS lagi</button><button class="primary">Pilih metode lain →</button></div>`;
const qrisActive=`<div class="row"><h2>QRIS · Customer display</h2><span class="pill warning">◷ Menunggu</span></div><div class="state-center"><h2>QRIS siap dipindai</h2><p>QRIS Cafe Legend sudah tampil di layar pelanggan.<br>Minta pelanggan memindai dan menyelesaikan pembayaran.</p><div class="amount">Rp 148.000</div><span class="pill">◷ Berlaku 08:42 lagi</span><div class="notice info" style="margin-top:24px"><strong>Menunggu konfirmasi pembayaran</strong><p>Tagihan belum lunas. Status berubah otomatis setelah pembayaran terkonfirmasi.</p></div></div><div class="footer-actions"><button>Cek status pembayaran</button><button class="primary">Lihat customer display →</button></div>`;
const va=`<div class="row"><h2>Virtual Account</h2><span class="pill warning">◷ Menunggu transfer</span></div><div class="state-center"><h2>Nomor VA sudah tersedia</h2><p>Bank BCA · Contoh bank aktif<br>Nomor dan petunjuk transfer tampil di customer display.</p><div class="success-breakdown"><p class="small muted" style="margin:0">Nomor Virtual Account · Contoh</p><strong style="font-size:28px;letter-spacing:.05em">7001 2345 6789</strong><div class="bill-line"><span>Batas pembayaran</span><strong>8 Nov 2026 · 14.42</strong></div></div><div class="notice info" style="margin-top:20px"><strong>Belum lunas</strong><p>Jangan konfirmasi dari bukti transfer. Tunggu status terverifikasi.</p></div></div><div class="footer-actions"><button>Cek status pembayaran</button><button class="primary">Lihat customer display →</button></div>`;
const success=`<div class="row"><h2>Pembayaran selesai</h2><span class="pill success">✓ Lunas</span></div><div class="state-center"><div class="state-mark ok">✓</div><h2>Serahkan kembalian Rp 2.000</h2><p>Total Rp 248.000 sudah lunas.<br>Struk POS01–000048 siap dicetak.</p><div class="success-breakdown"><div class="bill-line"><span>DP reservasi</span><strong>Rp 100.000</strong></div><div class="bill-line"><span>QRIS</span><strong>Rp 100.000</strong></div><div class="bill-line"><span>Tunai untuk tagihan</span><strong>Rp 48.000</strong></div><div class="divider" style="margin:12px 0"></div><div class="bill-line"><span>Uang diterima</span><strong>Rp 50.000</strong></div><div class="bill-line"><span>Kembalian</span><strong>Rp 2.000</strong></div></div></div><div class="footer-actions"><button>Lihat e-receipt</button><button class="primary">Cetak struk & transaksi baru →</button></div>`;
document.querySelector('#screens').innerHTML=[page('methods','Pembayaran','Periksa tagihan, lalu pilih cara pelanggan membayar.',methods),page('split','Pembayaran gabungan','DP reservasi dan pembayaran yang lunas mengurangi sisa tagihan.',split,{split:true}),page('cash','Pembayaran tunai','Hitung uang diterima dan kembalian sebelum konfirmasi.',cash,{split:true}),page('qris-active','Pembayaran QRIS','Tunggu konfirmasi sebelum menyelesaikan tagihan.',qrisActive),page('qris-expired','Pembayaran QRIS','Status pembayaran diperbarui otomatis.',expired),page('failed','Pembayaran gagal','Pilih langkah berikut tanpa membuat ulang pesanan.',failed),page('va','Pembayaran Virtual Account','Nomor pembayaran tersedia di layar pelanggan.',va),page('success','Tagihan lunas','Pastikan pelanggan menerima kembalian dan struk.',success,{split:true,paid:true})].join('');
</script></body></html>
