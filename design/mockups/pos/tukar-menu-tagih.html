<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS · Tagih selisih tukar menu</title><link rel="stylesheet" href="common.css"><script src="common.js" defer></script><style>
.swap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;height:616px}.swap>.panel{display:flex;flex-direction:column;gap:14px}.box{background:var(--soft);border-radius:8px;padding:14px 16px}.methods{display:grid;gap:10px}.methods button,.sale{min-height:60px;text-align:left;padding:10px 16px;display:flex;align-items:center;gap:12px;width:100%}.sale{border:2px solid var(--edge);border-radius:8px}.sale span:first-of-type{flex:1}.sale small{display:block;font-weight:400;color:var(--hint)}.qr{width:170px;height:170px;margin:0 auto;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;color:var(--hint);font-size:16px;background:#fff}.center{text-align:center}.push{margin-top:auto}
</style></head><body><main id="screens"></main><script>
// Sisi kiri sama di semua keadaan: rincian penggantian dari server.
const detail=`<section class="panel"><div class="row"><h2>Penggantian menu</h2><span class="pill warning">◷ Belum lunas</span></div><p class="muted small">Pesanan POS-0048 · Meja A12</p><div class="divider" style="margin:0"></div><div class="row"><span>Menu tidak tersedia<br><small class="muted">Nasi ayam · 1 porsi</small></span><b>Rp 35.000</b></div><div class="row"><span>Menu pengganti<br><small class="muted">Nasi sapi · 1 porsi</small></span><b>Rp 45.000</b></div><div class="box row"><b>Selisih yang harus dibayar</b><b>Rp 10.000</b></div></section>`;
const due=`<div class="box"><p>Selisih</p><div class="amount-medium">Rp 10.000</div></div>`;
const screen=(id,pill,body)=>`<section class="screen" data-screen="${id}"><div class="page-heading"><div><h1>Tagih selisih</h1><p>Periksa penggantian menu sebelum melanjutkan pembayaran.</p></div><button>← Kembali ke pesanan</button></div><div class="swap">${detail}<section class="panel"><div class="row"><h2>Penagihan selisih</h2>${pill}</div>${body}</section></div></section>`;
const unpaid='<span class="pill warning">◷ Belum lunas</span>',wait='<span class="pill warning">◷ Menunggu</span>';
const methods=on=>`<div class="methods">${[['cash','Tunai'],['qris','QRIS'],['edc','EDC kartu']].map(([k,l])=>`<button class="${k===on?'selected':''}">${k===on?'◉':'○'} ${l}</button>`).join('')}</div>`;
document.getElementById('screens').innerHTML=[
screen('pilih',unpaid,due+methods('cash')+'<button class="primary full push">Tagih selisih · Tunai Rp 10.000 →</button>'),
screen('qris-aktif',wait,`${due}<div class="qr">Kode QRIS</div><p class="center"><span class="pill">◷ Berlaku 09:42 lagi</span></p><div class="notice info"><b>Menunggu pembayaran pelanggan</b><p>Metode lain terkunci sampai kode ini selesai.</p></div><button class="full push">Periksa status</button>`),
screen('qris-kedaluwarsa',unpaid,due+'<div class="notice"><b>Kode QRIS kedaluwarsa</b><p>Server memastikan kode lama belum dibayar.</p></div>'+methods('qris')+'<button class="primary full push">Buat QRIS baru</button>'),
screen('edc-kosong',unpaid,due+methods('edc')+'<div class="notice info"><b>Belum ada transaksi EDC yang disetujui</b><p>Transaksi muncul dari server. Nominal tidak diketik di sini.</p></div><button class="full push">Muat ulang transaksi</button>'),
screen('edc-disetujui','<span class="pill info">✓ Disetujui bank</span>',due+'<p class="small muted">Pilih transaksi EDC yang disetujui</p><div class="sale selected"><b>◉</b><span><b>EDC BCA 01</b><small>BCA · 14.31</small></span><b>Rp 10.000</b></div><button class="primary full push">Catat EDC Rp 10.000 →</button>'),
screen('edc-menunggu',wait,due+'<div class="notice"><b>Hasil EDC belum pasti</b><p>Jangan gesek ulang dan jangan ganti metode. Status diperiksa otomatis.</p></div><button class="full push">Periksa status</button>'),
screen('perlu-supervisor','<span class="pill danger">! Perlu supervisor</span>',due+'<div class="notice danger"><b>Pembayaran perlu diperiksa supervisor</b><p>Jangan terima uang lagi untuk tagihan ini.</p></div><button class="full push">Periksa status</button>'),
].join('');
</script></body></html>
