<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legend · Final arah A liquid glass</title><link rel="stylesheet" href="final-a-mobile.css"><main id="root"></main>
<script>
const screen=new URLSearchParams(location.search).get('layar')||'menu';
const paths={search:'M21 21l-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',back:'M15 18l-6-6 6-6',close:'M6 6l12 12M18 6L6 18',plus:'M12 5v14M5 12h14',minus:'M5 12h14',chevron:'M9 5l7 7-7 7',down:'M6 9l6 6 6-6',clock:'M12 8v5l3 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',check:'M5 12l4 4L19 6',bag:'M5 7h14l1 14H4L5 7M9 8V5a3 3 0 0 1 6 0v3',filter:'M4 6h16M7 12h10M10 18h4',help:'M12 17h.01M9 9a3 3 0 1 1 5 2c-1 1-2 1-2 3M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',alert:'M12 8v5M12 17h.01M12 2L2 21h20L12 2',qr:'M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 15h3v3h3v3h-6z',wallet:'M3 6h16v15H3zM3 6V3h13v3M15 12h6v5h-6z',store:'M4 10v11h16V10M2 10l3-7h14l3 7M2 10c0 3 5 3 5 0 0 3 5 3 5 0 0 3 5 3 5 0 0 3 5 3 5 0M9 21v-7h6v7',people:'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M2 21v-3c0-5 14-5 14 0v3M17 3a4 4 0 0 1 0 8M19 14c3 1 3 4 3 7',signal:'M3 18v3M8 13v8M13 8v13M18 3v18',battery:'M2 6h18v12H2zM22 10v4M5 9h12v6H5z',download:'M12 3v12M7 10l5 5 5-5M4 17v4h16v-4',refresh:'M21 10a9 9 0 1 0-1 7M21 3v7h-7'};
function icon(n){return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.plus}"/></svg>`}
function quantity(value=1){return `<div class="quantity"><button aria-label="Kurangi jumlah">${icon('minus')}</button><b>${value}</b><button aria-label="Tambah jumlah">${icon('plus')}</button></div>`}
function photo(i,cls=''){return `<div class="photo p${i} ${cls}" role="img" aria-label="Foto menu ilustratif"></div>`}
const menuItems=[['Espresso dingin','Espresso pekat,<br>disajikan dingin.',0],['Cappuccino','Espresso dan susu,<br>buihnya lembut.',1],['Roti ayam panggang','Ayam panggang,<br>selada dan tomat.',2],['Croissant mentega','Renyah di luar,<br>lembut di dalam.',3],['Americano es','Espresso dan air,<br>dengan es batu.',0],['Latte hangat','Kopi dan susu,<br>hangat dan lembut.',1]];
function card(i,cart=false,sold=false){const [name,desc,p]=menuItems[i];return `<article class="card ${sold?'sold-card':''}"><div class="photo p${p} ${sold?'sold':''}" role="img" aria-label="Foto ilustratif ${name}">${cart&&i===0?quantity():!sold?`<button class="add-round" aria-label="Tambah ${name}">${icon('plus')}</button>`:''}</div><h3>${name}</h3>${sold?'<span class="sold-label">Habis hari ini</span>':''}<p class="description">${sold?'Belum bisa dipesan.':desc}</p><div class="price">Rp 23.000</div></article>`}
function menuHeader(joined=true){return `<header class="glass glass-light floating-header"><div class="header-row"><div class="brand">Cafe Legend<span class="brand-context">Meja A01${joined?' · 2 tamu · <button>Ubah</button>':''}</span></div><div class="header-actions"><button class="icon-button" aria-label="Cari di semua menu">${icon('search')}</button></div></div><nav class="categories"><button class="active">Semua</button><button>Kopi</button><button>Makanan</button><button class="filter" aria-label="Filter menu">${icon('filter')}</button></nav></header>`}
function cartbar(){return `<button class="glass glass-dark cart-bar"><span><small>Subtotal · 1 item</small><b class="amount">Rp 23.000</b></span><span class="cart-action">Lihat keranjang<span class="arrow">${icon('chevron')}</span></span></button>`}
function menu(kind='menu'){const initial=kind==='initial',guests=kind==='guests',empty=initial||guests,stock=kind==='stock';return `${empty?'<div class="photo-band"></div>':''}${menuHeader(!empty)}${empty?`<div class="guest-bar">${guests?`<div class="row between"><b>Jumlah tamu</b><button aria-label="Tutup pilihan tamu">${icon('close')}</button></div><p class="guest-help">Isi sebelum menambah menu pertama.</p><div class="guest-controls">${quantity(2)}<button class="save">Simpan</button></div>`:`<span class="row">${icon('people')} Jumlah tamu · <b>Pilih</b></span><button aria-label="Pilih jumlah tamu">${icon('chevron')}</button>`}</div><p class="tax-note">Harga belum termasuk pajak dan service.</p>`:''}<div class="catalog">${(empty?menuItems.slice(0,4):menuItems).map((_,i)=>card(i,!empty,stock&&i===1)).join('')}</div>${stock?`<div class="network-notice">${icon('alert')}<p>Menu belum diperbarui.<br>Keranjang tetap tersimpan.</p><button>Coba lagi</button></div>`:''}${!empty?cartbar():''}`}
function nav(title,close=false){return `<header class="glass glass-light nav-glass"><button class="icon-button" aria-label="${close?'Tutup detail':'Kembali'}">${icon(close?'close':'back')}</button><h1>${title}</h1><span class="end"></span></header>`}
function detail(){return `${photo(0,'hero')}${nav('Pilihan menu',true)}<div class="detail-body"><div class="detail-title"><h1>Espresso dingin</h1><span class="price">Rp 23.000</span></div><p class="detail-description">Espresso pekat dengan es. Atur manisnya sesuai selera Anda.</p><section class="field-group"><div class="group-head"><h2>Suhu</h2><small>Wajib · Pilih 1</small></div><div class="choices"><button class="option selected"><span class="radio on"></span>Dingin</button><button class="option"><span class="radio"></span>Panas</button></div></section><section class="error-field"><div class="group-head"><h2>Tingkat gula</h2><small>Wajib · Pilih 1</small></div><div class="choices"><button class="option"><span class="radio"></span>Normal</button><button class="option"><span class="radio"></span>Tanpa gula</button></div><p class="error-message">${icon('alert')} Pilih tingkat gula sebelum menambahkan.</p></section><section class="field-group"><div class="group-head"><h2>Tambahan</h2><small>Opsional</small></div><div class="option-row"><span class="row"><i class="checkbox"></i>Ekstra espresso</span><span class="meta muted">+ Rp 5.000</span></div></section><section class="field-group"><div class="group-head"><h2>Catatan dapur</h2><small>Opsional</small></div><div class="note">Contoh: es sedikit</div></section></div><footer class="glass glass-light float-footer detail-footer">${quantity()}<button class="primary">Tambah · Rp 23.000</button></footer>`}
function bill(){return `<div class="bill">${[['Subtotal menu','Rp 23.000'],['Service 5%','Rp 1.150'],['PBJT 10%','Rp 2.415'],['Pembulatan','Rp 35']].map(x=>`<div class="bill-row"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div>`}
function checkout(){return `<div class="photo-band"></div>${nav('Keranjang & bayar')}<div class="checkout-main"><p class="table-note">Meja A01 · Keranjang bersama</p><div class="checkout-item">${photo(0)}<div class="item-info"><div class="row between"><h2>Espresso dingin</h2><span class="amount">Rp 23.000</span></div><p>Gula normal · Ditambahkan Anda</p><div class="item-tools"><button class="text-link">Ubah pilihan</button>${quantity()}</div></div></div><p class="eta-line">${icon('clock')} Estimasi siap <b>10–16 menit</b></p><div class="checkout-tools"><button class="text-link">Tambah menu</button><button class="text-link">Kode promo / voucher</button><button class="text-link">Bagi tagihan</button></div>${bill()}<section class="methods"><h2>Metode bayar</h2>${[['qr','QRIS','Scan dari bank / e-wallet'],['wallet','E-wallet','Pilih aplikasi saat melanjutkan'],['store','Bayar di kasir','Tunjukkan kode ke kasir']].map((x,i)=>`<div class="method ${i===0?'selected':''}"><span class="mark">${icon(x[0])}</span><div class="method-text">${x[1]}<small>${x[2]}</small></div><span class="radio ${i===0?'on':''}"></span></div>`).join('')}</section><p class="kitchen-note">Pesanan masuk dapur setelah pembayaran diterima.</p></div><footer class="glass glass-light float-footer checkout-footer"><div class="total"><span>Total pembayaran</span><b>Rp 26.600</b></div><button class="primary">Bayar Rp 26.600 dengan QRIS ${icon('chevron')}</button></footer>`}
function qris(){return `<div class="photo-band"></div>${nav('Bayar dengan QRIS')}<div class="payment-main"><p class="eyebrow">Total pembayaran</p><div class="pay-total">Rp 26.600</div><div class="timer">${icon('clock')} Sisa waktu <b>04:58</b></div><div class="qris-paper"><h2>Cafe Legend</h2><p class="meta">Meja A01 · Pesanan QR-0044</p><img src="assets/qris-contoh.svg" alt="QR contoh untuk review desain, bukan QR pembayaran"><p class="sample-qr">QR contoh · Tidak untuk pembayaran</p></div><p class="waiting-state"><span class="waiting-dot"></span>Menunggu pembayaran</p><p class="pay-instructions">Scan atau simpan QR, lalu bayar melalui aplikasi bank atau e-wallet Anda.</p><p class="meta muted" style="margin-top:8px">Status pembayaran diperbarui otomatis.</p></div><footer class="glass glass-light float-footer pay-footer"><button class="primary">${icon('download')} Simpan QR</button><button class="text-link">Ganti metode bayar</button></footer>`}
function cashier(){return `<div class="photo-band"></div>${nav('Bayar di kasir')}<div class="cashier-main"><span class="status-pill">${icon('clock')} Menunggu pembayaran</span><h1>Tunjukkan kode ini<br>ke kasir</h1><p class="cashier-lead">Pesanan tersimpan, belum masuk dapur.</p><div class="code-paper"><div class="row between"><b>Cafe Legend</b><span class="muted">Meja A01</span></div><div class="large-code">LG–0044</div><div class="code-total"><span>Total pembayaran</span><b>Rp 26.600</b></div><p class="meta">1× Espresso dingin · Termasuk pajak dan service</p></div><div class="cashier-steps"><div class="cashier-step"><span class="n">1</span><div><strong>Datangi kasir</strong><p>Tunjukkan kode dan bayar sesuai total.</p></div></div><div class="cashier-step"><span class="n">2</span><div><strong>Kasir menerima uang</strong><p>Setelah itu, pesanan diteruskan ke dapur.</p></div></div><div class="cashier-step"><span class="n">3</span><div><strong>Ikuti status pesanan</strong><p>Status pembayaran diperbarui otomatis.</p></div></div></div></div><footer class="glass glass-light float-footer cashier-footer"><button class="primary">Periksa pembayaran ${icon('refresh')}</button></footer>`}
function success(){return `<div class="photo-band"></div>${nav('Cafe Legend')}<div class="success-main"><div class="success-title"><span class="success-check">${icon('check')}</span><h1>Pembayaran berhasil</h1></div><p class="success-lead">Terima kasih. Pesanan Anda<br>sudah diterima dapur.</p><div class="success-paper"><div class="row between"><span class="paid">Total dibayar</span><b class="meta">QRIS</b></div><div class="price">Rp 26.600</div><div class="receipt-split"><div class="bill-row"><span>Pesanan</span><b>QR-0044</b></div><div class="bill-row"><span>Meja</span><b>A01 · 2 tamu</b></div></div><div class="receipt-item">${photo(0)}<div><h2>1× Espresso dingin</h2><p>Gula normal · Rp 23.000</p><p>Total termasuk pajak dan service.</p></div></div></div><div class="eta-success">${icon('clock')}<div><b>Estimasi siap 10–16 menit</b><p>Ikuti perkembangannya di status pesanan.</p></div></div><section class="points"><h2>Tetap dapat poin sebagai tamu</h2><p>Masuk untuk klaim poin dari pesanan ini.</p><button>Masuk dan klaim poin</button></section></div><footer class="glass glass-light float-footer success-footer"><button class="primary">Lihat status pesanan ${icon('chevron')}</button><button class="text-link">Lihat struk</button></footer>`}
const names={menu:'menu',awal:'initial',tamu:'guests',detail:'detail',checkout:'checkout',qris:'qris',kasir:'cashier',berhasil:'success',habis:'stock'};
document.getElementById('root').innerHTML=`<div class="phone ${names[screen]||'menu'}"><div class="status"><span>9.41</span><span class="row">${icon('signal')}${icon('battery')}</span></div>${({menu:()=>menu(),awal:()=>menu('initial'),tamu:()=>menu('guests'),detail,checkout,qris,kasir:cashier,berhasil:success,habis:()=>menu('stock')}[screen]||(()=>menu()))()}</div>`;
</script></html>
