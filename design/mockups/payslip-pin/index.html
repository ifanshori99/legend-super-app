<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review · PIN slip gaji</title><style>
@font-face{font-family:Jakarta;src:url('../assets/plus-jakarta-sans-latin.woff2')}*{box-sizing:border-box}body{margin:0;background:#f7f6f4;color:#1d2829;font:16px/1.5 Jakarta,'Arial',sans-serif}a{color:#0f5e68}button{font:inherit;cursor:pointer}.top{height:68px;background:#fff;border-bottom:1px solid #e5e5e1;display:flex;align-items:center;padding:0 5%;gap:18px}.logo{font-weight:800;letter-spacing:-1px;font-size:23px}.logo i{color:#0f5e68;font-style:normal}.top span{color:#687575;border-left:1px solid #ddd;padding-left:18px;font-size:14px}.wrap{max-width:1080px;margin:0 auto;padding:38px 24px 72px}.back{font-weight:650;font-size:14px;color:#426365}.heading{margin:24px 0 26px}.eyebrow{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#557071}.heading h1{font-size:30px;line-height:1.2;letter-spacing:-.04em;margin:7px 0}.heading p,.muted{color:#596969}.layout{display:grid;grid-template-columns:1fr 330px;gap:28px;align-items:start}.card{background:white;border:1px solid #dedfdb;border-radius:12px;padding:32px}.card h2{font-size:23px;line-height:1.25;letter-spacing:-.025em;margin:0 0 8px}.card p{margin:0 0 24px}.side{padding:24px;background:#edece7;border-radius:12px}.side h3{margin:0 0 10px;font-size:16px}.side p{margin:0;color:#596969;font-size:14px}.rule{border:0;border-top:1px solid #e8e9e5;margin:24px 0}.label{display:block;font-weight:700;margin:20px 0 8px}.pin{display:flex;gap:8px}.digit{width:47px;height:52px;border:1px solid #abb7b4;border-radius:8px;display:grid;place-items:center;font-size:22px;font-weight:700}.digit.focus{outline:2px solid #0f5e68;outline-offset:1px}.help{font-size:14px;color:#596969;margin:8px 0 0!important}.btn{display:block;width:100%;border:0;border-radius:8px;min-height:50px;background:#0f5e68;color:white;font-weight:700;margin-top:24px}.btn.secondary{background:#fff;color:#0f5e68;border:1px solid #0f5e68;margin-top:12px}.btn.disabled{background:#e2e7e5;color:#677674}.link{display:block;margin-top:18px;font-weight:700;text-align:center;text-decoration:none}.notice{border-left:4px solid #b65a35;background:#fff4ee;padding:14px 16px;margin:20px 0;border-radius:0 8px 8px 0;font-size:15px}.notice strong{display:block}.notice.info{background:#edf5f3;border-color:#0f5e68}.notice.grey{background:#f1f2ef;border-color:#788681}.period{border:1px solid #e4e8e5;border-radius:8px;padding:16px;margin:20px 0;display:flex;justify-content:space-between;gap:12px}.period small{display:block;color:#637270}.status{font-size:13px;color:#596969}.textarea{border:1px solid #aeb9b6;border-radius:8px;min-height:92px;padding:12px;color:#687774}.skeleton{height:18px;background:#e8ecea;border-radius:6px;margin:16px 0}.skeleton.short{width:55%}.review{max-width:1100px;margin:0 auto;padding:40px 24px}.review h1{font-size:32px;letter-spacing:-.04em}.review p{max-width:780px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.item{background:#fff;padding:20px;border:1px solid #ddd;border-radius:10px}.item h2{font-size:17px;margin:0 0 7px}.item a{margin-right:16px;font-size:14px;font-weight:700}.tag{font-size:13px;color:#667}.sample{background:#fff3e7;padding:16px;border-left:4px solid #b65a35;margin:24px 0}.crumb{font-size:14px;color:#596969}.confirm{background:#f8f8f6;border:1px solid #e1e4e1;padding:16px;border-radius:8px;margin:20px 0}.confirm strong{display:block}.compact .label{margin-top:14px}.compact .digit{height:46px}.compact .btn{margin-top:18px}@media(max-width:700px){.top{height:58px;padding:0 20px}.top span{font-size:13px}.wrap{padding:24px 16px 48px}.heading{margin:20px 0}.heading h1{font-size:26px}.layout{display:block}.card{padding:24px 20px}.side{margin-top:16px;padding:20px}.digit{width:42px;height:50px}.card h2{font-size:21px}.review{padding:24px 16px}.compact .card{padding-top:20px}}
</style></head><body><main id="app"></main><script>
const screens={
'buat-pin':{title:'Buat PIN slip gaji',desc:'Buat PIN pribadi untuk membuka slip gaji Anda.',body:`<label class="label">PIN baru</label><div class="pin">${boxes()}</div><p class="help">Gunakan 6 angka yang mudah Anda ingat.</p><label class="label">Ulangi PIN baru</label><div class="pin">${boxes()}</div><button class="btn">Simpan PIN</button>`,side:'PIN hanya dibuat dan diketahui oleh Anda. HR dapat mereset PIN, tetapi tidak dapat melihat atau menentukan PIN Anda.'},
'buka-slip':{title:'Masukkan PIN',desc:'Masukkan PIN pribadi untuk membuka slip gaji.',body:`<div class="period"><div><strong>Slip gaji Oktober 2026</strong><small>Periode gaji</small></div><span>›</span></div><label class="label">PIN slip gaji</label><div class="pin">${boxes(0,true)}</div><button class="btn">Buka slip gaji</button><a class="link" href="#">Lupa PIN?</a>`,side:'Isi dan nominal slip baru ditampilkan setelah PIN Anda benar.'},
'pin-salah':{title:'Masukkan PIN',desc:'Masukkan PIN pribadi untuk membuka slip gaji.',body:`<div class="period"><div><strong>Slip gaji Oktober 2026</strong><small>Periode gaji</small></div></div><label class="label">PIN slip gaji</label><div class="pin">${boxes(6)}</div><div class="notice"><strong>PIN belum benar</strong>Periksa PIN dan coba lagi. Contoh: 2 percobaan tersisa.*</div><button class="btn">Coba lagi</button><a class="link" href="#">Lupa PIN?</a>`,side:'*Jumlah percobaan tersisa memerlukan tambahan pada respons API. Angka di sini hanya contoh desain.'},
'terkunci':{title:'PIN terkunci sementara',desc:'PIN salah 5 kali. Untuk melindungi slip gaji Anda, akses dikunci selama 15 menit.',body:`<div class="notice"><strong>Coba lagi setelah waktu penguncian berakhir</strong>Anda juga dapat meminta bantuan HR untuk mereset PIN.</div><button class="btn secondary">Kembali ke daftar slip</button><a class="link" href="#">Lupa PIN?</a>`,side:'Setelah HR mereset PIN, Anda membuat PIN baru sendiri.'},
'lupa-pin':{title:'Lupa PIN?',desc:'Pilih cara untuk memulihkan akses ke slip gaji Anda.',body:`<div class="notice grey"><strong>Kode WhatsApp belum tersedia</strong>Fitur ini sedang disiapkan. Silakan hubungi HR untuk mereset PIN Anda.</div><button class="btn disabled" disabled>Minta kode WhatsApp</button><div class="rule"></div><h3>Hubungi HR</h3><p class="muted">Minta HR mereset PIN. Setelah direset, buat PIN baru sendiri saat membuka slip.</p><button class="btn secondary">Kembali ke daftar slip</button>`,side:'HR tidak dapat melihat atau menentukan PIN Anda. Saluran kontak HR perlu ditetapkan sebelum implementasi.'},
'ubah-pin':{title:'Ubah PIN',desc:'Masukkan PIN saat ini, lalu buat PIN baru.',body:`<label class="label">PIN saat ini</label><div class="pin">${boxes()}</div><label class="label">PIN baru</label><div class="pin">${boxes()}</div><label class="label">Ulangi PIN baru</label><div class="pin">${boxes()}</div><button class="btn">Simpan PIN baru</button><a class="link" href="#">Lupa PIN saat ini?</a>`,side:'PIN saat ini diperlukan untuk mengubah PIN. Kesalahan PIN juga dihitung dalam batas percobaan.'},
'hr-reset':{title:'Reset PIN karyawan?',desc:'Tindakan ini menghapus PIN lama dan membuka penguncian PIN.',body:`<div class="confirm"><strong>Contoh karyawan</strong><span class="muted">Karyawan · Data contoh</span></div><p>Karyawan akan membuat PIN baru sendiri saat berikutnya membuka slip gaji. HR tidak dapat melihat atau menentukan PIN.</p><label class="label">Alasan reset</label><div class="textarea">Tuliskan alasan reset PIN</div><p class="help">Wajib diisi, 3–500 karakter.</p><button class="btn">Ya, reset PIN</button><button class="btn secondary">Batal</button>`,side:'Konfirmasi ini menunjukkan konsekuensi reset sebelum HR melanjutkan.'},
'kosong':{title:'Belum ada slip gaji',desc:'Slip gaji Anda akan muncul di sini setelah tersedia.',body:`<div class="notice info"><strong>Belum ada slip untuk ditampilkan</strong>Hubungi HR jika Anda merasa slip seharusnya sudah tersedia.</div><button class="btn secondary">Muat ulang</button>`,side:'Daftar hanya menampilkan informasi periode dan riwayat pembukaan, tanpa nominal gaji.'},
'memuat':{title:'Memuat slip gaji',desc:'Mohon tunggu sebentar.',body:`<div class="skeleton short"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton short"></div><p class="status">Sedang memuat daftar slip…</p>`,side:'Bentuk pemuatan mengikuti daftar slip agar perubahan tampilan tetap tenang.'},
'error':{title:'Slip gaji tidak dapat dimuat',desc:'Terjadi masalah saat mengambil daftar slip gaji.',body:`<div class="notice"><strong>Periksa koneksi Anda</strong>Jika masalah berlanjut, hubungi HR.</div><button class="btn">Coba lagi</button>`,side:'Data gaji tidak ditampilkan saat daftar gagal dimuat.'},
'kode-dibatasi':{title:'Terlalu banyak permintaan kode',desc:'Anda telah mencapai batas permintaan kode WhatsApp.',body:`<div class="notice"><strong>Coba lagi nanti</strong>Atau hubungi HR untuk mereset PIN Anda.</div><button class="btn secondary">Kembali ke daftar slip</button>`,side:'Keadaan 429 untuk alur WhatsApp setelah layanan tersedia. Tidak menunjukkan kode sudah terkirim.'},
'pin-tersimpan':{title:'PIN berhasil disimpan',desc:'PIN pribadi Anda siap digunakan untuk membuka slip gaji.',body:`<div class="notice info"><strong>PIN sudah aktif</strong>Jangan bagikan PIN Anda kepada siapa pun.</div><button class="btn">Lanjut ke slip gaji</button>`,side:'Karyawan membuat dan menyimpan PIN-nya sendiri.'}
};function boxes(n=0,focus=false){return Array.from({length:6},(_,i)=>`<span class="digit ${focus&&i===0?'focus':''}">${i<n?'•':''}</span>`).join('')};const key=new URLSearchParams(location.search).get('screen');const app=document.getElementById('app');if(key&&screens[key]){const s=screens[key];app.innerHTML=`<header class="top"><div class="logo">legend<i>.</i></div><span>${key==='hr-reset'?'HR · Karyawan':'Karyawan · Slip gaji'}</span></header><div class="wrap ${key==='ubah-pin'?'compact':''}"><div class="back">← &nbsp;${key==='hr-reset'?'Detail karyawan':'Slip gaji'}</div><div class="heading"><div class="eyebrow">${key==='hr-reset'?'Pengaturan karyawan':'Privasi gaji'}</div><h1>${key==='hr-reset'?'Reset PIN slip gaji':'Slip gaji'}</h1><p>${key==='hr-reset'?'Kelola akses PIN karyawan':'Akses informasi gaji Anda secara pribadi.'}</p></div><div class="layout"><section class="card"><h2>${s.title}</h2><p class="muted">${s.desc}</p>${s.body}</section><aside class="side"><h3>Informasi</h3><p>${s.side}</p></aside></div></div>`}else{app.innerHTML=`<div class="review"><div class="eyebrow">Legend · review founder</div><h1>PIN slip gaji</h1><p>Alur pribadi untuk karyawan, dengan reset oleh HR. Pilih layar untuk melihat mockup; PNG tersedia pada dua ukuran. Semua nama, periode dan angka contoh hanya untuk ilustrasi.</p><div class="sample"><strong>Keputusan dan batas teknis</strong><br>PIN dibuat karyawan sendiri. HR hanya mereset. WhatsApp belum tersedia; jumlah sisa percobaan perlu ditambahkan ke API agar akurat. Tampilan 429 adalah rancangan untuk saat layanan kode tersedia.</div><div class="grid">${Object.entries(screens).map(([k,s])=>`<article class="item"><h2>${s.title}</h2><p class="tag">${s.desc}</p><a href="?screen=${k}">Lihat layar</a><a href="${k}-mobile.png">390 px</a><a href="${k}-desktop.png">1280 px</a></article>`).join('')}</div></div>`}
</script></body></html>
