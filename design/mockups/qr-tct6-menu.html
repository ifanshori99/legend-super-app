<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu QR · Foto menu</title><link rel="stylesheet" href="final-a-mobile.css"><style>
.phone{background:var(--canvas)}.catalog.qr-catalog{top:166px;row-gap:22px}.qr-catalog .card h3{white-space:normal}.monogram{background:#e8e0d7;color:#66564b;display:grid;place-items:center;font-size:38px;font-weight:700;letter-spacing:-1px}.monogram:before{display:none}.monogram .add-round{color:var(--ink)}.state-copy{position:absolute;top:240px;left:36px;right:36px;text-align:center}.state-icon{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 18px;border:1px solid var(--line);border-radius:50%;font-size:26px;background:var(--paper)}.state-copy h1{font-size:22px;line-height:30px}.state-copy p{font-size:16px;line-height:24px;color:var(--muted);margin:8px 0 18px}.state-copy button{border:1px solid var(--edge);border-radius:12px;min-height:48px;padding:0 20px;font-weight:700;background:var(--paper)}.skeleton{background:#e8e1d9;border-radius:8px}.skeleton.photo:before{display:none}.skeleton.line{height:16px;margin-top:12px;width:80%}.skeleton.short{width:48%;margin-top:8px}.media-note{font-size:12px;color:var(--muted);line-height:18px;margin-top:4px}.detail .hero.monogram{font-size:52px}.detail-body .normal-group{margin-top:8px}.notice{position:absolute;left:20px;right:20px;bottom:112px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:20px;z-index:4}.notice strong{display:block}.notice button{text-decoration:underline;font-weight:700;margin-top:4px;min-height:32px}
</style></head><body><main id="root"></main><script>
const state=new URLSearchParams(location.search).get('layar')||'menu';
const icon=(path)=>`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${path}"/></svg>`;
const search=icon('M21 21l-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0'),plus=icon('M12 5v14M5 12h14'),close=icon('M6 6l12 12M18 6L6 18');
const header=`<header class="glass glass-light floating-header"><div class="header-row"><div class="brand">Cafe Legend<span class="brand-context">Meja A01 · 2 tamu · <button>Ubah</button></span></div><button class="icon-button" aria-label="Cari menu">${search}</button></div><nav class="categories"><button class="active">Semua</button><button>Kopi</button><button>Makanan</button><button class="filter" aria-label="Filter menu">☰</button></nav></header>`;
const items=[['Espresso dingin','Espresso pekat, disajikan dingin.',0,'Rp 23.000'],['Cappuccino','Espresso dan susu, buihnya lembut.',1,'Rp 23.000'],['Roti ayam panggang','Ayam panggang, selada dan tomat.',2,'Rp 23.000'],['Croissant mentega','Renyah di luar, lembut di dalam.',3,'Rp 23.000']];
function card(x,i){let tile=i===1?`<div class="photo monogram" role="img" aria-label="Cappuccino, tanpa foto">C<button class="add-round" aria-label="Tambah Cappuccino">${plus}</button></div>`:`<div class="photo p${x[2]}" role="img" aria-label="Foto ${x[0]}"><button class="add-round" aria-label="Tambah ${x[0]}">${plus}</button></div>`;return `<article class="card">${tile}<h3>${x[0]}</h3><p class="description">${x[1]}</p><div class="price">${x[3]}</div></article>`}
const cart=`<div class="glass glass-dark cart-bar" style="min-height:80px"><button class="cart-main"><span><small>Subtotal · 1 item</small><b class="amount">Rp 23.000</b></span><span class="cart-action">Lihat keranjang <span class="arrow">›</span></span></button></div>`;
function catalog(){return `${header}<div class="catalog qr-catalog">${items.map(card).join('')}</div>${cart}`}
function detail(missing=false,error=false){return `<div class="photo hero ${missing?'monogram':'p0'}" role="img" aria-label="${missing?'Cappuccino, tanpa foto':'Foto Espresso dingin'}">${missing?'C':''}</div><header class="glass glass-light nav-glass"><button class="icon-button" aria-label="Tutup detail">${close}</button><h1>Pilihan menu</h1><span class="end"></span></header><div class="detail-body"><div class="detail-title"><h1>${missing?'Cappuccino':'Espresso dingin'}</h1><span class="price">Rp 23.000</span></div><p class="detail-description">${missing?'Espresso dan susu, buihnya lembut.':'Espresso pekat dengan es batu.'}</p><section class="field-group"><div class="group-head"><h2>Suhu</h2><small>Wajib · Pilih 1</small></div><div class="choices"><button class="option selected"><span class="radio on"></span>Dingin</button><button class="option"><span class="radio"></span>Panas</button></div></section><section class="${error?'error-field':'field-group normal-group'}"><div class="group-head"><h2>Tingkat gula</h2><small>Wajib · Pilih 1</small></div><div class="choices"><button class="option ${error?'':'selected'}"><span class="radio ${error?'':'on'}"></span>Normal</button><button class="option"><span class="radio"></span>Tanpa gula</button></div>${error?'<p class="error-message">⚠ Pilih tingkat gula sebelum menambahkan.</p>':''}</section><section class="field-group"><div class="group-head"><h2>Tambahan</h2><small>Opsional</small></div><div class="option-row"><span class="row"><i class="checkbox"></i>Ekstra espresso</span><span class="meta muted">+ Rp 5.000</span></div></section><section class="field-group"><div class="group-head"><h2>Catatan dapur</h2><small>Opsional</small></div><div class="note">Contoh: es sedikit</div></section></div><footer class="glass glass-light float-footer detail-footer"><div class="quantity" style="border:1px solid var(--edge)"><button aria-label="Kurangi jumlah">−</button><b>1</b><button aria-label="Tambah jumlah">+</button></div><button class="primary">Tambah · Rp 23.000</button></footer>`}
function empty(){return `${header}<div class="state-copy"><div class="state-icon">⌕</div><h1>Menu tidak ditemukan</h1><p>Coba kata kunci lain atau hapus filter untuk melihat menu yang tersedia.</p><button>Hapus filter</button></div>`}
function load(){return `${header}<div class="catalog qr-catalog" aria-label="Memuat menu">${[1,2,3,4].map(()=>'<div><div class="skeleton photo"></div><div class="skeleton line"></div><div class="skeleton line short"></div></div>').join('')}</div>`}
function failure(){return `${header}<div class="state-copy"><div class="state-icon">!</div><h1>Menu belum dapat dimuat</h1><p>Periksa koneksi Anda, lalu coba lagi. Keranjang Anda tetap tersimpan.</p><button>Coba lagi</button></div>`}
const isDetail=state.startsWith('detail');let content=state==='menu'?catalog():state==='kosong'?empty():state==='memuat'?load():state==='gagal'?failure():detail(state==='detail-tanpa-foto',state==='detail-error');document.getElementById('root').innerHTML=`<div class="phone ${isDetail?'detail':''}"><div class="status"><span>9.41</span><span>▥ ▰</span></div>${content}</div>`;
</script></body></html>
